{{- if not .Values.externalSecrets.enabled }}
{{- /*
  Rendered from .Values.secrets only when you are NOT delegating the Secret to
  external-secrets / sealed-secrets. Real values must come from a gitignored
  -f file or --set, never from values.yaml in the repo.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "opsmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    With deps.enabled the chart also RUNS postgres/rabbitmq/minio, so a blank
    infra password would just make the bundled server and its clients agree on
    "" — except the postgres image refuses to boot without one. Default those
    three to a demo value when unset so `--set deps.enabled=true` needs nothing
    else. The Keycloak/OAuth client secrets are NOT defaulted: they must match
    the realm JSON, so a real -f secrets file is still required for the app
    login flows (the deps bundle only removes the "stand up the servers" step).
  */}}
  {{- $demoDefaults := dict "DB_PASSWORD" "opsmind-demo" "RABBITMQ_PASSWORD" "opsmind-demo" "ATTACHMENT_STORAGE_SECRET_KEY" "opsmind-demo-secret" }}
  {{- range $k, $v := .Values.secrets }}
  {{- $val := $v }}
  {{- if and $.Values.deps.enabled (not $v) (hasKey $demoDefaults $k) }}
  {{- $val = index $demoDefaults $k }}
  {{- end }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- end }}
