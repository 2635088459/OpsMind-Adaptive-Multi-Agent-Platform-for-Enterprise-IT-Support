{{- if not .Values.externalSecrets.enabled }}
{{- /*
  Rendered from .Values.secrets only when you are NOT delegating the Secret to
  external-secrets / sealed-secrets. Real values must come from a gitignored
  -f file or --set, never from values.yaml in the repo.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "opsmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
