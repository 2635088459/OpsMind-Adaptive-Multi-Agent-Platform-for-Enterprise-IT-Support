# Copy to values-secrets.yaml (gitignored) and fill in, then:
#   helm upgrade --install opsmind infrastructure/helm/opsmind \
#     -n opsmind --create-namespace \
#     -f infrastructure/helm/opsmind/values-secrets.yaml
#
# Or skip this file entirely: set externalSecrets.enabled=true in values.yaml
# and let external-secrets-operator / sealed-secrets manage
# Secret/opsmind-shared-secrets instead.

secrets:
  DB_PASSWORD: "REPLACE_ME"
  RABBITMQ_PASSWORD: "REPLACE_ME"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_ME"            # user-access-authentication-service's OAuth2 client
  SUPPORT_CONSOLE_CLIENT_SECRET: "REPLACE_ME"
  ATTACHMENT_STORAGE_SECRET_KEY: "REPLACE_ME"
  AGENT_RUNTIME_SERVICE_CLIENT_SECRET: "REPLACE_ME"
  # Optional — leave "" to run without real LLM calls.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
