# owner: platform-wide
# rollback: git revert <sha>; docker compose -f local-platform.yml -f full-platform.yml down
#
# NEW (2026-09-01): the first real docker-compose bringing up all 7 real
# hexagonal services together, on top of local-platform.yml's existing shared
# Postgres/RabbitMQ. Every service defaults to the SAME shared "ticket_workflow"
# database (confirmed live across every service's settings/application-local.yml)
# with its own dedicated schema — not a separate database per service. Invoke
# with BOTH files:
#
#   docker compose -f infrastructure/docker-compose/local-platform.yml \
#                  -f infrastructure/docker-compose/full-platform.yml \
#                  up -d --build
#
# 2026-09-08: the two frontends (employee-portal :5173, support-console :5174)
# are now in this same compose — one `up -d` boots the whole platform, UI
# included. They are static nginx images; the browser calls the backends
# through the host port mappings, so no VITE_* build args and no dev server.
# Stop any local `pnpm dev` on 5173/5174 first (port clash). Both frontend
# E2E suites (apps/*/e2e) pass against these containers.
#
# domain 08 (observability-platform) has no service of its own (infra-config
# only, per its own README) and is deliberately not included here — its own
# infrastructure/docker-compose/observability-stack.yml is a separate stack.
#
# Real, honest scope for this first pass: user-access-authentication-service's
# OIDC-gated browser-login flows need a real Keycloak instance, which does not
# exist as a standing container anywhere in this repo (infrastructure/keycloak/
# is an empty placeholder — confirmed during SPEC-OP-030). This compose brings
# the service up regardless (Spring's OAuth2 resource server validates JWKS
# lazily, not at startup) and documents this as a real, stated limitation of
# this first integration pass, not a hidden gap.

services:
  # Real Keycloak, added live during project-level integration verification
  # (2026-09-01): every non-actuator endpoint on the 2 Spring resource-server
  # services below requires a genuinely signed JWT (`.anyRequest()
  # .authenticated()` + `oauth2ResourceServer().jwt()`, no local-dev bypass),
  # so a real cross-domain business-flow test needs a real issuer, not a
  # forged token.
  #
  # Real bug found live: KC_HOSTNAME set to a bare hostname (`keycloak`) only
  # pins the host part of every issued `iss` claim under Keycloak 25's
  # default hostname:v2 provider -- the PORT still tracks whatever port the
  # caller's own request came in on (8081 from the host-mapped port, 8080
  # from a sibling container on the internal network), so the discovery
  # document's own `issuer` field silently disagreed with itself depending
  # on who asked. KC_HOSTNAME must be a full base URL (scheme+host+port) to
  # pin the whole thing, which is what every resource-server service's own
  # KEYCLOAK_ISSUER_URI below must then match exactly.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: opsmind-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/opsmind-realm.json:/opt/keycloak/data/import/opsmind-realm.json:ro
    ports:
      - "8081:8080"
      # Real bug found live 2026-09-02, first real browser login attempt:
      # KC_HOSTNAME above is pinned to the literal "keycloak:8080" string on
      # purpose (every other service's own KEYCLOAK_ISSUER_URI must match it
      # exactly to validate a token's real iss claim — see this file's own
      # comment on KC_HOSTNAME for the full history). That means Keycloak's
      # OWN rendered pages (its hosted login form, the discovery document's
      # authorization_endpoint) always embed "keycloak:8080" too, regardless
      # of which URL the caller actually used to reach it — but the real
      # browser driving a login runs on the HOST machine, which cannot
      # resolve the Docker-internal hostname "keycloak" at all no matter what
      # port. This second mapping, PLUS a one-time `/etc/hosts` entry the
      # user adds themselves (`127.0.0.1 keycloak` — never edited by this
      # session), lets the real browser reach this exact same container on
      # the exact same port number Keycloak already claims for itself, with
      # zero change to KC_HOSTNAME/iss and zero impact on every other
      # service's own already-working container-to-container calls (those
      # still resolve "keycloak" via Docker's own internal DNS, entirely
      # unaffected by a host-machine-only hosts-file entry).
      - "8080:8080"
    healthcheck:
      # Real bug found live: Keycloak 25's health endpoints live on the
      # separate management interface (port 9000, confirmed via this
      # container's own boot log: "Management interface listening on
      # http://0.0.0.0:9000"), not the app port -- a healthcheck against
      # :8080/health/ready 404s forever and never turns healthy.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # Dev mail sink so Keycloak's "send password-reset email" (the real
  # identity.user.sendPasswordResetLink tool-gateway connector) has somewhere to
  # deliver. Not a real MTA — SMTP :1025 in, web UI :8025 to read what landed.
  # opsmind-realm.json's smtpServer block points at this host by name.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: opsmind-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"   # web UI — open http://localhost:8025 to read the reset email
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1:8025/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-runtime-service:
    build:
      context: ../../services/agent-runtime-service
    container_name: opsmind-agent-runtime-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EVENT_PUBLISHER_ADAPTER: rabbitmq
      # Real distributed tracing → the observability stack's Collector (a separate
      # Compose project) via its LOCAL plaintext OTLP ingress on the host's
      # published port. service.namespace drives the Collector's per-tenant Tempo
      # routing (routing/traces-tenant). See observability-stack.yml +
      # collector/overlays/local/config.yaml.
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:14317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=agent-runtime
      # domain 09/10's own frontends call conversation_router directly from these
      # origins (Settings.cors_allowed_origins's own docstring) — same local-dev
      # ports as user-access-authentication-service's own CORS allow-list.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Real bug found live 2026-09-02, phase-10's own first real multi-container
      # bring-up: every one of these Settings fields defaults to localhost (correct
      # for a bare-metal/host run) but this container's own "localhost" is itself,
      # not a sibling container — SPEC-ARO-038's own create_ticket() call failed
      # with a real ECONNREFUSED until these were pointed at the real in-network
      # hostnames, mirroring every other service's own KEYCLOAK_ISSUER_URI pattern.
      TICKET_WORKFLOW_BASE_URL: http://ticket-workflow-service:8080
      MEMORY_KNOWLEDGE_BASE_URL: http://memory-knowledge-service:8010
      POLICY_APPROVAL_GOVERNANCE_BASE_URL: http://policy-approval-governance-service:8086
      # SPEC-ARO-039's own multimodal follow-up: real attachment bytes for the
      # real gpt-5-mini/Claude vision models, fetched via HttpAttachmentClient.
      ATTACHMENT_SERVICE_BASE_URL: http://attachment-service:8090
      # phase-05 (tool-gateway-mediation): "http" wires HttpToolGatewayPort so a
      # confirmed self-service action actually executes against
      # tool-integration-gateway (create + synchronous execute) and wakes the
      # WAITING_FOR_TOOL workflow. "logging" (the code default) keeps the old
      # log-only placeholder. Needs the `identity.user.sendPasswordResetLink`
      # connector registered — scripts/seed-tool-connectors.sh.
      TOOL_GATEWAY_MODE: ${TOOL_GATEWAY_MODE:-http}
      TOOL_GATEWAY_BASE_URL: http://tool-integration-gateway:8020
      # SPEC-ARO-043's own real outbound service identity (triage/approval calls,
      # never the create-ticket call — that one forwards the employee's own
      # token, see HttpTicketWorkflowClient's own docstring). Reuses
      # integration-test-client rather than registering a new dedicated
      # "agent-runtime-service" Keycloak client that does not exist anywhere in
      # this realm yet — its own scope grant (tickets:create, ticket:triage,
      # ticket:resolve, ...) and actor_type=SUPPORT_AGENT mapping already match
      # exactly what an automated agent identity needs.
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/opsmind/protocol/openid-connect/token
      AGENT_RUNTIME_SERVICE_CLIENT_ID: integration-test-client
      AGENT_RUNTIME_SERVICE_CLIENT_SECRET: integration-test-secret
      # Real bug found live 2026-09-03, this platform's first real end-to-end
      # escalation: these all default to "" (settings.py's own comment: "no
      # seed data ... exists anywhere in this platform"), so every escalation
      # attempt failed closed with a real 502 ESCALATION_ROUTING_NOT_CONFIGURED.
      # These 2 ids are real — a category/support-queue row already existed
      # live in this local Postgres volume under exactly these ids (from
      # some earlier, undocumented manual step, never captured by any
      # migration); ticket-workflow-service's own new V045 migration now
      # seeds them for real (idempotently) so a fresh environment has them too.
      ESCALATION_DEFAULT_CATEGORY_ID: 11111111-1111-1111-1111-111111111111
      ESCALATION_DEFAULT_SUPPORT_QUEUE_ID: 33333333-3333-3333-3333-333333333333
      ESCALATION_DEFAULT_PRIORITY: MEDIUM
      ESCALATION_DEFAULT_TEAM_NAME: Network Support
      # ConversationReasoningPort's real LLM adapters — "static" (safe default, no key
      # needed) keeps StaticConversationReasoningAdapter; "anthropic" (+ a real
      # ANTHROPIC_API_KEY) or "openai" (+ a real OPENAI_API_KEY) wire the matching real
      # adapter instead.
      CONVERSATION_REASONING_MODE: ${CONVERSATION_REASONING_MODE:-static}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The real multi-step reasoning loop (LangGraphConversationDeliberationAdapter):
      # retrieve -> reason -> (refine query + re-retrieve when under-supported) -> reason,
      # bounded by CONVERSATION_DELIBERATION_MAX_ITERATIONS. "single_turn" reverts to the
      # original one-retrieval-one-decide path.
      CONVERSATION_DELIBERATION_MODE: ${CONVERSATION_DELIBERATION_MODE:-langgraph}
      CONVERSATION_DELIBERATION_MAX_ITERATIONS: ${CONVERSATION_DELIBERATION_MAX_ITERATIONS:-3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ticket-workflow-service:
        condition: service_healthy
      memory-knowledge-service:
        condition: service_healthy
      policy-approval-governance-service:
        condition: service_healthy
      attachment-service:
        condition: service_healthy

  memory-knowledge-service:
    build:
      context: ../../services/memory-knowledge-service
    container_name: opsmind-memory-knowledge-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EVENT_PUBLISHER_ADAPTER: rabbitmq
      # Distributed tracing → observability Collector (see agent-runtime-service's
      # own OTEL_* block for the full rationale).
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:14317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=memory-knowledge
      # RAG embedding provider. "deterministic" (safe default, no key needed) is
      # the honest offline hash embedder — retrieval is lexical keyword-only,
      # which is what SearchMemoryService's own scorer delivers. Set
      # EMBEDDING_PROVIDER=openai plus a real OPENAI_API_KEY in the compose .env
      # to wire OpenAI text-embedding-3-small for both ingest and the pgvector
      # cosine-similarity retrieval path (same opt-in pattern as
      # CONVERSATION_REASONING_MODE). "openai" with no key logs a warning and
      # falls back to deterministic keyword-only retrieval — it still boots.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # support-console's admin knowledge-ingest UI (SPEC-SC follow-up).
      CORS_ALLOWED_ORIGINS: ${MEMORY_CORS_ALLOWED_ORIGINS:-http://localhost:5174}
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  evaluation-improvement-service:
    build:
      context: ../../services/evaluation-improvement-service
    container_name: opsmind-evaluation-improvement-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EVENT_PUBLISHER_ADAPTER: rabbitmq
      # Real bug this compose is likely to surface: this default (from
      # settings.py) points at :8003, but agent-runtime-service's own real
      # port is 8000 (see its main.py) -- overriding here with the real value
      # rather than silently leaving a stale default in place.
      AGENT_RUNTIME_BASE_URL: http://agent-runtime-service:8000
      # SPEC-EI-013 follow-up: "http" runs each eval case against agent-runtime's real
      # /agent-runtime/evaluation/execute-case endpoint (real ConversationReasoningPort
      # → real prompt/completion token split), not the FakeAgentRuntimeEvaluationAdapter
      # simulator. When agent-runtime's own CONVERSATION_REASONING_MODE=openai/anthropic,
      # each eval run makes real LLM calls (a few cents of API spend per run); "fake"
      # keeps it free/offline.
      AGENT_RUNTIME_EVALUATION_MODE: ${AGENT_RUNTIME_EVALUATION_MODE:-http}
      POLICY_APPROVAL_BASE_URL: http://policy-approval-governance-service:8086
      # SPEC-EI-013 LangSmith Experiment Linkage. "noop" (default) keeps the
      # inert NoOpLangSmithExperimentAdapter. Set LANGSMITH_MODE=sdk + a real
      # LANGSMITH_API_KEY in the gitignored compose .env to create a real
      # LangSmith Project per evaluation run (opt-in, same pattern as the LLM
      # keys). "sdk" with no key / an unimportable SDK degrades back to no-op.
      LANGSMITH_MODE: ${LANGSMITH_MODE:-noop}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_API_URL: ${LANGSMITH_API_URL:-https://api.smith.langchain.com}
      # Distributed tracing → observability Collector (see agent-runtime-service's
      # own OTEL_* block for the full rationale).
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:14317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=evaluation-improvement
      # SPEC-SC-015: support-console's own Evaluation Comparison Table.
      CORS_ALLOWED_ORIGINS: ${EVALUATION_CORS_ALLOWED_ORIGINS:-http://localhost:5174}
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tool-integration-gateway:
    build:
      context: ../../services/tool-integration-gateway
    container_name: opsmind-tool-integration-gateway
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EVENT_PUBLISHER_ADAPTER: rabbitmq
      # SPEC-SC-018/020 follow-up: support-console's own AiLogPanel (SPEC-SC-006 3rd source).
      CORS_ALLOWED_ORIGINS: ${TOOL_GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      # support-console's connector-admin UI POSTs /connectors and PATCHes
      # /connectors/{id}/status — opt writes through CORS (still GET-only without this).
      CORS_ALLOW_WRITES: ${TOOL_GATEWAY_CORS_ALLOW_WRITES:-true}
      # The real Keycloak Admin REST connector (keycloak-identity-unlock /
      # keycloak-identity-credentials). Reaches the sibling keycloak container
      # over the in-network hostname; admin auth is the bootstrap admin/admin
      # service account on the master realm's admin-cli client.
      KEYCLOAK_CONNECTOR_ENABLED: "true"
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: opsmind
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # SPEC-XOBS-001 Part B: otel_setup.py + the SDK deps were already here, but
      # nothing set OTEL_EXPORTER so it always ran the console exporter. Ship real
      # spans to the observability Collector's local plaintext OTLP gRPC ingress
      # (:14317), same as agent-runtime-service. FastAPIInstrumentor (added to
      # pyproject) then contributes the per-request SERVER span the manual domain
      # spans nest under, so "agent-runtime -> tool-gateway -> Keycloak" is one
      # connected trace.
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:14317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tool-integration
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  user-access-authentication-service:
    build:
      context: ../../services/user-access-authentication-service
    container_name: opsmind-user-access-authentication-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SERVER_PORT: "8087"
      # Project-level integration verification (2026-09-01): this service
      # needed a real Keycloak more than the other 2 Java services -- it
      # configures real OAuth2 CLIENT registration (browser SSO,
      # SPEC-UA-005/018), which eagerly resolves the OIDC discovery
      # document at Spring Boot startup via
      # ClientRegistrations#fromIssuerLocation, unlike the resource-server-
      # only config the other services use (lazy JWKS fetch). Real client
      # + matching secret registered in opsmind-realm.json, redirect URIs
      # pointed at the host-mapped port (8087) since a real browser login
      # round trip is reached via localhost, not the in-network hostname.
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/opsmind
      KEYCLOAK_CLIENT_SECRET: user-access-secret
      # SPEC-SC-001: domain 10's own support-console real Keycloak client.
      SUPPORT_CONSOLE_CLIENT_SECRET: support-console-secret
      # SPEC-SC-014: reaches Tempo (a SEPARATE Compose project,
      # observability-stack.yml, deliberately not joined as a network
      # dependency here — see TempoQueryProperties's own javadoc) via the
      # host's own published port. host.docker.internal is Docker Desktop's
      # own host-loopback DNS name (this repo's actual dev environment);
      # on plain Linux Docker this also needs `extra_hosts:
      # ["host.docker.internal:host-gateway"]` added below, or this
      # property pointed at a real reachable address instead.
      TEMPO_QUERY_BASE_URL: http://host.docker.internal:3200
      # SPEC-SC-014 reads traces back (above); this WRITES them. Spring Boot's
      # OTLP tracing exporter (micrometer-tracing-bridge-otel, already on the
      # classpath) → the observability Collector's LOCAL plaintext HTTP OTLP
      # ingress. application-local.yml already points management.otlp.tracing at
      # ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces. 100% sampling locally so every
      # request is traceable; service.namespace drives per-tenant Tempo routing.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:14318
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=user-access-authentication
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  ticket-workflow-service:
    build:
      context: ../../services/ticket-workflow-service
    container_name: opsmind-ticket-workflow-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/opsmind
      # Distributed tracing → observability Collector's local plaintext OTLP HTTP
      # ingress (see user-access-authentication-service's own OTEL_* block).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:14318
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ticket-workflow
    ports:
      # Moved off host port 8080 (2026-09-02): a real browser login needs
      # "keycloak" to resolve on the host machine (via a /etc/hosts alias to
      # 127.0.0.1) AND land on Keycloak's own real container port 8080 — see
      # the keycloak service's own port mapping below for the full
      # explanation. This service's own container-internal port is
      # unchanged (still 8080; every other container still reaches it via
      # http://ticket-workflow-service:8080 exactly as before) — only the
      # host-facing mapping moved, so anything the BROWSER itself calls
      # directly (employee-portal's/support-console's own
      # TICKET_WORKFLOW_BASE_URL) needs to point at :18080 now.
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  attachment-service:
    # SPEC-EP-010/011's own "shared attachments capability", chartered but never
    # built until now — real Postgres metadata + real MinIO (local-platform.yml's
    # own shared minio container, see its own comment) object storage. Consumed
    # by employee-portal's real POST /api/v1/attachments and by
    # agent-runtime-service's own multimodal follow-up (GET .../content).
    build:
      context: ../../services/attachment-service
    container_name: opsmind-attachment-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      SERVER_PORT: "8090"
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/opsmind
      ATTACHMENT_CORS_ALLOWED_ORIGINS: ${ATTACHMENT_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Points at local-platform.yml's own shared minio container over the
      # in-network hostname/port, not the host-mapped one.
      ATTACHMENT_STORAGE_ENDPOINT: http://minio:9000
      ATTACHMENT_STORAGE_ACCESS_KEY: ${ATTACHMENT_STORAGE_ACCESS_KEY:-opsmind-minio}
      ATTACHMENT_STORAGE_SECRET_KEY: ${ATTACHMENT_STORAGE_SECRET_KEY:-opsmind-minio-secret}
      ATTACHMENT_STORAGE_REGION: ${ATTACHMENT_STORAGE_REGION:-us-east-1}
      # SPEC-XOBS-001 Part B: the OTel deps + application-local.yml otlp block were
      # always here — only this compose wiring was missing, so traces sampled at the
      # 0.1 default and shipped to localhost:4318 (nothing). service.namespace has no
      # dedicated Tempo tenant, so it routes to "shared" (see the Collector's
      # routing/traces-tenant connector).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:14318
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shared
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy

  policy-approval-governance-service:
    build:
      context: ../../services/policy-approval-governance-service
    container_name: opsmind-policy-approval-governance-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ticket_workflow}
      DB_USERNAME: ${DB_USERNAME:-ticket_workflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SERVER_PORT: "8086"
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/opsmind
      # Distributed tracing → observability Collector's local plaintext OTLP HTTP
      # ingress (see user-access-authentication-service's own OTEL_* block).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:14318
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=policy-approval-governance
      # SPEC-XOBS-001 Part A: real approval-lifecycle emails via the mailpit container
      # (SmtpApprovalNotificationAdapter). "noop" everywhere else keeps the seam silent.
      GOVERNANCE_NOTIFICATIONS_MODE: ${GOVERNANCE_NOTIFICATIONS_MODE:-smtp}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started

  # --- Frontends (2026-09-08) -----------------------------------------------
  # Static React/Vite SPAs served by nginx. The BROWSER (not the container)
  # makes every backend call, so the apps are built with their own
  # `src/lib/env.ts` defaults (http://localhost:8087 / :18080 / :8000 / ...)
  # and reach the backends through the host port mappings above — no VITE_*
  # build args needed, identical to `pnpm dev`.
  #
  # Host ports are pinned to 5173 / 5174 on purpose: every backend's
  # CORS_ALLOWED_ORIGINS, this realm's redirect URIs, and
  # user-access-authentication-service's login.success-redirect-uri are all
  # already configured for exactly those two origins. Stop any local
  # `pnpm dev` on 5173/5174 before bringing these up (a port clash otherwise).
  employee-portal:
    build:
      context: ../../
      dockerfile: apps/employee-portal/Dockerfile
    container_name: opsmind-employee-portal
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - user-access-authentication-service
      - ticket-workflow-service
      - agent-runtime-service
      - attachment-service

  support-console:
    build:
      context: ../../
      dockerfile: apps/support-console/Dockerfile
      args:
        # SPEC-EI-013: set LANGSMITH_ORG_ID (the LangSmith workspace id) in the
        # gitignored compose .env to turn on the "View in LangSmith" deep link
        # for runs recorded with linkage enabled. Empty → link stays hidden.
        VITE_LANGSMITH_BASE_URL: ${LANGSMITH_WEB_URL:-https://smith.langchain.com}
        VITE_LANGSMITH_ORG_ID: ${LANGSMITH_ORG_ID:-}
    container_name: opsmind-support-console
    restart: unless-stopped
    ports:
      - "5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - user-access-authentication-service
      - ticket-workflow-service
      - policy-approval-governance-service
      - tool-integration-gateway
      - evaluation-improvement-service

  # The "external scheduler" every service's outbox/recovery javadoc/docstring
  # names ("safe to call from an admin endpoint or an external scheduler once one
  # exists"). No service runs an in-process @Scheduled drain by design; this
  # container periodically POSTs each service's admin dispatch/recovery endpoint
  # over the compose network so events actually propagate without a manual poke.
  # See ./dispatch-scheduler.sh. Not needed for a bare local bring-up — it only
  # matters once you want cross-service events to flow on their own.
  dispatch-scheduler:
    image: curlimages/curl:8.11.1
    container_name: opsmind-dispatch-scheduler
    restart: unless-stopped
    entrypoint: ["sh", "/dispatch-scheduler.sh"]
    volumes:
      - ./dispatch-scheduler.sh:/dispatch-scheduler.sh:ro
    environment:
      KC_URL: http://keycloak:8080
      DISPATCH_INTERVAL_SECONDS: ${DISPATCH_INTERVAL_SECONDS:-10}
      RECOVERY_EVERY_N: ${RECOVERY_EVERY_N:-6}
      STARTUP_DELAY_SECONDS: ${DISPATCH_STARTUP_DELAY_SECONDS:-20}
    depends_on:
      - keycloak
      - ticket-workflow-service
      - policy-approval-governance-service
      - agent-runtime-service
      - memory-knowledge-service
      - tool-integration-gateway

  # SPEC-XREL-001 + SPEC-XOBS-001. The Python services (agent-runtime,
  # tool-integration-gateway, memory-knowledge) expose HTTP "event listener"
  # endpoints but run no RabbitMQ consumer. This sidecar subscribes to
  # `opsmind.events` for the cross-domain events they need:
  #   approval.granted/denied/expired.v1 -> agent-runtime (resume/fail a
  #     WAITING_FOR_APPROVAL workflow) + tool-integration-gateway (WAITING_APPROVAL
  #     tool request)
  #   improvement.promoted.v1            -> agent-runtime (adopt a promoted version)
  #   ticket.resolved/closed.v1,
  #   workflow.completed/failed.v1       -> memory-knowledge (candidate-memory
  #     pipeline — the knowledge base grows from real resolutions)
  # Transforms each envelope to the target endpoint's contract and POSTs it.
  # At-least-once; every target dedups by event_id. Failures dead-letter to
  # opsmind.dlx / event-relay.python-fanout.dlq.v1.
  event-relay:
    build:
      context: ../../services/event-relay
    container_name: opsmind-event-relay
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_EXCHANGE: opsmind.events
      RABBITMQ_DLX: opsmind.dlx
      AGENT_RUNTIME_BASE_URL: http://agent-runtime-service:8000
      TOOL_GATEWAY_BASE_URL: http://tool-integration-gateway:8020
      MEMORY_KNOWLEDGE_BASE_URL: http://memory-knowledge-service:8010
      LOG_LEVEL: ${EVENT_RELAY_LOG_LEVEL:-INFO}
      # SPEC-XREL-001 §Observability: per-message CONSUMER span + a CLIENT span per
      # HTTP fan-out (traceparent injected downstream) + event_relay_{messages,
      # deliveries,dlq}_total counters. No dedicated Tempo tenant -> service.namespace
      # routes to "shared".
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:14317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shared
    depends_on:
      rabbitmq:
        condition: service_healthy
      agent-runtime-service:
        condition: service_started
      tool-integration-gateway:
        condition: service_started
      memory-knowledge-service:
        condition: service_started
