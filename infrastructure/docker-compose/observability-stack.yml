# OpsMind Observability Platform — LOCAL topology (SPEC-OP-002).
# owner: platform-observability
#
# All six components (ADR-0001/0002) with pinned image+digest, ports, named volumes,
# health checks, and CPU/memory limits. Config is bind-mounted read-only from
# infrastructure/observability/<component>/{base,overlays/local}/ — Git is the source
# of truth (ADR-0003). This stack is independent of local-platform.yml and can run
# alongside it.
#
# Run it via the wrapper, which assembles the base + overlay --env-file list:
#   scripts/observability-stack.sh up
#   scripts/observability-stack.sh smoke
#   scripts/observability-stack.sh down
#
# Or directly:
#   docker compose \
#     --env-file infrastructure/observability/versions.env \
#     --env-file infrastructure/observability/prometheus/overlays/local/values.env \
#     --env-file infrastructure/observability/alertmanager/overlays/local/values.env \
#     -f infrastructure/docker-compose/observability-stack.yml up -d

name: opsmind-observability

x-obs-labels: &obs-labels
  com.opsmind.domain: "08-observability-platform"
  com.opsmind.spec: "SPEC-OP-002"

networks:
  observability:
    name: opsmind-observability

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alertmanager-data:
  # SPEC-OP-011 — WAL for otlp/tempo + otlphttp/loki sending_queue; survives a
  # collector restart/redeploy instead of silently losing whatever was queued.
  otel-collector-queue-data:
  # SPEC-OP-029 — a dedicated, throwaway Postgres/RabbitMQ pair purely so
  # postgres_exporter / RabbitMQ's own built-in Prometheus plugin have
  # something real to scrape and report real (mostly-empty) infra health from.
  # NOT the shared business-schema instances local-platform.yml runs.
  obs-postgres-data:
  obs-rabbitmq-data:

services:
  # --------------------------------------------------------------------------
  # OpenTelemetry Collector — sole OTLP ingestion boundary (ADR-0001)
  # --------------------------------------------------------------------------
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}:${OTEL_COLLECTOR_TAG}@${OTEL_COLLECTOR_DIGEST}
    container_name: opsmind-otel-collector
    restart: unless-stopped
    # SPEC-OP-011 — the image's default nonroot user cannot write a fresh docker
    # volume's root-owned mount point (same class of fix as prometheus below); the
    # scratch-based image has no /etc/passwd, so root must be given numerically.
    user: "0:0"
    command:
      - "--config=/etc/otelcol/base.yaml"
      - "--config=/etc/otelcol/local.yaml"
    environment:
      OTEL_DEPLOYMENT_ENVIRONMENT: local
      OTEL_TEMPO_ENDPOINT: tempo:4317
      OTEL_LOKI_ENDPOINT: http://loki:3100/otlp
      # SPEC-OP-008 / ADR-0007 — sourced from collector/overlays/local/values.env via
      # --env-file; a non-secret local-dev placeholder, never committed as a real value.
      OTEL_GATEWAY_AUTH_TOKEN: ${OTEL_GATEWAY_AUTH_TOKEN}
    volumes:
      - ../observability/collector/base/config.yaml:/etc/otelcol/base.yaml:ro
      - ../observability/collector/overlays/local/config.yaml:/etc/otelcol/local.yaml:ro
      # SPEC-OP-008 — ephemeral self-signed dev cert, generated by
      # scripts/observability-stack.sh into a gitignored directory; never committed.
      - ../observability/collector/overlays/local/.tls:/etc/otelcol/tls:ro
      # SPEC-OP-011 — persistent sending_queue WAL.
      - otel-collector-queue-data:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317"     # OTLP gRPC  (application ingress)
      - "4318:4318"     # OTLP HTTP  (application ingress)
      - "13133:13133"   # health_check extension
      - "8888:8888"     # collector's own telemetry
      - "8889:8889"     # prometheus exporter (app metrics)
      - "55679:55679"   # zpages
    # The contrib image is scratch-based: no shell, no wget/curl. Only the collector
    # binary can run as a healthcheck. `validate` re-parses the merged config and
    # exits non-zero on any error, so an unhealthy collector = a broken config.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/base.yaml", "--config=/etc/otelcol/local.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    labels: *obs-labels
    networks: [observability]
    depends_on:
      tempo: { condition: service_healthy }
      loki: { condition: service_healthy }

  # --------------------------------------------------------------------------
  # Prometheus — metrics store + rule evaluation (ADR-0002)
  # --------------------------------------------------------------------------
  prometheus:
    image: ${PROMETHEUS_IMAGE}:${PROMETHEUS_TAG}@${PROMETHEUS_DIGEST}
    container_name: opsmind-prometheus
    restart: unless-stopped
    user: root
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=${PROMETHEUS_STORAGE_PATH}"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}"
      # SPEC-OP-012 — WAL compression trades a little CPU for materially less disk
      # I/O and space; standard for any non-trivial ingest rate.
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      # SPEC-OP-015 — enables POST /api/v1/admin/tsdb/snapshot (runbooks/
      # TelemetryBackupRestore.md). Admin API is not exposed beyond this trusted
      # internal network; it is not the producer-facing OTLP boundary.
      - "--web.enable-admin-api"
      - "--enable-feature=expand-external-labels,exemplar-storage"
      # SPEC-OP-030 — Prometheus's own native basic-auth gate on the whole web
      # server (query API included), no external IdP needed.
      - "--web.config.file=/etc/prometheus/web.yml"
    environment:
      PROMETHEUS_ENV_LABEL: ${PROMETHEUS_ENV_LABEL}
    volumes:
      - ../observability/prometheus/base/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/base/file_sd:/etc/prometheus/file_sd:ro
      - ../observability/rules/recording:/etc/prometheus/rules/recording:ro
      - ../observability/rules/alerting:/etc/prometheus/rules/alerting:ro
      - ../observability/prometheus/overlays/local/web.yml:/etc/prometheus/web.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      # SPEC-OP-030 — basic_auth_users in web.yml applies to EVERY endpoint,
      # /-/healthy included — Prometheus's exporter-toolkit auth middleware
      # wraps the whole server, no built-in health-endpoint exemption. The
      # image's wget is BusyBox's minimal build, which has NO
      # --http-user/--http-password flags (confirmed live: "unrecognized
      # option") — a manually-built Basic-auth header via --header is the
      # only way BusyBox wget can authenticate.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--header=Authorization: Basic YWRtaW46YWRtaW4=", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { cpus: "0.25", memory: 192M }
    labels: *obs-labels
    networks: [observability]

  # --------------------------------------------------------------------------
  # Loki — log store (ADR-0002)
  # --------------------------------------------------------------------------
  loki:
    image: ${LOKI_IMAGE}:${LOKI_TAG}@${LOKI_DIGEST}
    container_name: opsmind-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-config.expand-env=true"
    env_file:
      - ../observability/loki/overlays/local/values.env
    volumes:
      - ../observability/loki/base/loki.yml:/etc/loki/loki.yml:ro
      # SPEC-OP-013 — ruler rules, GitOps-reviewed same as Prometheus rules.
      - ../observability/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    labels: *obs-labels
    networks: [observability]

  # --------------------------------------------------------------------------
  # Tempo — trace store (ADR-0002). OTLP 4317 is internal only (not published).
  # --------------------------------------------------------------------------
  tempo:
    image: ${TEMPO_IMAGE}:${TEMPO_TAG}@${TEMPO_DIGEST}
    container_name: opsmind-tempo
    restart: unless-stopped
    user: root
    command:
      - "-config.file=/etc/tempo/tempo.yml"
      - "-config.expand-env=true"
    env_file:
      - ../observability/tempo/overlays/local/values.env
    volumes:
      - ../observability/tempo/base/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"     # HTTP / TraceQL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    labels: *obs-labels
    networks: [observability]

  # --------------------------------------------------------------------------
  # Grafana — dashboards + Explore correlation. Datasources are QUERY ONLY.
  # --------------------------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE}:${GRAFANA_TAG}@${GRAFANA_DIGEST}
    container_name: opsmind-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # SPEC-OP-030 — anonymous Viewer access disabled; real RBAC now gates
      # this UI (Grafana's own built-in org-role model: Admin/Editor/Viewer).
      # A real OIDC identity provider is a deliberately deferred follow-up —
      # no shared, persistent Keycloak exists anywhere in this repo yet
      # (every domain's own Keycloak usage today is ephemeral/test-scoped
      # only) — see runbooks/ObservabilityAccessControl.md.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ../observability/grafana/base/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    labels: *obs-labels
    networks: [observability]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }

  # --------------------------------------------------------------------------
  # Alertmanager — routing / dedup / silence (component matrix §6)
  # --------------------------------------------------------------------------
  alertmanager:
    image: ${ALERTMANAGER_IMAGE}:${ALERTMANAGER_TAG}@${ALERTMANAGER_DIGEST}
    container_name: opsmind-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=${ALERTMANAGER_STORAGE_PATH}"
      - "--data.retention=${ALERTMANAGER_RETENTION}"
      # SPEC-OP-030 — same native basic-auth gate as Prometheus's own.
      - "--web.config.file=/etc/alertmanager/web.yml"
    volumes:
      - ../observability/alertmanager/base/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../observability/alertmanager/overlays/local/web.yml:/etc/alertmanager/web.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      # SPEC-OP-030 — needs credentials now, same reason and same BusyBox-wget
      # workaround as Prometheus's own (see that healthcheck's own comment).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--header=Authorization: Basic YWRtaW46YWRtaW4=", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.1", memory: 64M }
    labels: *obs-labels
    networks: [observability]

  # --------------------------------------------------------------------------
  # SPEC-OP-029 — a small, dedicated Postgres purely for postgres_exporter to
  # scrape. Not the shared business-schema instance (local-platform.yml, a
  # separate compose project) — this stack stays independent, per this file's
  # own header comment.
  # --------------------------------------------------------------------------
  obs-postgres:
    image: ${POSTGRES_IMAGE}:${POSTGRES_TAG}@${POSTGRES_DIGEST}
    container_name: opsmind-obs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: obs_proof
      POSTGRES_USER: obs_proof
      POSTGRES_PASSWORD: obs_proof
    ports:
      - "5433:5432"
    volumes:
      - obs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obs_proof -d obs_proof"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.1", memory: 64M }
    labels: *obs-labels
    networks: [observability]

  # --------------------------------------------------------------------------
  # SPEC-OP-029 — postgres_exporter. No native Prometheus endpoint exists in
  # Postgres itself (unlike RabbitMQ below), so this is a real, separate
  # sidecar — the standard prometheus-community pattern.
  # --------------------------------------------------------------------------
  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}:${POSTGRES_EXPORTER_TAG}@${POSTGRES_EXPORTER_DIGEST}
    container_name: opsmind-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://obs_proof:obs_proof@obs-postgres:5432/obs_proof?sslmode=disable"
    ports:
      - "9187:9187"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
        reservations: { cpus: "0.05", memory: 32M }
    labels: *obs-labels
    networks: [observability]
    depends_on:
      obs-postgres: { condition: service_healthy }

  # --------------------------------------------------------------------------
  # SPEC-OP-029 — a small, dedicated RabbitMQ with its own built-in
  # `rabbitmq_prometheus` plugin enabled at startup (ships with the image
  # since 3.8+, not enabled by default) — no separate exporter container
  # needed, unlike Postgres above.
  # --------------------------------------------------------------------------
  obs-rabbitmq:
    image: ${RABBITMQ_IMAGE}:${RABBITMQ_TAG}@${RABBITMQ_DIGEST}
    container_name: opsmind-obs-rabbitmq
    restart: unless-stopped
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: obs_proof
      RABBITMQ_DEFAULT_PASS: obs_proof
    ports:
      - "5673:5672"
      - "15673:15672"
      - "15692:15692"   # rabbitmq_prometheus
    volumes:
      - obs-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { cpus: "0.1", memory: 96M }
    labels: *obs-labels
    networks: [observability]
