name: opsmind-local-platform

services:
  postgres:
    # SPEC-MK-002 (04-memory-knowledge, 07-data-model): "使用 PostgreSQL + pgvector" —
    # memory-knowledge-service's `memory.embeddings` table needs the pgvector
    # extension. pgvector/pgvector:pg18 is the official postgres:18 image plus that
    # extension pre-installed — a drop-in replacement (same Postgres major version,
    # same data format) for ticket-workflow-service's and agent-runtime-service's own
    # schemas in this same shared instance; nothing about their tables changes.
    # Recreate the running container to pick this up: `docker compose -f
    # infrastructure/docker-compose/local-platform.yml up -d --force-recreate postgres`.
    image: pgvector/pgvector:pg18
    container_name: opsmind-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ticket_workflow}
      POSTGRES_USER: ${DB_USERNAME:-ticket_workflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticket_workflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18+ images store data under a major-version-specific
      # subdirectory of /var/lib/postgresql itself; mounting the volume at
      # the old /var/lib/postgresql/data path makes the image refuse to
      # start ("PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)"). See https://github.com/docker-library/postgres/pull/1259.
      - opsmind-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ticket_workflow} -d ${DB_NAME:-ticket_workflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: opsmind-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - opsmind-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  opsmind-postgres-data:
  opsmind-rabbitmq-data:
