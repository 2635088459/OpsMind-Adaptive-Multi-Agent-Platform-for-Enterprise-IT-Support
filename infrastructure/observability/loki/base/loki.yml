# owner: platform-observability
# spec: SPEC-OP-002; SPEC-OP-013 (ruler wiring, query-safety limits)
# rollback: git revert <sha>; docker compose -f infrastructure/docker-compose/observability-stack.yml up -d --force-recreate loki
#
# Loki single-binary config (ADR-0002): the SAME process serves both write (push)
# and read (query) paths — a deliberate SPEC-OP-013 scope decision, not an
# oversight. Splitting write/read into separate deployments is a horizontal-scaling
# concern with no current need at this volume; the config is already structured
# (schema/limits/compactor/ruler as their own sections) so splitting later needs no
# rework, only a second deployment target. Multi-tenancy (`auth_enabled: false`,
# single tenant "fake") is explicitly SPEC-OP-031's scope, not this one's — see
# signals/trace-propagation.yaml's tenant.id baggage key, already deferred there.
#
# Receives logs ONLY from the Collector via the native OTLP endpoint
# (/otlp/v1/logs, enabled by default in Loki 3.x). Structured-log shape and PII/
# secret redaction are enforced upstream in the Collector (SPEC-OP-007); Loki must
# never persist unredacted PII. Object storage / cross-signal retention formalization
# is SPEC-OP-015 (per-severity retention_stream needs severity promoted to an
# INDEXED label first — confirmed empirically that only service_name/
# deployment_environment are indexed today; not done here to avoid an unreviewed
# cardinality change as a side effect of ruler wiring). Overlay (values.env) sets
# only environment parameters.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  metric_aggregation_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_streams_per_user: 5000
  # SPEC-OP-013 — query-safety limits: bound how much a single (or ruler) LogQL
  # query can cost, independent of ingestion limits above.
  max_query_series: 10000
  max_entries_limit_per_query: 5000
  max_query_parallelism: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # Structured metadata is how OTLP attributes land in Loki 3.x.
  allow_structured_metadata: true
  retention_period: ${LOKI_RETENTION_PERIOD}

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m

ruler:
  storage:
    type: local
    # SPEC-OP-013 — read-only bind mount of infrastructure/observability/loki/rules/
    # (GitOps-reviewed, same discipline as Prometheus rules). Distinct from
    # common.storage.filesystem.rules_directory (/loki/rules on the writable data
    # volume), which is the ruler API's OWN rule-storage path — unused while rules
    # are authored as files here, kept as-is for a future SPEC-OP-032 admin API.
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  enable_api: true
  enable_alertmanager_v2: true
  # SPEC-OP-030 — Alertmanager's own web.yml now gates its whole server
  # behind basic auth; userinfo-in-URL is the simplest supported way to
  # authenticate the ruler's own alertmanager notifier (Go's http.Client
  # translates URL userinfo into a Basic Authorization header automatically).
  alertmanager_url: http://admin:admin@alertmanager:9093

analytics:
  reporting_enabled: false
