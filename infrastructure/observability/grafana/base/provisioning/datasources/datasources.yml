# owner: platform-observability
# spec: SPEC-OP-002
# rollback: git revert <sha>; docker compose -f infrastructure/docker-compose/observability-stack.yml up -d --force-recreate grafana
#
# Grafana datasources — QUERY ONLY. No datasource holds a write-capable credential
# (forbidden-business-writes F3). Cross-signal correlation (metrics <-> logs <-> traces)
# is wired here so SPEC-OP-002 can demonstrate the "ingested, queried AND correlated"
# acceptance clause; SPEC-OP-016+ build dashboards on top.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # SPEC-OP-030 — Prometheus now gates its whole web server behind
    # web.yml's basic_auth_users; Grafana's own proxy-mode queries need
    # credentials or every panel/alert-rule query against this datasource
    # would start failing with 401. Same local-dev-placeholder password as
    # prometheus/overlays/local/web.yml (never a real secret).
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin
    jsonData:
      httpMethod: POST
      manageAlerts: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Click a trace_id in a log line -> jump to the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
