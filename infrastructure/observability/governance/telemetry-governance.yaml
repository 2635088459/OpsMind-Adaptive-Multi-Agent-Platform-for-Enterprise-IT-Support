# owner: platform-observability
# spec: SPEC-OP-003
# rollback: git revert <sha>; redeploy otel-collector (transform/governance processor is derived from deny_fields)
#
# Telemetry Governance Baseline — the machine-readable rulebook every OpsMind signal
# must satisfy before export. Phase-01 (SPEC-OP-004..007) implements producer-side
# contracts AGAINST this file; the Collector enforces the deny-list at the boundary
# (collector/base/config.yaml : processors.transform/governance, kept in sync by
# scripts/validate-telemetry-governance.py).
#
# Schema: ../schemas/telemetry-governance.schema.json
# Human policy + exception workflow: ../docs/telemetry-governance.md

version: "1.5.0"   # 1.1.0 SPEC-OP-004 resource.required; 1.2.0 SPEC-OP-006 db/runtime/slo namespaces; 1.3.0 SPEC-OP-007 log_body_redaction + allow_fields.log.recommended event.code; 1.4.0 SPEC-OP-010 trace_sampling; 1.5.0 SPEC-OP-015 retention_mapping

# --------------------------------------------------------------------------------
# DENY — attribute / label / field keys that must never reach a backend.
# Matched case-insensitively against the FULL key and the last dotted segment.
# The Collector's transform/governance processor deletes matching keys from
# resource, span, log, and metric-datapoint attributes in every pipeline.
# --------------------------------------------------------------------------------
deny_fields:
  - pattern: "authorization"
    reason: "bearer / basic auth material"
  - pattern: "proxy-authorization"
    reason: "auth material"
  - pattern: "cookie"
    reason: "session / auth material (covers set-cookie)"
  - pattern: "set-cookie"
    reason: "session material"
  - pattern: "x-api-key"
    reason: "API credential"
  - pattern: "api[_-]?key"
    reason: "API credential"
  - pattern: "access[_-]?key"
    reason: "cloud / service credential"
  - pattern: "secret[_-]?key"
    reason: "credential"
  - pattern: "client[_-]?secret"
    reason: "OAuth client secret"
  - pattern: "private[_-]?key"
    reason: "asymmetric private key"
  - pattern: "password"
    reason: "credential (covers passwd, pwd via segment match below is not enough — explicit)"
  - pattern: "passwd"
    reason: "credential"
  - pattern: "pwd"
    reason: "credential"
  - pattern: "token"
    reason: "access / refresh / id token"
  - pattern: "session[_-]?id"
    reason: "session identifier"
  - pattern: "mfa[_-]?(secret|seed|code)"
    reason: "MFA material"
  - pattern: "otp"
    reason: "one-time passcode"
  - pattern: "totp"
    reason: "one-time passcode seed"
  - pattern: "prompt"
    reason: "raw LLM prompt — never in telemetry (use hashes / token counts)"
  - pattern: "completion"
    reason: "raw LLM completion"
  - pattern: "(message|user)[_-]?(content|text|body)"
    reason: "raw user text"
  - pattern: "gen_ai\\.(prompt|completion).*"
    reason: "OTel GenAI raw content conventions — content capture is off"
  - pattern: "ssn"
    reason: "PII — national id"
  - pattern: "credit[_-]?card"
    reason: "PII — PAN"
  - pattern: "card[_-]?number"
    reason: "PII — PAN"
  - pattern: "(email|e-mail)[_-]?address"
    reason: "PII — email"

# --------------------------------------------------------------------------------
# ALLOW — the attribute keys each signal type is EXPECTED to carry. Not exhaustive
# (producers add domain attributes), but keys here are contract-guaranteed and are
# what dashboards / rules / correlation rely on. SPEC-OP-004 formalizes resource
# attributes; SPEC-OP-005 the trace context; SPEC-OP-006 metric naming.
# --------------------------------------------------------------------------------
allow_fields:
  resource:
    # Refined by SPEC-OP-004 (signals/resource-attributes.yaml is authoritative for the
    # value patterns; this list must stay in sync — validate-signal-contracts.py checks).
    required: ["service.name", "service.version", "service.namespace", "deployment.environment", "service.instance.id", "telemetry.sdk.language"]
    recommended: ["telemetry.sdk.name", "telemetry.sdk.version", "host.name", "process.runtime.name", "process.runtime.version", "os.type"]
  span:
    required: []
    recommended: ["correlation_id", "http.request.method", "http.response.status_code", "messaging.system", "messaging.destination.name", "db.system"]
  log:
    required: []
    recommended: ["correlation_id", "trace_id", "span_id", "log.level", "event.code"]
  metric_datapoint:
    required: []
    recommended: ["http.request.method", "http.response.status_code", "messaging.system", "outcome"]

# --------------------------------------------------------------------------------
# RETENTION CLASSES — logical names artifacts reference in their `retention:` field.
# `prod` here is the intended target for when a production topology is deployed,
# not yet deployed (true of every `production/` overlay in this repository today).
# --------------------------------------------------------------------------------
retention_classes:
  debug:
    description: "high-volume, low-value diagnostic detail; first to drop under pressure"
    local: "24h"
    ci: "1h"
    prod: "3d"
  standard:
    description: "default for metrics, logs, and traces used by dashboards and alerts"
    local: "72h"
    ci: "1h"
    prod: "15d"
  slo:
    description: "series backing SLO / error-budget math; longer window for trend"
    local: "72h"
    ci: "1h"
    prod: "90d"
  audit:
    description: "alert-notification history and config-change records"
    local: "120h"
    ci: "1h"
    prod: "400d"

# --------------------------------------------------------------------------------
# RETENTION MAPPING — SPEC-OP-015. Honest statement of what each backend ACTUALLY
# enforces today: Prometheus/Loki/Tempo open-source each support exactly ONE global
# retention duration (no native per-series/per-stream tiering without a different
# storage backend, which ADR-0002 rules out). Every signal today gets the
# `standard` class's duration regardless of its artifact-declared retention: field;
# a `debug`-class dashboard's `retention: debug` is a DECLARATION of intent honored
# by nothing yet. Real per-class enforcement needs either (a) Loki retention_stream
# keyed on an INDEXED label — severity is NOT one today, confirmed via
# GET /loki/api/v1/labels (SPEC-OP-013) — or (b) a tiered/object-store backend,
# both out of scope until a production topology creates real pressure to build them.
# --------------------------------------------------------------------------------
retention_mapping:
  prometheus:
    enforced_class: standard
    mechanism: "--storage.tsdb.retention.time / .size (single global value)"
    per_class_gap: "no native per-metric-family retention tiering in OSS Prometheus"
  loki:
    enforced_class: standard
    mechanism: "limits_config.retention_period (single global value)"
    per_class_gap: "retention_stream needs severity promoted to an indexed label (cardinality review required first, SPEC-OP-013)"
  tempo:
    enforced_class: standard
    mechanism: "compactor.compaction.block_retention (single global value)"
    per_class_gap: "no native per-span/per-service retention tiering"

# --------------------------------------------------------------------------------
# SIGNAL OWNERS — who owns the SEMANTICS of each signal family. platform-observability
# always co-owns transport + storage. Used to route schema-review requests.
# --------------------------------------------------------------------------------
signal_owners:
  - family: "traces.*"
    semantic_owner: "originating-domain-team"
    transport_owner: "platform-observability"
  - family: "metrics.http.*"
    semantic_owner: "platform-observability"
    transport_owner: "platform-observability"
  - family: "metrics.agent.*"
    semantic_owner: "agent-runtime"
    transport_owner: "platform-observability"
  - family: "metrics.evaluation.*"
    semantic_owner: "evaluation-improvement"
    transport_owner: "platform-observability"
  - family: "logs.*"
    semantic_owner: "originating-domain-team"
    transport_owner: "platform-observability"

# --------------------------------------------------------------------------------
# CARDINALITY BUDGETS — per metric namespace. Enforced by review + SPEC-OP-006
# tooling; declared here so budgets are one reviewed place. `max_label_keys` counts
# non-resource labels on a single metric; `max_series` is a soft ceiling per
# namespace in one environment.
# --------------------------------------------------------------------------------
cardinality_budgets:
  global:
    max_series_total: 250000        # laptop-safe ceiling; prod raised in SPEC-OP-012
  namespaces:
    - namespace: "http"
      max_label_keys: 6
      max_series: 40000
      forbidden_labels: ["user_id", "ticket_id", "workflow_id", "request_id", "trace_id", "session_id", "email", "url_path_raw"]
    - namespace: "amqp"
      max_label_keys: 6
      max_series: 20000
      forbidden_labels: ["message_id", "correlation_id", "ticket_id", "workflow_id"]
    - namespace: "db"
      max_label_keys: 6
      max_series: 15000
      forbidden_labels: ["db_statement", "row_id", "ticket_id"]
    - namespace: "runtime"
      max_label_keys: 4
      max_series: 8000
      forbidden_labels: ["pid", "thread_name"]
    - namespace: "agent"
      max_label_keys: 8
      max_series: 30000
      forbidden_labels: ["ticket_id", "workflow_id", "run_id", "user_id", "prompt_hash"]
    - namespace: "evaluation"
      max_label_keys: 8
      max_series: 20000
      forbidden_labels: ["case_id", "run_id", "candidate_id", "ticket_id"]
    - namespace: "slo"
      max_label_keys: 4
      max_series: 5000
      forbidden_labels: ["ticket_id", "user_id", "request_id"]
    - namespace: "otelcol"
      max_label_keys: 10
      max_series: 10000
      forbidden_labels: []

# --------------------------------------------------------------------------------
# LOG BODY REDACTION — SPEC-OP-007. deny_fields (above) deletes attribute KEYS;
# free-text log bodies need VALUE-level scrubbing instead. The Collector's
# transform/log-body-redaction processor applies replace_pattern(body, pattern,
# replacement) for each entry below, in the logs pipeline only, and stamps
# attributes["opsmind.log.redacted"]="true" when any pattern matched. Patterns are
# RE2 (Go regexp) — no lookahead. This is defense in depth; F7 already forbids
# producers from emitting these values at all.
# --------------------------------------------------------------------------------
log_body_redaction:
  collector_processor: "transform/log-body-redaction"
  redacted_attribute: "opsmind.log.redacted"
  patterns:
    - name: "bearer_token"
      pattern: "(?i)Bearer\\s+[A-Za-z0-9._~+/=-]{8,}"
      replacement: "Bearer [REDACTED]"
      reason: "OAuth/JWT bearer credential embedded in a free-text log line"
    - name: "jwt"
      pattern: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
      replacement: "[REDACTED_JWT]"
      reason: "raw JSON Web Token"
    - name: "email"
      pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      replacement: "[REDACTED_EMAIL]"
      reason: "PII email address"
    - name: "credit_card"
      pattern: "\\b(?:[0-9][ -]?){13,16}\\b"
      replacement: "[REDACTED_CARD]"
      reason: "PCI card number (13-16 digits, spaces/dashes allowed)"
    - name: "ssn"
      pattern: "\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b"
      replacement: "[REDACTED_SSN]"
      reason: "US Social Security Number"
    - name: "secret_kv"
      pattern: "(?i)(password|passwd|api[_-]?key|secret|token)\\s*[:=]\\s*\\S+"
      replacement: "$1=[REDACTED]"
      reason: "key=value / key: value credential embedded in free text"

# --------------------------------------------------------------------------------
# TRACE SAMPLING — SPEC-OP-010. Keep ALL error and slow traces and every trace
# carrying the risky-operation span attribute; probabilistically sample everything
# else. collector/base/config.yaml : processors.tail_sampling is the canonical
# enforcement and must stay in sync (validate-telemetry-governance.py).
# --------------------------------------------------------------------------------
trace_sampling:
  probabilistic_sampling_percentage: 10
  slow_trace_threshold_ms: 1000
  # A producer sets this span attribute on a security/compliance-sensitive operation
  # (MFA step-up, break-glass, an approval grant/deny, ...) to guarantee the trace is
  # never dropped by probabilistic sampling regardless of status/latency.
  risky_attribute_key: "security.sensitive"
  risky_attribute_values: ["true"]
  # Synthetic/smoke/canary traffic is always retained too (standard practice: a
  # monitoring probe's own trace must be reliably visible, independent of the
  # production sampling floor it exists to validate). scripts/observability-stack.sh
  # sets this on every push that is not itself testing the error/slow/risky policy.
  smoke_test_attribute_key: "opsmind.smoke_test"
  collector_processor: "tail_sampling"

# --------------------------------------------------------------------------------
# SCHEMA REVIEW — how a signal shape changes.
# --------------------------------------------------------------------------------
schema_review:
  rule: "additive-or-versioned"
  additive_change: "new optional attribute / new metric / new log field — PR + platform-observability review + the semantic owner from signal_owners"
  breaking_change: "rename / remove / retype / semantic change — requires a NEW version suffix (e.g. metric _v2), a deprecation window, and a migration note in the PR"
  forbidden: "silent breaking change; reusing a name with new meaning"
  gate: ".github/workflows/observability-platform-ci.yml : governance job"

# --------------------------------------------------------------------------------
# EXCEPTIONS — time-boxed, owned waivers to an allow/deny/budget rule.
# Each MUST have: id, rule, scope, reason, owner, approved_by, opened, expires (ISO
# date), ticket. expires MUST be in the future and <= opened + 90 days. High-risk
# waivers (any deny_field) also need domain-06 approval recorded in approved_by.
# The validator fails CI on an expired or malformed exception.
# --------------------------------------------------------------------------------
exceptions: []
