# owner: platform-observability
# spec: SPEC-OP-002; SPEC-OP-014 (verified metrics_generator/TraceQL/exemplars live;
#   added self-monitoring rules — no config change was needed, this was already right)
# rollback: git revert <sha>; docker compose -f infrastructure/docker-compose/observability-stack.yml up -d --force-recreate tempo
#
# Tempo config (ADR-0002). Receives traces ONLY from the Collector over internal OTLP
# 4317 (host port NOT published). metrics_generator emits span metrics + service graphs
# to Prometheus via remote_write — these are VIEWS, never business facts (ADR-0004).
# Block retention / object storage is SPEC-OP-015. Overlay sets environment parameters.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9096
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: ${TEMPO_BLOCK_RETENTION}

metrics_generator:
  registry:
    external_labels:
      source: tempo
      deployment_environment: ${TEMPO_ENV_LABEL}
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
        # SPEC-OP-030 — Prometheus's own web.yml now gates the whole server
        # (remote-write receiver included) behind basic auth; without this,
        # every remote_write here was silently rejected with 401 (confirmed
        # live via Tempo's own logs: "server returned HTTP status 401
        # Unauthorized"). Same local-dev-placeholder credentials as
        # prometheus/overlays/local/web.yml.
        basic_auth:
          username: admin
          password: admin
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
