# owner: platform-observability
# spec: SPEC-OP-002
# rollback: git revert <sha>; recreate otel-collector
#
# LOCAL overlay for the OpenTelemetry Collector. Merged AFTER collector/base/config.yaml
# via the Collector's multi --config support (later file overrides scalars; lists are
# replaced key-path by key-path). Local sets only laptop-friendly limits and shorter
# retry windows. It MUST NOT change pipeline structure or drop a processor.

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    send_batch_size: 2048
    send_batch_max_size: 4096
    timeout: 2s
  # SPEC-OP-010 — decision_wait is a timing knob (how long to buffer a trace before
  # deciding), never the sampling POLICY itself (percentages/thresholds stay the
  # base/ floor everywhere). Shorter locally so `smoke` doesn't wait unnecessarily.
  tail_sampling:
    decision_wait: 3s
    num_traces: 5000

# SPEC-OP-031 — one entry per real per-tenant exporter base/config.yaml now
# defines (9 tenants x 2 signal types); same laptop-friendly tuning every
# exporter already had, just applied to each tenant-suffixed name instead of
# the old single untenanted otlp/tempo/otlphttp/loki names.
exporters:
  otlp/tempo-user-access-authentication:
    sending_queue:
      queue_size: 400
    retry_on_failure:
      max_elapsed_time: 60s
