connectors:
  # SPEC-OP-031 — real per-tenant routing, keyed on service.namespace (a
  # REQUIRED resource attribute since SPEC-OP-004). Unlike SPEC-OP-009's
  # rejected per-SPAN-status-code routing attempt (routing connectors operate
  # at RESOURCE-batch granularity, confirmed by that spec's own real startup
  # failure), service.namespace genuinely IS a resource attribute — this is
  # exactly the use case this connector is designed for.
  routing/traces-tenant:
    default_pipelines: [traces/tenant-shared]
    # error_mode: propagate is a deliberate departure from this file's other
    # OTTL error_mode: ignore instances (those guard per-signal transform/filter
    # statements against a genuinely optional attribute being absent — safe to
    # swallow). A routing statement failing has no such safe interpretation: it
    # means telemetry silently stops reaching ANY tenant pipeline. Proven live
    # during SPEC-OP-031 — with error_mode: ignore, a real Tempo per-tenant
    # ingestion-limit bug (see tempo/base/overrides.yaml) surfaced as spans
    # simply vanishing between receipt and export, no error anywhere. Keep
    # this on propagate.
    error_mode: propagate
    match_once: true
    table:
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "user-access-authentication"'
        pipelines: [traces/tenant-user-access-authentication]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "ticket-workflow"'
        pipelines: [traces/tenant-ticket-workflow]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "agent-runtime"'
        pipelines: [traces/tenant-agent-runtime]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "memory-knowledge"'
        pipelines: [traces/tenant-memory-knowledge]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "tool-integration"'
        pipelines: [traces/tenant-tool-integration]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "policy-approval-governance"'
        pipelines: [traces/tenant-policy-approval-governance]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "evaluation-improvement"'
        pipelines: [traces/tenant-evaluation-improvement]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "observability-platform"'
        pipelines: [traces/tenant-observability-platform]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "shared"'
        pipelines: [traces/tenant-shared]
  routing/logs-tenant:
    default_pipelines: [logs/tenant-shared]
    # Same reasoning as routing/traces-tenant above.
    error_mode: propagate
    match_once: true
    table:
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "user-access-authentication"'
        pipelines: [logs/tenant-user-access-authentication]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "ticket-workflow"'
        pipelines: [logs/tenant-ticket-workflow]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "agent-runtime"'
        pipelines: [logs/tenant-agent-runtime]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "memory-knowledge"'
        pipelines: [logs/tenant-memory-knowledge]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "tool-integration"'
        pipelines: [logs/tenant-tool-integration]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "policy-approval-governance"'
        pipelines: [logs/tenant-policy-approval-governance]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "evaluation-improvement"'
        pipelines: [logs/tenant-evaluation-improvement]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "observability-platform"'
        pipelines: [logs/tenant-observability-platform]
      - context: resource
        statement: 'route() where attributes["service.namespace"] == "shared"'
        pipelines: [logs/tenant-shared]
extensions:
  # ADR-0007 — every producer authenticates with a bearer token before the Collector
  # accepts its telemetry. The token is never committed; local/CI use a placeholder
  # (collector/overlays/local/values.env), production sources a real secret.
  bearertokenauth:
    scheme: "Bearer"
    token: "${env:OTEL_GATEWAY_AUTH_TOKEN}"
  # ADR-0007 — check_collector_pipeline makes /  (13133) reflect real READINESS
  # (the pipeline is actually exporting), not just that the process is alive.
  health_check:
    endpoint: 0.0.0.0:13133
    check_collector_pipeline:
      enabled: true
      interval: 5s
      exporter_failure_threshold: 5
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679
  # SPEC-OP-011 — persistent (WAL) backing store for otlp/tempo + otlphttp/loki
  # sending_queue. A crash/redeploy no longer silently loses whatever was queued.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    timeout: 10s

service:
  extensions: [bearertokenauth, health_check, pprof, zpages, file_storage]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, transform/resource-contract, transform/baggage-contract, filter/noise, attributes/semconv-compat, transform/trace-priority, transform/governance, tail_sampling, batch]
      exporters: [routing/traces-tenant]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, transform/resource-contract, transform/baggage-contract, attributes/semconv-compat, transform/metric-cardinality, transform/governance, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, transform/resource-contract, transform/baggage-contract, filter/noise, attributes/semconv-compat, transform/log-schema-contract, transform/log-body-redaction, transform/governance, batch]
      exporters: [routing/logs-tenant]
    traces/tenant-user-access-authentication:
      receivers: [routing/traces-tenant]
      # validate-collector-pipeline.py requires every pipeline to start with
      # memory_limiter, end with batch, and include transform/governance — no
      # exception for connector-fed fan-out pipelines. Real justification, not
      # just satisfying the check: memory_limiter here guards against the
      # routing connector's own fan-out building backpressure; transform/
      # governance re-applies the deny-list floor defense-in-depth (idempotent —
      # the keys are already gone from the upstream run); batch re-batches this
      # now-single-tenant stream before its own dedicated exporter, instead of
      # reusing the all-tenants-mixed batch from upstream.
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-user-access-authentication]
    traces/tenant-ticket-workflow:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-ticket-workflow]
    traces/tenant-agent-runtime:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-agent-runtime]
    traces/tenant-memory-knowledge:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-memory-knowledge]
    traces/tenant-tool-integration:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-tool-integration]
    traces/tenant-policy-approval-governance:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-policy-approval-governance]
    traces/tenant-evaluation-improvement:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-evaluation-improvement]
    traces/tenant-observability-platform:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-observability-platform]
    traces/tenant-shared:
      receivers: [routing/traces-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlp/tempo-shared]
    logs/tenant-user-access-authentication:
      receivers: [routing/logs-tenant]
      processors: [memory_limiter, transform/governance, batch]
      exporters: [otlphttp/loki-user-access-authentication]
    logs/tenant-ticket-workflow:
