      max_elapsed_time: 120s
  otlp/tempo-agent-runtime:
    endpoint: ${env:OTEL_TEMPO_ENDPOINT}
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: "agent-runtime"
    sending_queue:
      enabled: true
      queue_size: 1000
      num_consumers: 10
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 120s
  otlp/tempo-memory-knowledge:
    endpoint: ${env:OTEL_TEMPO_ENDPOINT}
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: "memory-knowledge"
    sending_queue:
