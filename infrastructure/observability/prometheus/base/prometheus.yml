# owner: platform-observability
# spec: SPEC-OP-002; SPEC-OP-012 (file_sd discovery + WAL compression)
# rollback: git revert <sha>; docker compose -f infrastructure/docker-compose/observability-stack.yml up -d --force-recreate prometheus
#
# Prometheus server config (ADR-0002). Scrape targets here are the observability
# platform's own components — self-monitoring seed for SPEC-OP-033. Business /
# infrastructure scrape targets (postgres_exporter, rabbitmq, node) are added by
# SPEC-OP-018 / SPEC-OP-029 as NEW files under file_sd/ (SPEC-OP-012) — no edit to
# this file needed. Rule authoring lives in ../rules/, never in an overlay.
#
# Authentication: query-API/web access control is explicitly SPEC-OP-030
# (Observability Access Control)'s job, not this spec's — adding ad-hoc basic_auth
# here now would be redone/duplicated once OP-030 defines the real cross-component
# RBAC model. Scrape-side: targets scraped here are this platform's own internal
# operational endpoints (not the producer-facing OTLP boundary SPEC-OP-008/ADR-0007
# secures), consistent with that ADR's own stated boundary.
#
# Container paths (mounted by observability-stack.yml):
#   /etc/prometheus/prometheus.yml         this file
#   /etc/prometheus/file_sd/*.json         <- infrastructure/observability/prometheus/base/file_sd
#   /etc/prometheus/rules/recording/*.yml  <- infrastructure/observability/rules/recording
#   /etc/prometheus/rules/alerting/*.yml   <- infrastructure/observability/rules/alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: opsmind
    # Expanded from the overlay's PROMETHEUS_ENV_LABEL via
    # --enable-feature=expand-external-labels (set in observability-stack.yml).
    deployment_environment: ${PROMETHEUS_ENV_LABEL}

rule_files:
  - /etc/prometheus/rules/recording/*.yml
  - /etc/prometheus/rules/alerting/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      # SPEC-OP-030 — Alertmanager's own web.yml now gates its whole server
      # behind basic auth; without this, every alert notification here was
      # silently rejected with 401.
      basic_auth:
        username: admin
        password: admin

scrape_configs:
  # Self-scrape stays static — Prometheus scraping itself never benefits from
  # discovery, and it must work even if file_sd's directory were ever empty.
  - job_name: prometheus
    # SPEC-OP-035 — REAL BUG found+fixed live: SPEC-OP-030 gated Prometheus's
    # WHOLE server (not just the query API) behind basic auth, but this
    # self-scrape target was never given credentials — it has been silently
    # 401'ing since SPEC-OP-030 shipped (confirmed via /api/v1/targets:
    # health=down, lastError="server returned HTTP status 401 Unauthorized").
    # up{job="prometheus"} and every prometheus_* self-metric from this job
    # have been unavailable for the whole SPEC-OP-031~034 span without
    # anyone noticing, since a bare (job-unfiltered) PromQL query against a
    # metric name like prometheus_tsdb_wal_storage_size_bytes silently
    # returned Loki's/Tempo's OWN incidentally-same-named metric instead —
    # see rules/recording/disk-capacity.yml's own corrected comment.
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ["localhost:9090"]

  # SPEC-OP-012 — ONE file_sd_configs job, globbing the whole directory: dropping a
  # genuinely NEW target file (e.g. SPEC-OP-018/029's postgres_exporter/
  # rabbitmq_exporter/node_exporter) needs no prometheus.yml edit and no restart —
  # confirmed live, not assumed (a target added to this directory while Prometheus
  # was running appeared within one refresh_interval). job_name here is only the
  # DEFAULT; every file under file_sd/ sets its own "labels":{"job": "..."}, which
  # takes precedence — confirmed live that a target's own job label wins even though
  # every file shares this one job_name/scrape_config (see the traceability doc).
  #
  # SPEC-OP-035 — basic_auth here too: this job also discovers alertmanager.json
  # (SPEC-OP-030 gated Alertmanager's whole server too), and the SAME 401
  # self-scrape bug applied to it. Harmless for every other file_sd target
  # (otel-collector/loki/tempo/grafana/postgres-exporter/rabbitmq/
  # synthetic-probe) — none of them validate the Authorization header, so an
  # unnecessary one is silently ignored; confirmed live post-fix, all still
  # report up=1.
  - job_name: file-sd-observability-platform
    basic_auth:
      username: admin
      password: admin
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/*.json"]
        refresh_interval: 15s
