[project]
name = "opsmind-event-relay"
version = "0.1.0"
description = "SPEC-XREL-001 — bridges opsmind.events approval/improvement events into the Python services' HTTP event seams"
requires-python = ">=3.13"
dependencies = [
    # pika (blocking client), the same choice every Python service in this repo
    # made for its own outbound publisher — no asyncio anywhere in the platform.
    "pika>=1.3",
    "httpx>=0.28",
    "pydantic-settings>=2.5",
    # SPEC-XREL-001 §Observability: per-message spans, W3C traceparent propagation
    # into the HTTP fan-out, and relay-owned metrics (consumed / delivered / dlq).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_relay"]
