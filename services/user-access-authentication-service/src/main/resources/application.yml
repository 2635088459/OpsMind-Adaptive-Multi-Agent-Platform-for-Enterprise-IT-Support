spring:
  application:
    name: user-access-authentication-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Project-level integration verification (2026-09-01): scopes this
  # service's own `flyway_schema_history` bookkeeping table into its own
  # `identity` schema instead of Flyway's default `public` -- without this,
  # every one of the 3 Java services here collided in the same shared
  # `public.flyway_schema_history` table the moment they ran against the same
  # database at once (same-numbered migrations across services read back as
  # checksum mismatches). See V001's own comment for the full root cause.
  flyway:
    schemas: identity
    default-schema: identity

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        # SPEC-EP-001's own BFF token-relay endpoint is called by the domain
        # 09/10 frontend from a genuinely different origin (its own SPA dev
        # server or CDN, never this service's own host) — a cross-origin
        # fetch only carries this session cookie back if it is SameSite=None
        # (Lax only survives top-level navigations, which the callback
        # redirect is, but the later token-relay call from the SPA's own JS
        # is not). Secure is required alongside None regardless of scheme;
        # modern browsers treat http://localhost as a secure context for
        # this purpose, so local dev needs no TLS to exercise it for real.
        same-site: none
        secure: true

app:
  identity:
    cors:
      # Empty/deny by default (INV-UA-002) — an operator opts specific
      # frontend origins in per environment. See profile-specific files.
      allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS:}
    observability:
      tempo:
        # SPEC-SC-014. See TempoQueryProperties's own javadoc for why this
        # defaults to host.docker.internal rather than joining the
        # observability stack's own Compose network directly. `tenants` is
        # deliberately left unset here — its own compact constructor
        # supplies the real default list; an empty env-var placeholder
        # would bind as a single blank-string entry, not an empty list.
        base-url: ${TEMPO_QUERY_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true

logging:
  level:
    root: INFO
    com.opsmind.identity: INFO
