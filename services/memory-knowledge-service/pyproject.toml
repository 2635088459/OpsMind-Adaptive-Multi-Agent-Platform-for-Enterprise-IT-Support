[project]
name = "memory-knowledge-service"
version = "0.1.0"
description = "OpsMind Memory Knowledge Service"
requires-python = ">=3.13"

# Module Foundation.
#
# SPEC-MK-001 establishes module and package boundaries with in-memory
# placeholder adapters (docs/low-level-design/domains/04-memory-knowledge/
# 13-package-and-class-design). Per docs/low-level-design/shared/
# technology-baseline, Memory Knowledge is a Python service in the same
# family as agent-runtime-service (agents/LLMs/RAG/memory), so this
# pyproject mirrors agent-runtime-service's own SPEC-ARO-001 scoping exactly:
# SQLAlchemy + Alembic (real `memory` Postgres schema) land with SPEC-MK-002
# (schema baseline); the real RabbitMQ publisher and pgvector-backed
# embedding storage land with SPEC-MK-003 (outbox/idempotency/audit
# baseline) and phase-02/05 respectively. Nothing here is fabricated ahead
# of the spec that actually wires it.
dependencies = [
    "fastapi>=0.118",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryknowledge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast, no external I/O",
    "integration: requires Docker (Postgres via testcontainers)",
]

[tool.importlinter]
root_packages = ["memoryknowledge"]
include_external_packages = true

# SPEC-MK-001 domain-rules: "No Ticket/Workflow/Tool state ownership" and
# 13-package-and-class-design layering. Mirrors agent-runtime-service's own
# import-linter contracts and the Java sibling services' ArchUnit
# LayerDependencyTest.
[[tool.importlinter.contracts]]
name = "Layers: interfaces -> application -> domain"
type = "layers"
layers = [
    "memoryknowledge.interfaces",
    "memoryknowledge.application",
    "memoryknowledge.domain",
]

[[tool.importlinter.contracts]]
name = "Domain must not depend on the web/ORM frameworks"
type = "forbidden"
source_modules = ["memoryknowledge.domain"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Application must not depend on infrastructure"
type = "forbidden"
source_modules = ["memoryknowledge.application"]
forbidden_modules = ["memoryknowledge.infrastructure"]

# "Interfaces must not depend on infrastructure directly" is enforced by
# tests/architecture/test_interfaces_boundary.py instead of an import-linter
# "forbidden" contract: that contract type follows the whole transitive
# import graph, which would also flag every router's legitimate
# `interfaces -> memoryknowledge.container -> infrastructure`
# composition-root edge (memoryknowledge.container is the one module
# allowed to wire concrete adapters — see its own docstring). The AST-based
# test checks only *direct* imports, which is the rule that actually
# matters here.
