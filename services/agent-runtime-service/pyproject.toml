[project]
name = "agent-runtime-service"
version = "0.1.0"
description = "OpsMind Agent Runtime Orchestration Service"
requires-python = ">=3.13"

# Runtime Foundation.
#
# SPEC-ARO-001 established module and package boundaries with in-memory
# placeholder adapters. SPEC-ARO-002 (schema baseline) adds the real
# `agent_runtime` PostgreSQL schema via SQLAlchemy + Alembic. The RabbitMQ
# async client, LangGraph, and LangSmith still land later (SPEC-ARO-003 /
# phase-05/06/07 / phase-02) — see docs/low-level-design/shared/
# technology-baseline for the full frozen Python Agent Runtime stack.
dependencies = [
    "fastapi>=0.118",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentruntime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast, no external I/O",
    "integration: requires Docker (Postgres via testcontainers)",
]

[tool.importlinter]
root_packages = ["agentruntime"]
include_external_packages = true

# SPEC-ARO-001 domain-rules: "Runtime state and Ticket state must remain
# separate" / 13-package-and-class-design layering. Mirrors the Java
# sibling services' ArchUnit LayerDependencyTest.
[[tool.importlinter.contracts]]
name = "Layers: interfaces -> application -> domain"
type = "layers"
layers = [
    "agentruntime.interfaces",
    "agentruntime.application",
    "agentruntime.domain",
]

[[tool.importlinter.contracts]]
name = "Domain must not depend on the web/ORM frameworks"
type = "forbidden"
source_modules = ["agentruntime.domain"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Application must not depend on infrastructure"
type = "forbidden"
source_modules = ["agentruntime.application"]
forbidden_modules = ["agentruntime.infrastructure"]

# "Interfaces must not depend on infrastructure directly" is enforced by
# tests/architecture/test_interfaces_boundary.py instead of an import-linter
# "forbidden" contract: that contract type follows the whole transitive import
# graph, which would also flag every router's legitimate
# `interfaces -> agentruntime.container -> infrastructure` composition-root
# edge (agentruntime.container is the one module allowed to wire concrete
# adapters — see its own docstring). The AST-based test checks only *direct*
# imports, which is the rule that actually matters here.
