[project]
name = "agent-runtime-service"
version = "0.1.0"
description = "OpsMind Agent Runtime Orchestration Service"
requires-python = ">=3.13"

# Runtime Foundation.
#
# SPEC-ARO-001 established module and package boundaries with in-memory
# placeholder adapters. SPEC-ARO-002 (schema baseline) adds the real
# `agent_runtime` PostgreSQL schema via SQLAlchemy + Alembic. SPEC-ARO-025
# (phase-07) adds the real RabbitMQ publisher. SPEC-ARO-034 adds
# opentelemetry-api/sdk ("OpenTelemetry Python" is explicitly listed in the
# frozen Python Agent Runtime stack, docs/low-level-design/shared/
# technology-baseline §10 "System Observability") — no live OTel
# Collector/Prometheus exists in this repo's own docker-compose yet, so the
# default exporter is Console (see settings.otel_exporter), the same
# honesty-over-fabrication stance LoggingEventPublisherAdapter took before
# SPEC-ARO-025 confirmed a real RabbitMQ container. LangGraph and LangSmith
# still land later (phase-02).
#
# pika (blocking client), not an async client: every application service and
# FastAPI route in this codebase is synchronous (`def`, never `async def`) —
# testcontainers' own RabbitMqContainer test double also depends on pika, not
# aio-pika, reinforcing this as the natural fit rather than introducing a
# second, asyncio-based execution model alongside the SQLAlchemy Core
# synchronous session pattern everywhere else.
dependencies = [
    "fastapi>=0.118",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pika>=1.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "import-linter>=2.1",
    "testcontainers[postgres,rabbitmq]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentruntime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast, no external I/O",
    "integration: requires Docker (Postgres via testcontainers)",
]

[tool.importlinter]
root_packages = ["agentruntime"]
include_external_packages = true

# SPEC-ARO-001 domain-rules: "Runtime state and Ticket state must remain
# separate" / 13-package-and-class-design layering. Mirrors the Java
# sibling services' ArchUnit LayerDependencyTest.
[[tool.importlinter.contracts]]
name = "Layers: interfaces -> application -> domain"
type = "layers"
layers = [
    "agentruntime.interfaces",
    "agentruntime.application",
    "agentruntime.domain",
]

[[tool.importlinter.contracts]]
name = "Domain must not depend on the web/ORM frameworks"
type = "forbidden"
source_modules = ["agentruntime.domain"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Application must not depend on infrastructure"
type = "forbidden"
source_modules = ["agentruntime.application"]
forbidden_modules = ["agentruntime.infrastructure"]

# "Interfaces must not depend on infrastructure directly" is enforced by
# tests/architecture/test_interfaces_boundary.py instead of an import-linter
# "forbidden" contract: that contract type follows the whole transitive import
# graph, which would also flag every router's legitimate
# `interfaces -> agentruntime.container -> infrastructure` composition-root
# edge (agentruntime.container is the one module allowed to wire concrete
# adapters — see its own docstring). The AST-based test checks only *direct*
# imports, which is the rule that actually matters here.
