spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticket_workflow}
    username: ${DB_USERNAME:ticket_workflow}
    password: ${DB_PASSWORD:ticket_workflow}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/opsmind}

opsmind:
  attachment:
    cors:
      # Local dev origins for both frontend apps' own Vite dev servers, same as
      # every other Java service's own allow-list.
      allowed-origins: ${ATTACHMENT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    storage:
      # Real S3-compatible endpoint — MinIO locally (frozen technology-baseline
      # §"Object Storage"). path-style access is required for MinIO (virtual-
      # hosted-style bucket addressing, the AWS SDK's own default, does not
      # resolve against a local MinIO container).
      endpoint: ${ATTACHMENT_STORAGE_ENDPOINT:http://localhost:9000}
      access-key: ${ATTACHMENT_STORAGE_ACCESS_KEY:opsmind-minio}
      secret-key: ${ATTACHMENT_STORAGE_SECRET_KEY:opsmind-minio-secret}
      region: ${ATTACHMENT_STORAGE_REGION:us-east-1}

management:
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.opsmind.attachment: DEBUG
