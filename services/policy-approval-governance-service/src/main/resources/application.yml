spring:
  application:
    name: policy-approval-governance-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Project-level integration verification (2026-09-01): scopes this
  # service's own `flyway_schema_history` bookkeeping table into its own
  # `governance` schema instead of Flyway's default `public` -- without this,
  # every one of the 3 Java services here collided in the same shared
  # `public.flyway_schema_history` table the moment they ran against the same
  # database at once (same-numbered migrations across services read back as
  # checksum mismatches). See V001's own comment for the full root cause.
  flyway:
    schemas: governance
    default-schema: governance

server:
  shutdown: graceful

opsmind:
  portal:
    cors:
      # Empty/deny by default — an operator opts specific frontend origins in per environment.
      allowed-origins: ${PORTAL_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true

logging:
  level:
    root: INFO
    com.opsmind.policygovernance: INFO
