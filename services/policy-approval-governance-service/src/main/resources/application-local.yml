spring:
  datasource:
    # Same shared Postgres instance/database as ticket-workflow-service and
    # agent-runtime-service (infrastructure/docker-compose/local-platform.yml);
    # this service owns the `governance` schema within it, not a separate database.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticket_workflow}
    username: ${DB_USERNAME:ticket_workflow}
    password: ${DB_PASSWORD:ticket_workflow}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/opsmind}
  # SPEC-XOBS-001 Part A: only used when opsmind.governance.notifications.mode=smtp.
  # Mailpit accepts any sender/recipient with no auth (MP_SMTP_AUTH_ACCEPT_ANY); the
  # local default host is "localhost:1025" so a bare-metal run reaches a host-mapped
  # Mailpit, and full-platform.yml overrides MAIL_HOST=mailpit for the container network.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8086}

opsmind:
  portal:
    cors:
      # Local dev origins for both frontend apps' own Vite dev servers, same as
      # ticket-workflow-service/agent-runtime-service/user-access-authentication-service.
      allowed-origins: ${PORTAL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

management:
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.opsmind.policygovernance: DEBUG
