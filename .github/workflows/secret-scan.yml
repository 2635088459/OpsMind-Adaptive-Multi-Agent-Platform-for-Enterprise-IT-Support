name: Secret Scan

# gitleaks on every PR and push. The platform's real secrets (OpenAI key,
# Keycloak client secrets, DB passwords) belong in an untracked `.env`, a k8s
# Secret, or an external secret store — never in the tree. This gate fails the
# build if one lands in a commit or the working tree.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
