name: Frontend E2E

# The heavy gate that `frontend-ci.yml` deliberately leaves out: real
# browser-driven Playwright suites for both apps against the WHOLE platform
# (all backend services + Keycloak + the 2 frontend nginx containers) brought
# up from `full-platform.yml`. Not run on every PR — it builds ~11 images and
# drives a real OIDC login. Runs nightly, on `main` when the apps or the
# compose stack change, and on demand.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "infrastructure/docker-compose/local-platform.yml"
      - "infrastructure/docker-compose/full-platform.yml"
      - "infrastructure/keycloak/**"
      - ".github/workflows/frontend-e2e.yml"

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: full-platform e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f infrastructure/docker-compose/local-platform.yml -f infrastructure/docker-compose/full-platform.yml
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true

      - name: Resolve keycloak hostname (the BFF's iss claim uses it)
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts

      - name: Configure offline reasoning (deterministic @static-reasoning specs)
        run: |
          cat > infrastructure/docker-compose/.env <<'EOF'
          CONVERSATION_REASONING_MODE=static
          OPENAI_API_KEY=
          ANTHROPIC_API_KEY=
          EOF

      - name: Build + start the full platform
        run: $COMPOSE up -d --build --wait --wait-timeout 600

      - name: Platform status
        run: docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Seed demo data
        # Each script is idempotent and talks to the stack over its mapped host
        # port. seed-governance-policies / seed-demo-tickets also briefly toggle
        # directAccessGrantsEnabled on a Keycloak client (via `docker exec
        # opsmind-keycloak kcadm.sh`) and restore it on exit.
        run: |
          scripts/seed-knowledge-base.sh
          scripts/seed-memories.sh
          scripts/seed-tool-connectors.sh
          scripts/seed-governance-policies.sh
          scripts/seed-demo-tickets.sh | tee /tmp/tickets-seed.log
          # hand the approval-linked demo ticket id to the support-console e2e
          grep -oE 'SEED_TICKET_WITH_APPROVAL=[0-9a-f-]+' /tmp/tickets-seed.log | tail -1 >> "$GITHUB_ENV" || true
        env:
          MK_BASE_URL: http://localhost:8010
          TG_BASE_URL: http://localhost:8020
          PG_BASE_URL: http://localhost:8086
          TW_BASE_URL: http://localhost:18080
          KC_URL: http://localhost:8081

      - name: Cross-service tool-execution loop
        # The one thing per-service unit suites cannot cover: a confirmed
        # self-service action really crosses agent-runtime -> tool-integration-
        # gateway, executes, and wakes the WAITING_FOR_TOOL conversation. Needs
        # TOOL_GATEWAY_MODE=http (full-platform.yml default) + the password-reset
        # connector seeded above. Static reasoning keyword-matches "reset my
        # password" -> proposedAction, so no LLM key is needed here.
        run: bash scripts/tool-execution-loop-smoke.sh

      - name: Event-relay cross-service bridge (SPEC-XREL-001)
        # Proves the event-relay sidecar consumes opsmind.events, transforms the
        # governance/eval envelope to each Python service's HTTP event seam, POSTs
        # it, and settles (ack vs dlq) against real downstream responses — the
        # WAITING_FOR_APPROVAL / improvement.promoted paths that have no real
        # RabbitMQ consumer without it.
        run: bash scripts/approval-loop-smoke.sh

      - name: Ticket lifecycle chain (SPEC-XIT-001)
        # create -> triage -> assign -> IN_PROGRESS -> resolve -> confirm -> CLOSED,
        # asserting the status after every transition, then that the resulting
        # ticket.resolved.v1 was relayed into memory-knowledge's candidate-memory
        # pipeline (the knowledge base growing from real resolutions).
        run: bash scripts/ticket-lifecycle-smoke.sh

      - name: Approval grant / deny (SPEC-XIT-001)
        # A governance ApprovalRequest granted by a different user than requested it
        # (separation of duties) -> APPROVED; a second one denied -> DENIED; both
        # approval.{granted,denied}.v1 published and consumed by the event-relay.
        run: bash scripts/approval-decision-smoke.sh

      - name: Conversational-intake + multimodal
        # Employee sends a chat message with an image attachment; agent-runtime
        # really fetches those bytes back from attachment-service. Proves the
        # multimodal path (MinIO object + Postgres row + cross-service byte fetch)
        # end to end. Under static reasoning it still exercises steps 1-4.
        run: bash scripts/conversation-multimodal-smoke.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter employee-portal exec playwright install --with-deps chromium

      - name: employee-portal e2e
        run: pnpm --filter employee-portal test:e2e
        env:
          E2E_REASONING_MODE: static

      - name: support-console e2e
        if: always()
        run: pnpm --filter support-console test:e2e
        env:
          # set by the seed step; points the ticket-approval / @sc-014 specs at
          # the demo ticket that has a real linked approval request
          E2E_TICKET_WITH_APPROVAL: ${{ env.SEED_TICKET_WITH_APPROVAL }}

      - name: Dump platform logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            apps/*/playwright-report
            apps/*/e2e/.output
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
