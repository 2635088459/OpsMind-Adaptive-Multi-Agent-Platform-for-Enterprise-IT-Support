name: Observability Platform CI

on:
  pull_request:
    paths:
      - "infrastructure/observability/**"
      - "infrastructure/docker-compose/observability-stack.yml"
      - "scripts/validate-observability-layout.py"
      - "scripts/validate-telemetry-governance.py"
      - "scripts/validate-signal-contracts.py"
      - "scripts/observability-stack.sh"
      - "scripts/tests/**"
      - "docs/specs/domains/08-observability-platform/**"
      - "docs/low-level-design/domains/08-observability-platform/**"
      - "docs/implementation-plans/domains/08-observability-platform/**"
      - ".github/workflows/observability-platform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/observability/**"
      - "infrastructure/docker-compose/observability-stack.yml"
      - "scripts/validate-observability-layout.py"
      - "scripts/validate-telemetry-governance.py"
      - "scripts/validate-signal-contracts.py"
      - "scripts/observability-stack.sh"
      - "scripts/tests/**"

jobs:
  layout:
    name: Layout and Boundary Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pyyaml

      - name: Validate observability layout, versions, and boundaries (SPEC-OP-001)
        run: python scripts/validate-observability-layout.py

      - name: Validate telemetry governance baseline (SPEC-OP-003)
        run: python scripts/validate-telemetry-governance.py

      - name: Validate unified signal contracts (SPEC-OP-004+)
        run: python scripts/validate-signal-contracts.py

      - name: Run validator self-tests
        run: python -m unittest discover -s scripts/tests -v

  config:
    name: Component Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load pinned versions
        run: cat infrastructure/observability/versions.env >> "$GITHUB_ENV"

      - name: Render + validate merged Compose
        run: |
          docker compose \
            --env-file infrastructure/observability/versions.env \
            --env-file infrastructure/observability/prometheus/overlays/local/values.env \
            --env-file infrastructure/observability/alertmanager/overlays/local/values.env \
            -f infrastructure/docker-compose/observability-stack.yml config >/dev/null
          echo "compose config OK"

      - name: otelcol validate (base + local overlay)
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/observability/collector:/cfg:ro" \
            "${OTEL_COLLECTOR_IMAGE}:${OTEL_COLLECTOR_TAG}@${OTEL_COLLECTOR_DIGEST}" \
            validate --config=/cfg/base/config.yaml --config=/cfg/overlays/local/config.yaml
        env:
          OTEL_DEPLOYMENT_ENVIRONMENT: ci
          OTEL_TEMPO_ENDPOINT: tempo:4317
          OTEL_LOKI_ENDPOINT: http://loki:3100/otlp

      - name: promtool check config + rules
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/observability/prometheus/base/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infrastructure/observability/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool \
            "${PROMETHEUS_IMAGE}:${PROMETHEUS_TAG}@${PROMETHEUS_DIGEST}" \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/infrastructure/observability/rules:/rules:ro" \
            --entrypoint promtool \
            "${PROMETHEUS_IMAGE}:${PROMETHEUS_TAG}@${PROMETHEUS_DIGEST}" \
            check rules /rules/recording/platform-self.yml /rules/alerting/platform-self.yml /rules/alerting/signal-conformance.yml /rules/recording/cardinality.yml /rules/alerting/cardinality.yml

      - name: amtool check-config
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/observability/alertmanager/base/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint amtool \
            "${ALERTMANAGER_IMAGE}:${ALERTMANAGER_TAG}@${ALERTMANAGER_DIGEST}" \
            check-config /etc/alertmanager/alertmanager.yml

      - name: loki verify-config
        run: |
          docker run --rm \
            -e LOKI_RETENTION_PERIOD=72h \
            -v "$PWD/infrastructure/observability/loki/base/loki.yml:/etc/loki/loki.yml:ro" \
            "${LOKI_IMAGE}:${LOKI_TAG}@${LOKI_DIGEST}" \
            -verify-config -config.file=/etc/loki/loki.yml -config.expand-env=true

  smoke:
    name: Local Topology Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bring up stack + push and query a real signal
        run: ./scripts/observability-stack.sh smoke

      - name: Dump logs on failure
        if: failure()
        run: ./scripts/observability-stack.sh logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: ./scripts/observability-stack.sh down
