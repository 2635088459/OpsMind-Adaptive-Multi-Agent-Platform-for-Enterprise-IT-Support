name: Java Services CI

# One matrix leg per Maven service. `clean verify` runs unit + ArchUnit +
# failsafe (Testcontainers) — the same gate ticket-workflow-service already
# had; this workflow folds that one in and adds the three that had no CI.

on:
  pull_request:
    paths:
      - "services/ticket-workflow-service/**"
      - "services/policy-approval-governance-service/**"
      - "services/user-access-authentication-service/**"
      - "services/attachment-service/**"
      - "packages/**"
      - ".github/workflows/services-java-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/ticket-workflow-service/**"
      - "services/policy-approval-governance-service/**"
      - "services/user-access-authentication-service/**"
      - "services/attachment-service/**"
      - "packages/**"
      - ".github/workflows/services-java-ci.yml"

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.service }} · verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ticket-workflow-service
          - policy-approval-governance-service
          - user-access-authentication-service
          - attachment-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            services/${{ matrix.service }}/target/surefire-reports/**
            services/${{ matrix.service }}/target/failsafe-reports/**
            services/${{ matrix.service }}/target/site/jacoco/**
          if-no-files-found: warn

  # One rollup so branch protection can require a single check for the whole Java
  # backend rather than every matrix leg by name.
  java-services-ci:
    name: java services CI
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Fail if any service failed to verify
        run: |
          echo "verify=${{ needs.verify.result }}"
          [ "${{ needs.verify.result }}" != "failure" ] || exit 1
