name: Frontend CI

# Both Vite apps in the pnpm workspace: typecheck, lint, unit tests, and a
# production build. Playwright e2e is intentionally out of this fast gate —
# it needs the whole platform up; see frontend-e2e.yml (nightly / on-demand).

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.app }} · verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [employee-portal, support-console]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ${{ matrix.app }} typecheck

      - name: Lint
        run: pnpm --filter ${{ matrix.app }} lint

      - name: Unit tests
        run: pnpm --filter ${{ matrix.app }} test

      - name: Build
        run: pnpm --filter ${{ matrix.app }} build
