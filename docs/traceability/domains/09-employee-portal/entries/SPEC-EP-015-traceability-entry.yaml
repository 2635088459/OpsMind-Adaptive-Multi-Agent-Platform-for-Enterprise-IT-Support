  implementation_notes: 'Live 2026-09-08: both endpoints -> 200 {conversation_id,
    state, started_at, updated_at}, matches api.ts findConversation / findMostRecentConversation
    (404 -> null path also present). ROUND 6: fixed the resume-a-non-RUNNING- conversation
    gap the E2E surfaced — `useResumeConversation` used to always `seed("IDLE")`,
    re-enabling the composer for a terminal (COMPLETED/FAILED/ CANCELLED, incl. escalation)
    OR paused (WAITING_FOR_x/PAUSED) most-recent conversation; the next send then
    409''d and SPEC-EP-018 rendered it as a misleading "agent temporarily unavailable".
    Now any non-RUNNING resumed state seeds a new terminal turn state `RESUMED_CLOSED`
    (composer hidden + an honest "conversation isn''t active — start a new one" banner
    whose button `reset()`s + returns to IDLE). `escalation.spec.ts` is no longer
    `test.fixme` — it dismisses the banner and passes end to end.'
