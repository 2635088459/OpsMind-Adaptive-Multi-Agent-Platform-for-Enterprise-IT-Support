# Traceability matrix — domain 09-employee-portal
#
# Schema per the domain's own roadmap §18 (00-implementation-roadmap_EN.md):
#   SPEC-xxx:
#     phase: Phase-0N
#     design:   { use_cases: [...], api: [...], invariants: [...] }
#     implementation: { components: [...] }   # real files under apps/employee-portal/src/
#     tests: [...]                            # real *.test.ts(x) files
#
# Verified 2026-09-08 (frontend integration verification). `status` per spec:
#   - implemented+backend-verified: contract exercised live against the real
#     running backend during the 2026-09-08 pass.
#   - implemented+msw: code + tests complete; backend contract still MSW-mocked
#     because the real endpoint does not exist yet (each such spec names the gap).
# All 23 specs' own headers already read `Status: Implemented`; the suffix here
# records how far the *integration* verification could go, not code completeness.
#
# App test suite at verification time: 112 tests / 23 files, all green
# (apps/employee-portal, `npx vitest run`).

