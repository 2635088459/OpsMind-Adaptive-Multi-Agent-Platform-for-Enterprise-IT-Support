# Traceability matrix — domain 10-support-console
#
# Schema per the domain's own roadmap §18 (00-implementation-roadmap_EN.md),
# same shape as domain 09's matrix:
#   SPEC-xxx:
#     phase: Phase-0N
#     design:   { use_cases: [...], api: [...], invariants: [...] }
#     implementation: { components: [...] }   # real files under apps/support-console/src/
#     tests: [...]
#
# Verified 2026-09-08 (frontend integration verification). `status` suffixes:
#   - implemented+backend-verified: contract exercised live against the real
#     running backend on 2026-09-08.
#   - implemented+source-verified: request/response shapes checked field-for-field
#     against the real backend DTO source, but the live path could not be fully
#     exercised (missing seed data - see notes).
#   - implemented+backend-pending / +session-auth: needs a running rebuild or a
#     browser session cookie to exercise live.
# All 20 specs' own headers already read `Status: Implemented`.
#
# App test suite at verification time: 92 tests / 25 files, all green
# (apps/support-console, `npx vitest run`).
#
# Not in this matrix (no SPEC-SC-0xx of their own): the three admin surfaces
# apps/support-console/src/features/admin/{knowledge,connectors,policy}/ — built
# alongside the spec'd features but never chartered as Feature Specs in the
# 20-spec roadmap. connectors/api.ts had its base path corrected on 2026-09-08
# (missing /internal/tool-gateway/v1 prefix); policy/api.ts targets
# PolicyQueryController (GET /api/v1/policies), real in source since commit
# 17ccb66 and now in the running image after the 2026-09-08 rebuild.
#
# 2026-09-08 (round 5): ApprovalCard / TraceWaterfall / EvaluationComparisonTable
# were built + unit-tested but no route rendered them. Now wired:
#   - ApprovalCard  -> features/approval/TicketApprovals.tsx, mounted on the
#     ticket detail page; the approvalRequestId comes from this ticket's real
#     GovernanceAuditRecordResponse.approvalRequestId (SPEC-PG-030), newly
#     surfaced through AiLogEntry + useAiLog.approvalRequestIds.
#   - TraceWaterfall + EvaluationComparisonTable -> pages/ObservabilityPage.tsx
#     at route /observability (top-nav link), each behind a paste-an-id form +
#     an "open in Tempo / LangSmith" link-out (UC-SC-05 / UC-SC-06).

