SPEC-SC-009:
  phase: Phase-04
  status: implemented+backend-verified
  design:
    use_cases: [UC-SC-03]
    api: ["POST /api/v1/approval-requests/{id}:grant (SPEC-PG-011)", "POST /api/v1/approval-requests/{id}:deny (SPEC-PG-011)"]
    invariants: [BI-SC-005]
    references: ["04-use-cases UC-SC-03", "SPEC-PG-011 (commandIdempotencyKey 3-way replay check)"]
  implementation:
    components: [features/approval/api.ts, features/approval/ApprovalCard.tsx, features/approval/useApproval.ts, features/approval/TicketApprovals.tsx, pages/TicketDetailPage.tsx]
  tests:
