    the governed Get Ticket / Timeline schemas (both additionalProperties:false).
    Frontend `TicketTraceLink` renders "Open trace in Tempo ↗" in the detail
    header when non-null. Live-verified: a processed ticket -> 200
    {traceId:"52a4..."}, an unprocessed one -> 200 {traceId:null}, an employee
    token -> 403. E2E `@sc-014` asserts the deep link on a real ticket.

SPEC-SC-015:
