SPEC-ARO-021:
  domain: 03-agent-runtime-orchestration
  name: Consume Approval Events
  cn_name: 消费 Approval Events
  status: implemented
  service: agent-runtime-service
  implementation_notes: >
    04-use-cases UC-03 "消费 approval.granted" lists six steps: "1. Consumer 收到
    approval.granted" (the generic gate ConsumeRuntimeEventService already owns);
    "2. 去重并根据 approvalRequestId 找到 Workflow Instance"; "3. 校验 workflow 正在
    WAITING_FOR_APPROVAL"; "4. 写 checkpoint，恢复 planner context"; "5. 将相关 Agent Task
    标记为可继续"; "6. Workflow 迁移回 RUNNING." None of these were implemented — the
    consumer never dispatched to anything type-specific until SPEC-ARO-020.

    Step 2 differs from SPEC-ARO-020's own tool.completed.v1 lookup in a structural way:
    unlike Tool Request (a Runtime-owned aggregate SPEC-ARO-017 gave its own table),
    07-data-model has no approval_requests table at all — Approval is not this Runtime's
    aggregate. approvalRequestId is therefore carried through the payload for audit/
    correlation only; the actual lookup is the envelope's own workflowInstanceId, the
    same field the generic gate already resolves. This also means step 3's own
    "校验 workflow 正在 WAITING_FOR_APPROVAL" has to serve double duty as this consumer's
    only idempotency guard: with no local ApprovalRequest record whose own terminal
    state could otherwise flag "already resolved" the way ConsumeToolResultService's Tool
    Request status does, a workflow no longer WAITING_FOR_APPROVAL (already woken by a
    prior delivery, or never in that wait) is a no-op, not an error.

    06-event-contracts documents exactly one contract, approval.granted.v1, with a
    `decision` key field, and 03-state-machine's own external-wake-up rule only pairs
    approval.granted with waking WAITING_FOR_APPROVAL — no approval.rejected.v1 exists
    and UC-03's six steps describe only the "resume" path with no rejection branch of its
    own, even though domain-rules generically requires "失败路径必须保留可审计原因."
    Resolved this gap with the user (AskUserQuestion): decision is treated as a status-
    style discriminator mirroring tool.completed.v1's own `status` field — decision ==
    "APPROVED" runs UC-03's own six steps; any other value fails the workflow outright.
    The reject path reuses the existing FailWorkflowService (the codebase's one
    authorized "fail a workflow" path — already idempotent via a deterministic
    `approval-reject:{workflowInstanceId}` key, already outbox-publishing) rather than
    hand-rolling a second one, folding decision/approvedBy into the auditable failure
    reason. The approve path has no equivalent existing service to reuse and UC-03 names
    no publish step of its own, so — unlike the reject path — it does not publish an
    outbox event; inventing a "workflow woken from approval" event neither 04-use-cases
    nor 06-event-contracts asks for would be scope creep.

    Step 4's checkpoint reuses CheckpointType.RECOVERY_SNAPSHOT ("recorded as an explicit
    recovery snapshot ahead of a crash-recovery-sensitive step") rather than WAIT_STATE
    ("recorded when a Workflow Instance enters a recoverable waiting state") — the latter
    describes entering a wait, not exiting one, and this spec never builds an entry path.
    RECOVERY_SNAPSHOT's own "recovery" wording is the direct match for step 4's own "恢复
    planner context" phrasing, and this is the type's first real writer in the codebase.
    Written only on the approved path — a rejected decision ends the workflow, leaving no
    planner context to recover.

    Step 5 ("将相关 Agent Task 标记为可继续") is deliberately NOT implemented: nothing in
    this codebase today ever transitions an Agent Task into WAITING_EXTERNAL
    (AgentTaskState's own docstring: "once an approval/verification/input wait exists" —
    no spec has built that entry path yet, and none of SPEC-ARO-021/022's own scope adds
    one either), so there is never a real task this step could find. Implementing it
    against a precondition nothing produces would be speculative, mirroring
    SPEC-ARO-020's own "no follow-up task creation" scope exclusion.

    A larger gap surfaced by this spec: unlike WAITING_FOR_TOOL (SPEC-ARO-019 built the
    request-tool HTTP entry point in the same phase that later consumed its result),
    nothing in this domain's roadmap builds an entry path into WAITING_FOR_APPROVAL at
    all — WorkflowState's own docstring only ever named "the WAITING_FOR_* wake-ups" as
    SPEC-ARO-020/021/022's job, never the entries. This is a genuine, currently-open gap
    (presumably owned by whatever future domain/phase decides when a workflow needs human
    approval), not something this spec's own scope (04-use-cases, 06-event-contracts)
    calls for closing. Every test that needs a WAITING_FOR_APPROVAL workflow therefore
    seeds it directly through the repository (one version at a time, respecting the same
    CAS every other non-1-version test fixture in this session already uses) rather than
    through any HTTP command — there is none.

    Verified with 306 tests total (up from 294): 270 unit/architecture — two new domain
    tests for wake_from_approval_wait()'s WAITING_FOR_APPROVAL guard, a new
    tests/application/test_consume_approval_service.py covering the approved wake,
    the RECOVERY_SNAPSHOT checkpoint contents, the non-approved fail-with-auditable-reason
    path, the already-resolved no-op, and an unknown-workflow-instance rejection, plus a
    new tests/application/test_consume_runtime_event_service.py test proving the dispatch
    fires under the literal "approval.granted.v1" event_type (the file's original 5 tests
    were left untouched), and two new tests/test_app.py HTTP-level tests exercising the
    real POST /events endpoint against a directly-seeded WAITING_FOR_APPROVAL workflow
    (approved: wakes to RUNNING, writes RECOVERY_SNAPSHOT, duplicate delivery is a no-op;
    rejected: fails the workflow); 36 integration tests against ephemeral testcontainers
    Postgres, mirroring both round-trip tests against the real migrated schema. lint-
    imports (3/3 contracts kept — ConsumeApprovalService is a normal application service),
    ruff --select F,E9 clean, and a curl walkthrough against the real docker-compose
    Postgres covering both paths end-to-end (workflow seeded WAITING_FOR_APPROVAL via
    direct SQL, since no HTTP entry point exists): an APPROVED decision wakes the workflow
    to RUNNING and writes a RECOVERY_SNAPSHOT checkpoint, a duplicate delivery under the
    same event_id returns applied=false, and a REJECTED decision on a second workflow
    fails it outright with the decision/approvedBy folded into the failure reason and no
    RECOVERY_SNAPSHOT checkpoint written — cross-checked directly against
    `agent_runtime.workflow_instances` and `agent_runtime.checkpoints`, plus confirming
    `agent_runtime.workflow.failed` reaches POST /admin/outbox/dispatch.
  lld_mapping:
    - 04-use-cases
    - 06-event-contracts
  forbidden:
    - agent_direct_tool_call
    - runtime_direct_ticket_state_write
    - cross_domain_distributed_transaction
