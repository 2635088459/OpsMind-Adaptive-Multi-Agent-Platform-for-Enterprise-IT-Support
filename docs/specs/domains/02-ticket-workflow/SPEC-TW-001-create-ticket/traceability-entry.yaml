  known_deviations_from_plan:
    - area: idempotency reservation
      note: >
        Implemented with a native INSERT ... ON CONFLICT (actor_scope, idempotency_key)
        DO NOTHING statement, exactly as recommended, executed via EntityManager
        rather than a Spring Data derived method (no derived-method equivalent exists
        for ON CONFLICT).
    - area: ticket insert / display id collision retry
      note: >
        Originally attempted with @Transactional(propagation = NESTED) around the
        JPA save, matching a savepoint-based retry pattern. Spring's JpaTransactionManager
        does not support savepoints with the Hibernate JPA dialect used here
        (NestedTransactionNotSupportedException), so the ticket insert was switched to
        the same native INSERT ... ON CONFLICT (display_id) DO NOTHING pattern used for
        idempotency. This keeps the bounded regeneration retry (SPEC-TW-001 §10) working
        inside the single Create Ticket transaction without a savepoint.
    - area: maven-failsafe-plugin reuseForks
      note: >
        Set to false. With the default (reuseForks=true), 12 Testcontainers-backed
        IT classes sharing one long-lived JVM fork showed escalating connection
        failures to their own freshly-started PostgreSQL containers later in the
        run (per-process resource accumulation across container lifecycles).
        A fresh JVM fork per IT class eliminated this; per-class times became
        uniform (~13-15s) instead of escalating (36s -> 417s).
    - area: audit_records table
      note: >
        07-data-model does not define this table (it is flagged as a future increment
        in 12-observability §71). Columns were designed to match the field list in
        SPEC-TW-001 §18 and the conventions of the other 07-data-model tables
        (UUID PK, VARCHAR actor/resource ids, TIMESTAMPTZ occurred_at). Hash-chain
        columns (previous_hash, record_hash) from the 12-observability proposal were
        deliberately not implemented — Phase 01 has no reader that needs chain
        verification yet, and the field list in the spec itself does not include them.
    - area: rate limiting
      note: >
        SPEC-TW-001 §5 defers full enforcement to Phase 09 ("Full enforcement may be
        hardened in Phase 09"); no rate-limit counting or 429 response is implemented
        in this phase, matching that explicit deferral.
    - area: CreateTicketAtomicityIT coverage
      note: >
        The spec lists seven failure-injection points (FAIL_TICKET_INSERT through
        FAIL_IDEMPOTENCY_COMPLETION). Two representative points (Outbox insert,
        Audit insert) are exercised with toggleable test doubles; the rollback
        mechanism is the same @Transactional boundary regardless of which write
        fails, so these two demonstrate the property without duplicating identical
        plumbing seven times.

