openapi: 3.0.3
info:
  title: OpsMind Ticket Workflow - SPEC-TW-033 Support Queue Authorization
  version: 1.0.0
paths:
  /internal/v1/security/support-queue-authorization/evaluate:
    post:
      summary: Harden Support Queue scoped authorization so reads, queue queries, and command admission use one scope policy.
      operationId: evaluateSupportQueueAuthorization
      responses:
        '200':
          description: Policy evaluated
        '400':
          description: Invalid policy input
        '403':
          description: Policy denied
        '409':
          description: State or context conflict
        '500':
          description: Required guard failed closed
