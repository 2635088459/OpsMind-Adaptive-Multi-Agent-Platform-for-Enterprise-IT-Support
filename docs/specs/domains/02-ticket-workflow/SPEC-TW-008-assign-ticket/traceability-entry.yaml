SPEC-TW-008:
  title: Assign Ticket
  phase: IMP-TW-P03
  dependencies:
    - SPEC-TW-001
    - SPEC-TW-002
    - SPEC-TW-004
    - SPEC-TW-005
    - SPEC-TW-007

  design:
    use_cases: []
    api: []
    state_transitions:
      - SM-003
      - SM-004
    published_events:
      - ticket.assigned.v1
      - ticket.reassigned.v1
      - ticket.unassigned.v1
    lld_documents: []
    # Same reasoning as SPEC-TW-007: Phase 03 does not use the Phase 01/02
    # numbered UC-XXX/API-XXX/BI-XXX/lld_documents scheme. The actual
    # design source is the spec folder's own document set plus the
    # phase-level implementation plan, listed below instead.
    spec_documents:
      - README_EN.md
      - acceptance-criteria_EN.md
      - api-contract_EN.md
      - domain-rules_EN.md
      - persistence_EN.md
      - event-contract_EN.md
      - test-plan_EN.md
    implementation_plan:
      - phase-03-ticket-lifecycle-and-ownership_EN.md §8

  reconciliation:
    - area: superseding notice added to the frozen 03-state-machine low-level-design document
      note: >
        docs/low-level-design/domains/02-ticket-workflow/03-state-machine/README_EN.md
        and README_CN.md both now carry a "Superseded for Phase 03
        (2026-07-31)" notice at the top, added during this pass after the
        user confirmed the actually-implemented direction. That older
        document froze a completely different, AI-agent-automation-driven
        workflow model (NEW -> TRIAGING -> INVESTIGATING -> EXECUTING ->
        VERIFYING -> RESOLVED -> CLOSED, driven by activeWorkflowId, a
        Triage Agent, a Tool Gateway, and independent Verification) that
        was never actually implemented anywhere in this codebase: no
        SPEC-TW-001..008 code path ever populates activeWorkflowId, and no
        Triage Agent/Tool Gateway/Policy/Approval/Verification component
        exists. The human-support-ownership model this pass (and
        SPEC-TW-007 before it) actually implements — introducing
        TicketStatus.TRIAGED and TicketStatus.ASSIGNED as real persisted
        statuses, human Support Agents/Leads owning tickets via
        current_support_user_id — is the confirmed current direction per
        phase-03-ticket-lifecycle-and-ownership_EN.md, not something to
        second-guess going forward.

