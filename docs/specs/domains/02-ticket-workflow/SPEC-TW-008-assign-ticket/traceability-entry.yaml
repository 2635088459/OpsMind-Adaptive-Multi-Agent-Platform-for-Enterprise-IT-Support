      - TicketAssignmentEligibilityIT
      - TicketAssignmentAuthorizationIT
      - TicketAssignmentStateGuardIT
      - TicketAssignmentNotFoundIT
      - TicketAssignmentOptimisticLockingIT
      - TicketAssignmentIdempotentReplayIT
      - TicketAssignmentIdempotencyConflictIT
      - TicketAssignmentConcurrentVersionIT
