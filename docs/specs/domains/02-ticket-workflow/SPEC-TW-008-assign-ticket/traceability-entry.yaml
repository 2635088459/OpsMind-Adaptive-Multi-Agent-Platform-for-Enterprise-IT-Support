      - TicketAssignmentAuthorizationTest (Assign/Reassign/Unassign @Nested groups)
      - TicketAssignmentEligibilityTest (Assign/Reassign @Nested groups)
      - TicketAssignmentStateGuardTest (Assign/Reassign/Unassign @Nested groups)
    api:
      - TicketAssignmentControllerTest
      - TicketAssignmentValidationTest
      - TicketAssignmentErrorContractTest
    event_contract:
      - TicketAssignedEventContractTest
      - TicketReassignedEventContractTest
      - TicketUnassignedEventContractTest
    integration:
