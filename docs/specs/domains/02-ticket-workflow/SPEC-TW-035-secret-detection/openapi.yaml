openapi: 3.0.3
info:
  title: OpsMind Ticket Workflow - SPEC-TW-035 Secret Detection
  version: 1.0.0
paths:
  /internal/v1/security/secret-detection/evaluate:
    post:
      summary: Prevent secret-like content from entering messages, reasons, audit free text, and outbox payloads.
      operationId: evaluateSecretDetection
      responses:
        '200':
          description: Policy evaluated
        '400':
          description: Invalid policy input
        '403':
          description: Policy denied
        '409':
          description: State or context conflict
        '500':
          description: Required guard failed closed
