openapi: 3.0.3
info:
  title: OpsMind Ticket Workflow - SPEC-TW-037 Open Reconciliation Case
  version: 1.0.0
paths:
  /internal/v1/tickets/{ticketId}/reconciliation-cases:
    post:
      summary: Open an auditable reconciliation case for unknown results, cross-service conflicts, stale results, or data inconsistency.
      operationId: openReconciliationCase
      responses:
        '200':
          description: Recovery action accepted or applied
        '400':
          description: Invalid recovery command
        '403':
          description: Forbidden
        '404':
          description: Target not found
        '409':
          description: Recovery conflict
