SPEC-TG-018:
  domain: 05-tool-integration-gateway
  name: Tool Request Cancellation
  cn_name: Tool Request 取消流程
  status: implemented
  service: tool-integration-gateway
  phase: phase-04-retry-reconciliation-cancellation
  tech_stack: "Python 3.13+ / FastAPI, per this domain's own SPEC-TG-001 resolution"
  implementation_notes: >
    09-concurrency-and-idempotency §"Concurrent Cancellation": "Completion commits
    first: cancel returns final completed. Cancel commits first and connector has not
    been called: request enters CANCELLED. Cancel commits first but connector was
    called: request enters CANCEL_REQUESTED and waits for connector hook/
    reconciliation." SPEC-TG-001's own cancel_tool_request.py explicitly deferred this
    exact text to "phase-04's SPEC-TG-018 connector cancel hook territory" (its own
    module docstring's words) by auto-confirming CANCELLED immediately after requesting
    it — papering over the real race a genuinely concurrent worker resolving the same
    attempt could lose. Closed by: (1) new application.cancellation_race.
    save_resolved_tool_request(), the one shared resolver every EXECUTING-scoped
    completion save (execute_tool_request's SUCCESS/FAILED branches, reconcile_
    execution's SUCCESS/failure branches) now routes through — on a lost CAS race
    against a committed CANCEL_REQUESTED, a COMPLETED outcome still wins (a side effect
    that already happened cannot be undone), any other outcome honors the cancel; (2)
    reconcile_execution's own explicit CANCEL_REQUESTED branch for the "already
    committed before reconciliation even started" case (not a live race — no fail()/
    retry()/terminal_fail() edge exists from CANCEL_REQUESTED); (3) cancel_tool_request's
    own EXECUTING path genuinely stops at CANCEL_REQUESTED now, publishing no
    tool.cancelled.v1 until an actual resolver confirms it; (4) broadened the "no-op"
    guard from CANCELLED-only to any ToolRequestStatus.is_terminal() (SUCCESS/TERMINAL_
    FAILED/REJECTED/POLICY_DENIED/APPROVAL_DENIED never returned the current fact
    before, they raised InvalidToolRequestTransitionException) plus CANCEL_REQUESTED
    itself (repeat cancel while pending). New shared application.outbox_events.
    build_cancelled_event() replaces cancel_tool_request's own inline OutboxRecord
    construction so every CANCELLED-reaching path (immediate QUEUED cancel, or a later
    resolver honoring a pending one) builds the identical tool.cancelled.v1 shape.
  lld_mapping:
    - 04-use-cases
    - 09-concurrency-and-idempotency
    - 05-api-contracts
  forbidden:
    - agent_direct_tool_call
    - direct_ticket_state_write
    - direct_workflow_state_write
    - credential_leakage
    - raw_output_event_publication
    - approval_bypass
    - cross_domain_distributed_transaction
  test_evidence:
    unit: services/tool-integration-gateway/tests/application/test_cancellation_race.py, services/tool-integration-gateway/tests/application/test_full_flow.py (cancel-during-executing/reconcile-after-cancel/no-op tests)
    result: "115 passed (95 unit/application/architecture/e2e + 20 integration against real Postgres/RabbitMQ via testcontainers), 0 pyflakes warnings, 4/4 import-linter contracts kept"
