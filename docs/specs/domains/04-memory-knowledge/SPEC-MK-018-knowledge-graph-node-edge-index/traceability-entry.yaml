SPEC-MK-018:
  domain: 04-memory-knowledge
  name: Knowledge Graph Node Edge Index
  cn_name: Knowledge Graph node/edge index
  status: implemented
  service: memory-knowledge-service
  tech_stack: "Python 3.13+ / FastAPI / Pydantic (per docs/low-level-design/shared/technology-baseline)"
  implementation_notes: >
    01-domain-model §"GraphNode"/"GraphEdge" / 07-data-model / 08-transaction-and-outbox
    audit: the domain objects, VISIBLE/HIDDEN/TOMBSTONED state machine
    (03-state-machine §"Graph Index 状态"), repositories (find_by_stable_key/
    find_by_natural_key uniqueness, find_adjacent bounded-scan), and document-ingestion's
    own entity-extraction graph upsert (SPEC-MK-007/008/009) were all already correct
    from earlier phases. This spec's own real gap, flagged explicitly by SPEC-MK-015's
    own traceability entry as deferred here: PublishMemoryService never created any
    graph node/edge at all, so UC-05 step 6 ("upsert graph nodes / edges，并为新版本建立
    ... 关系") and 08-transaction-and-outbox §"Publish Memory Transaction" steps 7-8
    ("upsert graph nodes / edges", "对 superseded version 写 SUPERSEDES edge，并隐藏旧
    version 的默认检索 visibility") were entirely unbuilt — leaving
    ExecuteRetentionService's own graph-tombstone-on-delete logic (which looks up a
    `memory:{memoryId}` node) permanently inert, the same "pre-planted, never wired"
    shape SPEC-MK-011/012/015 already found in their own domains.

    Fixed: PublishMemoryService now upserts a `MEMORY` node (stable_key
    `memory:{memoryId}`, created once, reused across every version of that Memory) and
    a `MEMORY_VERSION` node (stable_key `memory_version:{memoryVersionId}`, one per
    published version) on every publish. When superseding an existing active version
    (SPEC-MK-015's own new memory_id path), it also writes a `SUPERSEDES` edge from the
    new version's node to the old one's and hides the old version's node — exactly
    matching 03-state-machine's own "MemoryVersion superseded 时，相关 SUPERSEDES 边新增，
    旧 version 节点默认 HIDDEN."

    Follow-up (post-integration, 2026-09-08): the earlier "no entity extraction for
    Memory content" stance left SearchMemoryService's graph-expansion path — which UC-02
    seeds *only* from MEMORY results — with nothing VISIBLE to traverse: a MEMORY_VERSION
    node's only edge (SUPERSEDES) always points at a HIDDEN node, and ExpandKnowledgeGraphService
    skips non-VISIBLE nodes, so every memory-seeded expansion returned zero paths in
    practice (agent-runtime-service had `include_graph_paths=false` hard-coded, masking
    it). PublishMemoryService now runs the *same* explicit-marker EntityExtractorPort
    document ingestion uses (SPEC-MK-007/008/009) over the version's own redacted
    content and upserts a `MENTIONS` edge from the MEMORY_VERSION node to each
    `memory:<type>:<name>` entity node (SERVICE/APPLICATION/SYMPTOM/...). Distinct
    memories that name the same entity share one node, so two related memories now sit
    two hops apart through it and the graph reranker can relate them. Same honest
    placeholder posture as ingestion — an explicit `<TYPE>: <name>` marker syntax, not a
    fabricated NLP extraction; a memory whose content carries no markers extracts
    nothing and the upsert is exactly the prior MEMORY + MEMORY_VERSION pair.
    agent-runtime-service's knowledge_retrieval_client now sends
    `include_graph_paths=true` so this actually reaches a conversation turn's ranking.
    DERIVED_FROM/SUPPORTED_BY/RESOLVED_BY edges to ticket/evidence entities (UC-05 step
    6's fuller description) still stay unbuilt — no TICKET graph nodes exist for a
    Memory to link to yet.

    Also found and closed: 06-event-contracts `knowledge.graph.updated.v1` ("图 nodes /
    edges 被 ingestion 或 memory publish 更新后发布") explicitly names memory publish as a
    second publisher of this event alongside document ingestion's own — the event/
    domain class already existed (used only by ingestion) but publish never fired it.
    PublishMemoryService now publishes it whenever its graph upsert actually creates a
    node or edge, carrying `index_version = memory_version.version` (mirroring
    IngestKnowledgeDocumentService's own `index_version = document.version` convention).
  lld_mapping:
    - 01-domain-model
    - 07-data-model
    - 08-transaction-and-outbox
  forbidden:
    - memory_direct_ticket_state_write
    - memory_direct_workflow_state_write
    - agent_direct_active_memory_write
    - graph_traversal_bypasses_acl
    - cross_domain_distributed_transaction
  test_evidence:
    unit: "services/memory-knowledge-service/tests (253 unit, includes: publish creates memory and version graph nodes plus publishes knowledge.graph.updated.v1; supersede writes a SUPERSEDES edge and hides the old version's node; and 4 new for the follow-up: publish links the version node to the SERVICE/APPLICATION entity nodes its content names, two memories naming the same service share one entity node, publish without markers creates no MENTIONS edges, and end-to-end graph expansion relates two published memories through a shared service entity)"
    integration: "services/memory-knowledge-service/tests/integration (publish creates real graph_nodes rows against a real migrated Postgres schema)"
    result: "253 unit passed, 3 import-linter contracts kept, ruff F/E9 clean; agent-runtime-service 574 unit passed after flipping include_graph_paths"
