SPEC-OP-031:
  domain: 08-observability-platform
  name: Telemetry Privacy And Tenant Isolation
  cn_name: 遥测隐私与 Tenant 隔离
  status: implemented
  phase: phase-07-security-privacy-config-governance
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-002, SPEC-OP-003, SPEC-OP-007, SPEC-OP-008, SPEC-OP-013, SPEC-OP-030]
  tech_stack: "OTel Collector routing connector (context: resource, OTTL route()) fanning traces/logs out by service.namespace into 9 real per-producing-domain Tempo/Loki tenants (X-Scope-OrgID) — a user-confirmed pivot back from an initially-explored real per-CUSTOMER tenant model"
  implementation_notes: >
    Concrete objective: "Redact at SDK and Collector, isolate tenant
    query/retention/encryption, and scan for PII/secrets."

    TENANT MODEL — a real, consequential decision made WITH the user across
    3 rounds, not assumed: this domain's own pre-existing
    signals/trace-propagation.yaml already defines a `tenant.id` BAGGAGE key
    (a genuine per-CUSTOMER concept, noted "single-tenant today"). Initial
    framing asked the user only about per-producing-DOMAIN routing depth
    (they chose "full rollout, all 9 domains"); mid-build, discovering that
    pre-existing baggage contract surfaced the real ambiguity, so this was
    re-raised. The user first chose to pivot to real customer-tenant with
    SDK code added to domain 01 — investigating that found TenantId lives on
    individual TENANT-scoped ResourceScope role assignments (0/1/many per
    user), not a single per-request value, and baggage propagates per-
    REQUEST while a producer's resource attributes are per-PROCESS — a real
    semantic mismatch, not a simple wiring gap. Surfaced again; the user
    chose to revert to per-producing-domain isolation. FINAL: one Tempo/Loki
    tenant per real producing domain (X-Scope-OrgID = service.namespace,
    already a SPEC-OP-004 required resource attribute) for all 9 domains +
    a "shared" fallback; the customer-tenant.id baggage gap remains real and
    unrealized, documented as a residual limitation, not silently dropped.

    BUILT: Collector `connectors: routing/traces-tenant, routing/logs-tenant`
    (context: resource, OTTL route() on service.namespace) fan out into 18
    new per-tenant pipelines (9 domains x traces+logs), each with its own
    X-Scope-OrgID-stamped exporter. Loki: auth_enabled: true +
    runtime_config.file (loki/base/overrides.yaml) with 2 differentiated
    per-tenant retention values proving the override is real, not just
    structurally present. Tempo: multitenancy_enabled: true +
    per_tenant_override_config (tempo/base/overrides.yaml), same 2
    differentiated tenants. SDK-level redaction: ADR-0008 + a new
    docs/producer-sdk-redaction-contract.md — a documented producer contract,
    not code added to another domain's service, matching this domain's own
    established "document, don't author another domain's code" boundary
    (see SPEC-TG-0xx's own closing note) and the customer-tenant pivot's own
    finding that domain 01 has no existing Baggage/redaction code to extend
    without a real LLD mapping asking for it. Collector-level redaction was
    already real (SPEC-OP-003/007) — reused, verified live under this spec
    (a bearer token + email embedded in a log body both landed in Loki
    already replaced with [REDACTED]/[REDACTED_EMAIL]).

    REAL BUGS found+fixed via live verification, not static review:
    (1) A genuinely silent pipeline stall: pushed spans were
    receiver-accepted but never reached any exporter, no error anywhere.
    Root cause was NOT the routing connector — it was tail_sampling's
    existing 10s decision_wait (untagged test spans hadn't cleared it yet)
    layered on top of (2): Tempo 2.7.1 does not merge a per-tenant
    overrides.yaml entry onto overrides.defaults field-by-field — listing a
    tenant at all REPLACES its whole Limits struct, so
    user-access-authentication's entry (only compaction.block_retention set)
    silently zeroed its own ingestion rate limit, surfacing as
    "RATE_LIMITED: ingestion rate limit (local: 0 bytes, global: 0 bytes)"
    once error_mode was flipped from the file's usual "ignore" to
    "propagate" on both routing connectors to stop silently swallowing this
    class of failure (kept on propagate deliberately — documented in
    config.yaml's own comment). Fixed by re-stating the same
    ingestion/global baseline as overrides.defaults on every per-tenant
    entry. (3) Loki's ruler HighLogSchemaViolationRate rule lived under
    Loki's synthetic "fake" tenant (the id used only when
    auth_enabled: false) — once real producers started stamping their own
    tenant id instead, that rule would have silently stopped evaluating
    against any real traffic forever, with no error. OSS Loki's ruler has no
    cross-tenant rule evaluation, so the same reviewed rule content was
    duplicated into all 9 real tenants' own rules directories
    (loki/rules/<tenant>/), fake/ removed. (4) Two of this domain's own
    governance validators (validate-collector-pipeline.py,
    validate-signal-contracts.py) had never accounted for a connector-fed
    fan-out pipeline: the pipeline check requires every service.pipelines
    entry to declare a non-empty processors list starting
    memory_limiter/ending batch/including transform/governance (a real,
    deliberate contract, not bypassed) — the 18 new pipelines genuinely
    needed [memory_limiter, transform/governance, batch] (backpressure
    guard + idempotent defense-in-depth + real per-tenant re-batch, not
    cargo-culted); separately, validate-signal-contracts.py's stricter
    "every processors: [ line in the file" check for
    resourcedetection/resource-contract/baggage-contract was correctly
    scoped down to pipelines receiving directly from otlp (the real ADR-0001
    ingestion boundary) rather than every downstream fan-out hop, since
    those attributes are already resolved upstream before the routing
    connector runs — re-checking them again per tenant would be duplicate
    no-op work, not a real additional guarantee. (5) An early sed edit meant
    to flip error_mode on just the 2 routing connectors instead matched all
    10 "error_mode: ignore" occurrences in the file, including 8 unrelated
    already-working processors; caught immediately via grep, reverted, redone
    with a precise line-targeted script. (6) 3 smoke-test regressions this
    spec's own multitenancy change caused: every pre-existing OP-002~028
    Tempo/Loki query in scripts/observability-stack.sh had no X-Scope-OrgID
    at all — fixed by tagging each with whichever real tenant its push
    actually routes to (its resource's service.namespace, or "shared" when
    none was set) rather than leaving them to pass only by 401's response
    body incidentally not matching the grep pattern.

    PII/secret scan: proven live via the existing SPEC-OP-007
    transform/log-body-redaction mechanism (a fixed, reviewed pattern list,
    documented in the SDK contract as a backstop, not a general scanner) —
    pushed a log body with an embedded fake bearer token + email, confirmed
    both landed in Loki already replaced ([REDACTED]/[REDACTED_EMAIL]),
    opsmind.log.redacted stamped. Encryption: out of scope this cycle — no
    new at-rest/in-transit encryption mechanism was built; TLS already gates
    the OTLP ingestion boundary (ADR-0007) and is the only encryption
    control this domain has ever asserted.
  lld_mapping:
    - 01-domain-model
    - 11-security
  forbidden:
    - business_state_mutation
    - fabricating_real_customer_tenant_isolation_without_a_real_derivation
    - editing_another_domains_application_code_without_an_lld_mapping_asking_for_it
  artifacts:
    contract:
      - infrastructure/observability/collector/base/config.yaml
      - infrastructure/observability/collector/overlays/local/config.yaml
      - infrastructure/observability/loki/base/loki.yml
      - infrastructure/observability/loki/base/overrides.yaml
      - infrastructure/observability/tempo/base/tempo.yml
      - infrastructure/observability/tempo/base/overrides.yaml
    enforcement:
      - infrastructure/docker-compose/observability-stack.yml
      - infrastructure/observability/loki/rules/user-access-authentication/log-quality.yaml
      - infrastructure/observability/loki/rules/ticket-workflow/log-quality.yaml
      - infrastructure/observability/loki/rules/agent-runtime/log-quality.yaml
      - infrastructure/observability/loki/rules/memory-knowledge/log-quality.yaml
      - infrastructure/observability/loki/rules/tool-integration/log-quality.yaml
      - infrastructure/observability/loki/rules/policy-approval-governance/log-quality.yaml
      - infrastructure/observability/loki/rules/evaluation-improvement/log-quality.yaml
      - infrastructure/observability/loki/rules/observability-platform/log-quality.yaml
      - infrastructure/observability/loki/rules/shared/log-quality.yaml
    rules_runbook:
      - infrastructure/observability/docs/adr/0008-sdk-level-redaction-contract.md
      - infrastructure/observability/docs/producer-sdk-redaction-contract.md
    tooling:
      - scripts/observability-stack.sh
      - scripts/validate-collector-pipeline.py
      - scripts/validate-signal-contracts.py
  test_evidence:
    lint: "validate-observability-layout.py 0 err; validate-telemetry-governance.py 0 err/0 warn; validate-signal-contracts.py 0 err/0 warn; validate-collector-pipeline.py 0 err/0 warn; validate-dashboards.py 0 err/1 pre-existing warn; validate-rule-catalog.py 0 err/11 pre-existing warn; compose config render OK"
    unit: "scripts/tests — 82 passed (3 pre-existing fixtures updated for this spec's real config-shape changes: 2 hardcoded exporters: [otlp/tempo] -> [routing/traces-tenant], 1 loki/rules/fake/ path -> loki/rules/shared/; no test logic weakened)"
    integration: >
      scripts/observability-stack.sh smoke — SMOKE: PASS, including every
      SPEC-OP-002~030 assertion (re-verified green after this spec's own
      breaking change to every existing Tempo/Loki query) plus new
      SPEC-OP-031 assertions: two traces from different service.namespace
      values each reachable ONLY under their own real tenant (200), fully
      invisible cross-tenant (404 both directions), and rejected with no
      tenant header at all (401); Tempo's differentiated
      user-access-authentication per-tenant block_retention (1w) confirmed
      as the live effective runtime override via Tempo's own
      /status/overrides/<tenant> endpoint; Loki's ruler confirmed evaluating
      the real per-tenant HighLogSchemaViolationRate rule for 2 different
      real tenants (not the old "fake" tenant); a live secret/PII push
      (embedded fake bearer token + email in a log body) confirmed scrubbed
      to [REDACTED]/[REDACTED_EMAIL] before reaching Loki. Full docker-
      compose stack verified via `up --wait`, all containers healthy.
      Verified 2026-09-01.
    result: >
      Real per-producing-domain tenant isolation (not per-customer — a
      residual, honestly-documented gap) is live across both Tempo and Loki:
      genuine query/retention separation proven with real cross-tenant
      404s and a real differentiated retention value confirmed loaded, not
      merely structurally present. Redaction is real and layered
      (Collector-enforced, tested; SDK-level is a documented contract, not
      an enforced control — stated honestly, not oversold) and proven live
      against an embedded fake secret+PII payload. Six real bugs were found
      via live verification (a Tempo per-tenant override struct-replace
      quirk zeroing ingestion limits; a Loki ruler rule orphaned by its own
      tenant directory; 2 governance validators never accounting for
      connector-fed fan-out pipelines; an over-broad sed edit; and every
      pre-existing smoke-test Tempo/Loki query breaking under real
      multitenancy) and fixed with the root cause understood, not papered
      over. The tenant-model architecture itself was decided WITH the user
      across 3 explicit rounds as new evidence emerged (a real
      pre-existing customer-tenant.id contract; then a real semantic
      mismatch in deriving it from domain 01's model) rather than assumed
      unilaterally at any point. Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-031-traceability.md
