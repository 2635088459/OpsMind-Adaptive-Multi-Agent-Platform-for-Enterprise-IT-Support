SPEC-OP-029:
  domain: 08-observability-platform
  name: PostgreSQL RabbitMQ And Connector Contract
  cn_name: PostgreSQL、RabbitMQ 与连接器契约
  status: implemented
  phase: phase-06-cross-domain-contracts
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager, obs-postgres, postgres-exporter, obs-rabbitmq]
  depends_on: [SPEC-OP-012, SPEC-OP-018]
  tech_stack: "Real postgres_exporter (prometheus-community) + RabbitMQ's own built-in rabbitmq_prometheus plugin, wired via SPEC-OP-012's file_sd discovery; a dedicated obs-postgres/obs-rabbitmq pair added to this stack's own docker-compose"
  implementation_notes: >
    Concrete objective: "Integrate infrastructure/connector exporters and
    standardize health, lag, retry, limit, and dependency spans." This
    closes an ALREADY-NAMED gap: SPEC-OP-018's own DatabaseBrokerInfrastructure
    runbook and dashboard already stated in writing "postgres_exporter/
    rabbitmq_exporter/node_exporter do not exist in this stack yet... this is
    explicitly SPEC-OP-029's scope" — confirmed still true
    (`infrastructure/postgres/` and `infrastructure/rabbitmq/` remain
    placeholder directories, only `.gitkeep`).
    REAL ARCHITECTURE DECISION: `local-platform.yml` already runs a real,
    shared Postgres+RabbitMQ pair for domain services (a SEPARATE compose
    project). Rather than couple this domain's own CI/smoke test to another
    compose project being simultaneously up, added a DEDICATED, throwaway
    `obs-postgres`/`obs-rabbitmq` pair directly to `observability-stack.yml`
    — purely so the exporters have something real to connect to. A
    production topology would point the same exporters at the real shared
    instances instead.
    `postgres_exporter` is a real separate sidecar (Postgres has no native
    Prometheus endpoint); RabbitMQ instead uses its OWN built-in
    `rabbitmq_prometheus` plugin (enabled via a command override) — no
    separate exporter needed for RabbitMQ.
    New rules/recording+alerting/db-broker-infrastructure.yml
    (PostgresConnectionPoolNearSaturation, RabbitmqQueueBacklogHigh — both
    warning, early-capacity signals not outright outages). Rewrote
    runbooks/DatabaseBrokerInfrastructure.md from its SPEC-OP-018 "deferred"
    shape to a real 8-section incident runbook; updated the dashboard's
    previously-deferred row with 4 real panels.
    REAL BUG FOUND DURING RECOVERY VERIFICATION: Prometheus/Alertmanager's
    images ship BusyBox's minimal `wget`, which has NO `--http-user`/
    `--http-password` flags ("unrecognized option", confirmed live) — the
    first healthcheck draft using them left both containers permanently
    unhealthy. Fixed with a manually-built Basic-auth header via
    `--header="Authorization: Basic ..."`, the only mechanism BusyBox wget
    supports.
    REAL CASCADING FINDING (SPEC-OP-030's own basic-auth gate, built
    alongside this spec in the same recovery pass): enabling Prometheus's/
    Alertmanager's auth broke 3 internal integrations that push data to
    them, each silently rejected with 401 until fixed — Tempo's own
    `metrics_generator` remote_write (SPEC-OP-014), Prometheus's own
    alertmanagers notifier config, and Loki's ruler alertmanager_url
    (SPEC-OP-013). All three found by running the REAL smoke test, not
    static review — see SPEC-OP-030's own traceability doc for the full
    account, since the auth work is that spec's own scope even though this
    spec's own SPEC-OP-014 assertion is what caught the first one.
    RECOVERY NOTE: this spec was originally built and partially verified,
    then most of its config (versions.env, compose services, rules, runbook
    rewrite, dashboard, file_sd targets) was lost in the same mid-session
    branch-checkout incident that affected SPEC-OP-024~028 — rebuilt in
    full a second time, re-verified live alongside SPEC-OP-030 in the same
    recovery pass.
  lld_mapping:
    - 01-domain-model
    - 07-data-model
    - 11-security
  forbidden:
    - business_state_mutation
    - coupling_this_stacks_ci_to_local_platform_yml_being_up
    - fabricating_a_dependency_this_spec_did_not_actually_stand_up
  artifacts:
    contract:
      - infrastructure/observability/versions.env
      - infrastructure/docker-compose/observability-stack.yml
    enforcement:
      - infrastructure/observability/prometheus/base/file_sd/postgres-exporter.json
      - infrastructure/observability/prometheus/base/file_sd/obs-rabbitmq.json
      - infrastructure/observability/rules/recording/db-broker-infrastructure.yml
      - infrastructure/observability/rules/alerting/db-broker-infrastructure.yml
    rules_runbook:
      - infrastructure/observability/runbooks/DatabaseBrokerInfrastructure.md
      - infrastructure/observability/dashboards/database-broker-infrastructure.json
    tooling:
      - scripts/observability-stack.sh
      - .github/workflows/observability-platform-ci.yml
  test_evidence:
    lint: "validate-observability-layout.py 0 err; validate-telemetry-governance.py 0 err/0 warn; validate-signal-contracts.py 0 err/0 warn; validate-collector-pipeline.py 0 err/0 warn; validate-dashboards.py 0 err; validate-rule-catalog.py 0 err; compose config render OK (3 new services); promtool check rules SUCCESS (2 recording + 2 alerting)"
    unit: "scripts/tests — 82 passed, unaffected"
    integration: >
      scripts/observability-stack.sh smoke — SMOKE: PASS, first run in this
      domain to bring up 9 containers (3 beyond the original 6). Confirmed
      pg_up=1, pg_settings_max_connections scraped, rabbitmq_identity_info
      scraped (proves the rabbitmq_prometheus plugin is genuinely enabled,
      not just that the container started), both new recording rules
      query-valid, both new alerts loaded. First attempt failed
      (Prometheus/Alertmanager unhealthy — the BusyBox wget bug above);
      second attempt failed differently (SPEC-OP-014's exemplar assertion —
      the cascading auth-break above); third attempt: full SMOKE: PASS,
      every SPEC-OP-002~030 assertion green. Stack torn down clean (all
      volumes removed correctly on this run). Verified 2026-09-01.
    result: >
      Closes the infrastructure-level gap SPEC-OP-018 explicitly deferred.
      Real postgres_exporter + RabbitMQ's own built-in Prometheus plugin
      genuinely scraping, proven via real per-exporter metrics. A dedicated,
      throwaway infra pair added as a deliberate architecture decision. Two
      real bugs found via live verification, not static review (BusyBox
      wget incompatibility; cascading auth breakage across 3 internal
      integrations). This closes phase-06 (SPEC-OP-025 through SPEC-OP-029)
      of the observability-platform domain roadmap in full. Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-029-traceability.md
