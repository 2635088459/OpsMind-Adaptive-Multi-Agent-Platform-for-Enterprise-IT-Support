SPEC-OP-011:
  domain: 08-observability-platform
  name: Collector Batch Retry And Backpressure
  cn_name: Collector Batch、Retry 与 Backpressure
  status: implemented
  phase: phase-02-collector-intake-processing
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-001, SPEC-OP-002, SPEC-OP-003, SPEC-OP-004, SPEC-OP-005, SPEC-OP-006, SPEC-OP-007, SPEC-OP-008, SPEC-OP-009, SPEC-OP-010]
  tech_stack: "OTel Collector file_storage extension (WAL) + exporterhelper sending_queue/retry_on_failure / Prometheus recording+alert rules against REAL verified self-metrics / Docker named volume / Docker Compose"
  implementation_notes: >
    batch (SPEC-OP-002), sending_queue + retry_on_failure (SPEC-OP-002), and
    memory_limiter (SPEC-OP-002) already existed; this spec's real net-new work is
    WAL persistence + drop-accounting observability + a genuine, PROVEN outage/
    recovery test — not a rebuild of what already existed.
    WAL: new `file_storage` extension (directory /var/lib/otelcol/file_storage,
    create_directory: true) + `sending_queue.storage: file_storage` on BOTH
    otlp/tempo and otlphttp/loki (num_consumers: 10 added too) — the queue survives
    a collector restart/redeploy instead of silently losing whatever was buffered.
    New docker-compose named volume otel-collector-queue-data backs it.
    Found+fixed a REAL permission bug getting this far: the otelcol-contrib image's
    default nonroot user cannot write a freshly-created docker volume's root-owned
    mount point ("permission denied" on first start) — fixed with `user: "0:0"` on
    the otel-collector service (numeric, not "root" by name — the scratch-based
    image has no /etc/passwd to resolve a name against; same class of fix already
    used for the prometheus service, just needed the numeric form here).
    PROVEN, not assumed: manually stopped Tempo, pushed a trace tagged
    opsmind.smoke_test=true (a plain OK/fast trace would have only a 10% chance of
    surviving SPEC-OP-010's probabilistic policy independent of the outage — a
    methodology mistake caught mid-test and corrected before drawing any conclusion),
    confirmed real retry_sender.go log lines ("Exporting failed. Will retry...") and
    that the collector stayed healthy throughout, then restarted Tempo and confirmed
    the trace arrived. This is the WAL/retry contract working end to end, not a
    config that merely `validate`s.
    Drop accounting: discovered the REAL available self-metrics by querying a live
    collector's :8888/metrics rather than assuming names (`otelcol_exporter_queue_size`
    /`_queue_capacity`, `otelcol_exporter_send_failed_spans` /`_sent_spans` — only
    registered once an actual send/failure event occurs, `otelcol_receiver_refused_spans`
    — the genuine throttling/backpressure signal per ADR-0004, and
    `otelcol_processor_tail_sampling_sampling_trace_dropped_too_early` from
    SPEC-OP-010). New rules/recording/collector-resilience.yml (3 recording rules:
    queue utilization ratio, export-failure rate, receiver-refusal rate) +
    rules/alerting/collector-resilience.yml (CollectorExportFailing,
    CollectorQueueNearCapacity, CollectorReceiverThrottling) + runbook
    CollectorBackpressure.md. Load budgets: local overlay's existing queue_size 400 /
    max_elapsed_time 60s (vs base 1000/120s) IS the load-budget floor-vs-local
    pattern already established by every other component overlay; no change needed,
    just now formally covered by this spec's rules.
  lld_mapping:
    - 09-concurrency-and-idempotency
    - 10-failure-handling
    - 12-observability
  forbidden:
    - business_state_mutation
    - silent_telemetry_loss_on_restart
    - unbounded_queue_growth
  artifacts:
    enforcement:
      - infrastructure/observability/collector/base/config.yaml
      - infrastructure/docker-compose/observability-stack.yml
    rules_runbook:
      - infrastructure/observability/rules/recording/collector-resilience.yml
      - infrastructure/observability/rules/alerting/collector-resilience.yml
      - infrastructure/observability/runbooks/CollectorBackpressure.md
    tooling:
      - .github/workflows/observability-platform-ci.yml
      - scripts/observability-stack.sh
  test_evidence:
    lint: "validate-observability-layout.py 0 err (3 audit_ref warnings, cleared by this file); validate-telemetry-governance.py / validate-signal-contracts.py / validate-collector-pipeline.py all unaffected 0/0; otelcol validate exit 0 (after fixing a missing create_directory: true); promtool check rules SUCCESS (3 recording + 3 alerting)"
    unit: "scripts/tests — 60 passed (unaffected by this spec; no new Python validator needed since WAL/queue config is exporterhelper/extension config, not a new contract type)"
    integration: >
      Manual outage/recovery drill (not scripted into `smoke`, since it requires
      stopping/starting a sibling container mid-test): stopped opsmind-tempo, pushed
      an opsmind.smoke_test=true-tagged trace, confirmed real retry log lines and a
      still-healthy collector, restarted opsmind-tempo, confirmed the trace arrived
      in Tempo ~15s later. scripts/observability-stack.sh smoke — SMOKE: PASS
      separately confirms (new assertions): the collector-resilience recording rule
      evaluates in Prometheus, and otelcol_exporter_queue_capacity is a real scraped
      series (not a metric name that was merely assumed to exist). Every
      SPEC-OP-002~010 assertion in the same smoke run stayed green under `user:
      "0:0"` + the WAL-backed queue. Stack torn down clean. Verified 2026-08-31.
    result: >
      The Collector's own resilience (batch/queue/retry/WAL/backpressure) is real,
      proven against an actual backend outage and restart, and observable via rules
      whose metric names were verified live rather than assumed. This closes
      phase-02 (Collector Intake And Processing, SPEC-OP-008~011) for domain 08.
      Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-011-traceability.md
