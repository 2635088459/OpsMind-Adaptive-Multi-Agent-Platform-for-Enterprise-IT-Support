SPEC-OP-025:
  domain: 08-observability-platform
  name: Identity And Ticket Observability Contract
  cn_name: 身份与工单可观测性契约
  status: implemented
  phase: phase-06-cross-domain-contracts
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-006, SPEC-OP-020]
  tech_stack: "New metric-naming.yaml namespaces + Collector cardinality regex + recording/alerting rules + a new dashboard, over domain 01's real MicrometerIdentityMetrics and domain 02's real TicketTelemetry"
  implementation_notes: >
    Concrete objective: "Contract identity security and ticket business
    signals with bounded labels and trace fields." Investigated first (per
    this domain's standing practice): user-access-authentication-service
    already has a real, fully-wired IdentityMetricsPort/MicrometerIdentity
    Metrics (SPEC-UA-030/032 — 6 metrics: identity_authorization_decision_total,
    identity_role_assignment_total, identity_session_total,
    identity_step_up_total, identity_jwks_degraded_fallback_total,
    identity_outbox_pending_count) and ticket-workflow-service already has a
    real, fully-wired TicketTelemetry (183 distinct Counter/Timer/
    DistributionSummary registrations across ticket lifecycle, support-queue
    authorization, and several policy-gate sub-capabilities). Neither was ever
    contracted in metric-naming.yaml, queried by any dashboard, or alerted on
    — SPEC-OP-017's DomainOperationalOverview dashboard only ever queries the
    generic http/db/amqp/agent/evaluation golden-signal metrics, confirmed by
    reading its own PromQL targets before writing anything.
    REAL DESIGN FINDING: ticket-workflow-service's metrics all share the
    literal prefix `opsmind_` (e.g. `opsmind_ticket_created_total`,
    `opsmind_support_queue_authorization_decisions_total`), unlike every other
    domain's clean single-word self-namespacing (`identity_`, `agent_`,
    `evaluation_`, `tool_`, `approval_`, `memory_`, confirmed by grepping every
    other service). validate-signal-contracts.py's namespace-prefix check
    extracts a metric's namespace as its FIRST underscore-delimited segment
    (`name.split("_", 1)[0]`) — for all 183 of these metrics that segment is
    literally `opsmind`, not `ticket`. Registering a namespace named `ticket`
    would never match any of them. Rather than rename another domain's 183
    already-shipped, already-tested metrics after the fact (`preserves source-
    domain semantic ownership`, 12-observability §Cross-domain boundary), the
    namespace is named `opsmind` — matching the real, already-shipped
    convention exactly, with a comment in metric-naming.yaml explaining why.
    Added `metric-naming.yaml` namespaces `identity` (allowed_labels: effect,
    action, outcome; forbidden: user_id, session_id, token, email, subject)
    and `opsmind` (allowed_labels: the 19 real tag keys grepped from
    TicketTelemetry.java; forbidden: ticket_id, requester_id, event_id,
    idempotency_key, user_id — reusing that file's own stated javadoc
    constraint verbatim). Mirrored both in
    governance/telemetry-governance.yaml's cardinality_budgets (required for
    validate-signal-contracts.py's cross-check). Extended the Collector's
    `transform/metric-cardinality` OTTL delete_matching_keys regex with the 5
    newly-forbidden labels not already covered by an existing pattern (token,
    subject, event_id, idempotency_key, requester_id) — proven the validator's
    OWN incidental text-match (checking whether a forbidden-label string
    merely appears anywhere in the whole config file, not specifically inside
    the enforcement regex) would have silently let `token` through as
    "covered" without a real fix, since the substring "token" already appears
    elsewhere in the file (the `bearertokenauth` extension name) — added it to
    the real regex anyway rather than relying on that coincidence.
    New rules/recording/identity-ticket-business.yml
    (identity:authorization_denial:ratio5m, opsmind:ticket_event_dlq:rate5m) +
    rules/alerting/identity-ticket-business.yml (HighIdentityAuthorizationDenialRate
    warning >50% DENY ratio for 10m; TicketEventDeadLettered critical/paging,
    any sustained DLQ rate for 5m) + runbooks/IdentityTicketBusinessSignals.md
    (one file covering both alerts, same grouping convention as
    SloBurnRateAlerts.md) + new dashboards/identity-ticket-business-signals.json
    (2 new fixtures added to signals/fixtures/metric-naming/, incl. one
    nonconformant fixture proving the new opsmind namespace's forbidden-label
    check actually rejects a real forbidden label).
    Caught and fixed a real bug in the dashboard draft itself before shipping:
    grepped every TicketTelemetry.java `.tag(...)` call to verify the EXACT
    label key on each specific metric rather than assume — found the first
    draft's "Support-queue authorization decisions" panel grouped by `outcome`,
    but `opsmind_support_queue_authorization_decisions_total` actually only
    ever carries `decision_code`; fixed before it ever reached a live query.
    PROVEN end-to-end via a real docker-compose smoke test: pushed real
    identity_authorization_decision_total{effect=DENY}=8/{effect=ALLOW}=2 and
    opsmind_ticket_event_dlq_total=3, each ALSO carrying one forbidden label
    (subject / ticket_id respectively) in the same push — confirmed the exact
    raw counts (8, 3) reached Prometheus while the forbidden labels did NOT,
    proving the cardinality guard's real enforcement rather than just a
    config-shape check. Both new recording rules and both new alerts confirmed
    loaded/query-valid via Prometheus's own API; every SPEC-OP-002~023
    assertion in the same run stayed green.
    RECOVERY NOTE: this spec was rebuilt in full a second time after a
    mid-session branch checkout silently discarded the first (uncommitted)
    build — see SPEC-OP-024's own traceability doc for the incident, and this
    session's memory files for the corrective process (commit after every
    spec from this point forward).
    Trace-field correlation ("trace fields" in the objective) is not new work
    here — this domain's platform-wide trace-context propagation
    (SPEC-OP-004/005) and per-domain log/trace drilldown pattern
    (SPEC-OP-017's dashboard) already cover it generically for every producing
    service, identity/ticket included; stated here explicitly rather than
    silently assumed.
  lld_mapping:
    - 01-domain-model
    - 07-data-model
    - 11-security
  forbidden:
    - business_state_mutation
    - unbounded_metric_label
    - renaming_another_domains_already_shipped_metric
  artifacts:
    contract:
      - infrastructure/observability/signals/metric-naming.yaml
      - infrastructure/observability/governance/telemetry-governance.yaml
    enforcement:
      - infrastructure/observability/collector/base/config.yaml
      - infrastructure/observability/rules/recording/identity-ticket-business.yml
      - infrastructure/observability/rules/alerting/identity-ticket-business.yml
    rules_runbook:
      - infrastructure/observability/runbooks/IdentityTicketBusinessSignals.md
      - infrastructure/observability/dashboards/identity-ticket-business-signals.json
    tooling:
      - infrastructure/observability/signals/fixtures/metric-naming/conformant-identity-counter.json
      - infrastructure/observability/signals/fixtures/metric-naming/conformant-opsmind-ticket-counter.json
      - infrastructure/observability/signals/fixtures/metric-naming/nonconformant-opsmind-forbidden-label.json
      - scripts/observability-stack.sh
      - .github/workflows/observability-platform-ci.yml
  test_evidence:
    lint: "validate-observability-layout.py 0 err (audit_ref cleared by this file); validate-signal-contracts.py 0 err/0 warn; validate-dashboards.py 0 err; validate-rule-catalog.py 0 err; promtool check rules SUCCESS (2 recording + 2 alerting)"
    unit: "scripts/tests — 82 passed, unaffected (no validator LOGIC changed, only data: new namespaces/fixtures/rules/dashboard)"
    integration: >
      scripts/observability-stack.sh smoke — SMOKE: PASS. Pushed real
      identity_authorization_decision_total{effect=DENY}=8/{effect=ALLOW}=2 and
      opsmind_ticket_event_dlq_total=3 (each with one forbidden label riding
      along); confirmed exact raw counts reached Prometheus (8, 3) while
      'subject' and 'ticket_id' did not — the cardinality guard proven live,
      not just config-shape-checked. Both new recording rules query-valid;
      both new alerts (HighIdentityAuthorizationDenialRate,
      TicketEventDeadLettered) loaded. Every SPEC-OP-002~029 assertion in the
      same run stayed green (including SPEC-OP-029/030's own real basic-auth
      gate and RBAC verification, all built later in the same domain).
      Stack torn down clean. Verified 2026-08-31/09-01.
    result: >
      Two real, already-shipped, previously-uncontracted business-metric
      surfaces (identity: 6 metrics; ticket: 183 metrics) are now bounded-
      label-contracted, recorded, dashboarded, and alerted for the first time
      — closing the one genuine gap in this objective without inventing
      fictitious metrics or asking another domain to rename already-tested
      code. A real multi-word-prefix limitation in the namespace-matching
      convention was found and resolved honestly (namespace named `opsmind`,
      matching reality) rather than silently worked around. Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-025-traceability.md
