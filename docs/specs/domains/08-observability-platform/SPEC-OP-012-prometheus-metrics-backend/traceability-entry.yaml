SPEC-OP-012:
  domain: 08-observability-platform
  name: Prometheus Metrics Backend
  cn_name: Prometheus Metrics 后端
  status: implemented
  phase: phase-03-telemetry-backends-retention
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-001, SPEC-OP-002, SPEC-OP-003, SPEC-OP-004, SPEC-OP-005, SPEC-OP-006, SPEC-OP-007, SPEC-OP-008, SPEC-OP-009, SPEC-OP-010, SPEC-OP-011]
  tech_stack: "Prometheus v3.1.0 file_sd_configs + storage.tsdb.wal-compression / promtool / real live discovery verification against a running instance / Docker Compose"
  implementation_notes: >
    Scrape/WAL/TSDB/rules/retention already existed from SPEC-OP-002; this spec's
    real net-new work is DISCOVERY (the one genuinely missing piece the goal names)
    + WAL compression + TSDB-integrity self-monitoring, plus an explicit, deliberate
    non-decision on authentication.
    Discovery: converted all 6 non-self scrape targets from static_configs to ONE
    file_sd_configs job (`file-sd-observability-platform`) globbing
    prometheus/base/file_sd/*.json, one small JSON file per component, each
    carrying its own "labels":{"job":...} which overrides the shared job_name
    default. First draft used a SEPARATE file_sd_configs per job_name (one file each)
    — this technically worked but defeated the actual point: a genuinely NEW target
    class (the postgres_exporter/rabbitmq_exporter/node_exporter SPEC-OP-018/029 will
    add) would still need a NEW scrape_config block + restart under that design.
    Redesigned to the single-glob form and PROVED, live against a running
    Prometheus: (a) existing job labels are byte-identical to the old static config
    (queried `up` before/after — same 7 series, same job values); (b) dropping a
    brand-new target file while Prometheus was running produced a new series with
    its own distinct job label within one refresh_interval, with zero prometheus.yml
    edit or restart; (c) deleting that file removed it from active targets just as
    fast. This is the mechanism SPEC-OP-018/029 now literally just drop a file into.
    WAL compression: `--storage.tsdb.wal-compression` added (standard, low-risk,
    real disk/IO reduction for any non-trivial ingest rate).
    TSDB self-monitoring: new rules/recording+alerting/prometheus-tsdb.yml against
    `prometheus_tsdb_wal_corruptions_total` / `prometheus_tsdb_compactions_failed_total`
    — confirmed present (both `0`, healthy) on a real running instance before
    writing the rule, not assumed. `PrometheusTsdbWalCorruption` is `critical`
    (WAL corruption is real potential data loss on Prometheus, the platform's sole
    metrics backend — ADR-0002); `PrometheusTsdbCompactionsFailing` is `warning`.
    Authentication — deliberately NOT added here: SPEC-OP-030 (Observability Access
    Control) explicitly owns cross-component query/view RBAC; bolting ad-hoc
    basic_auth onto Prometheus alone now would be redone once that spec defines the
    real model. Documented this scope boundary directly in prometheus.yml's own
    header rather than silently skipping the goal's word "authentication".
    remote-write — `--web.enable-remote-write-receiver` was already enabled since
    SPEC-OP-002 but never had a real producer or a real test; left as-is (harmless,
    standard federation/migration flexibility) rather than manufacture a synthetic
    protobuf/snappy test for a capability nothing in this repo currently exercises —
    an honest "nothing to prove yet" is recorded, not a fabricated pass.
    Capacity (container resource limits) was already fully covered per-component
    since SPEC-OP-002 (checked, not re-done).
  lld_mapping:
    - 07-data-model
    - 09-concurrency-and-idempotency
    - 12-observability
  forbidden:
    - business_state_mutation
    - static_config_target_management
    - silent_job_label_change
  artifacts:
    enforcement:
      - infrastructure/observability/prometheus/base/prometheus.yml
      - infrastructure/observability/prometheus/base/file_sd/otel-collector.json
      - infrastructure/observability/prometheus/base/file_sd/alertmanager.json
      - infrastructure/observability/prometheus/base/file_sd/loki.json
      - infrastructure/observability/prometheus/base/file_sd/tempo.json
      - infrastructure/observability/prometheus/base/file_sd/grafana.json
      - infrastructure/docker-compose/observability-stack.yml
    rules_runbook:
      - infrastructure/observability/rules/recording/prometheus-tsdb.yml
      - infrastructure/observability/rules/alerting/prometheus-tsdb.yml
      - infrastructure/observability/runbooks/PrometheusTsdbCapacity.md
    tooling:
      - .github/workflows/observability-platform-ci.yml
      - scripts/observability-stack.sh
  test_evidence:
    lint: "validate-observability-layout.py 0 err (3 audit_ref warnings cleared by this file); other 3 validators unaffected 0/0; promtool check config SUCCESS; promtool check rules SUCCESS (2 recording + 2 alerting)"
    unit: "scripts/tests — 60 passed, unaffected (no new Python contract type; this is Prometheus's own config, not a producer signal contract)"
    integration: >
      Live discovery proof (beyond scripted smoke): confirmed `up{job=...}` returned
      the same 7 series/labels after switching static_configs -> file_sd_configs;
      dropped a new target JSON file into file_sd/ while Prometheus was RUNNING and
      confirmed a new `up{job="discovery-probe-test"}` series appeared within one
      15s refresh_interval with no restart; deleted the file and confirmed the
      target left the active-targets list just as fast. scripts/observability-stack.sh
      smoke — SMOKE: PASS, new assertions: all 7 file_sd + self-scrape targets up
      with correct job labels, and the prometheus-tsdb recording rule evaluates.
      Every SPEC-OP-002~011 assertion in the same run stayed green. Stack torn down
      clean. Verified 2026-08-31.
    result: >
      Scrape target management is now GitOps-file-driven and provably hot-reloadable,
      with zero change to existing job labels/rules/dashboards that key on them; WAL
      compression and TSDB-integrity alerting are real and verified against live
      self-metrics. Authentication and remote-write are explicit, reasoned
      non-decisions, not silent gaps. Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-012-traceability.md
