SPEC-OP-034:
  domain: 08-observability-platform
  name: Outage Backlog Drop And Recovery
  cn_name: 故障、积压、丢弃与恢复
  status: implemented
  phase: phase-08-self-monitoring-recovery-degraded-mode
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-002, SPEC-OP-006, SPEC-OP-011, SPEC-OP-033]
  tech_stack: "Live docker kill/exec/tmpfs drills against the real running stack + one new visibility-only Prometheus disk-capacity recording rule (no fabricated Loki/Tempo threshold) + ADR-0010 stating this domain's first-ever concrete RTO/RPO targets"
  implementation_notes: >
    Concrete objective: "Exercise outages, disk/cardinality/backlog/drop
    with business fail-open, RTO/RPO, and recovery." Closes phase-08.

    Investigated first: backlog/drop (SPEC-OP-011's WAL/sending_queue) and
    cardinality budgets (SPEC-OP-006's MetricSeriesBudgetExceeded/
    HighCardinalityJob/ForbiddenMetricLabel) were already real mechanisms —
    but cardinality's own SPEC-OP-006 traceability doc recorded the alerts
    only ever as "inactive" (real traffic never approached the thresholds)
    — meaning the alert LOGIC had never actually been proven to fire. No
    RTO/RPO target existed anywhere in this domain before this spec.

    5 real, live drills executed against the running stack (not simulated):

    Drill 1 (business fail-open): `docker kill opsmind-tempo`, immediately
    pushed a real trace to the Collector -> 200. Producer never blocked
    during a real, total backend outage (ADR-0004), independent of any
    RTO/RPO target.

    Drill 2 (the real crash-recovery finding -- self-caught assumption
    error): expected `restart: unless-stopped` to auto-recover a killed
    container. It did NOT: Exited(137) persisted 16+s with no restart.
    Root cause understood: Docker treats an operator-issued stop/kill as
    intentional, not eligible for the restart policy (documented, correct
    Docker behavior, not a config bug). Attempted the alternative
    (`docker exec ... kill -9 1`, simulating a genuine in-process crash)
    -- did not conclusively reproduce a restart either (StartedAt/PID
    unchanged); root cause not further chased (diminishing returns for
    this spec's scope) but the practical, honest conclusion is unaffected:
    this Docker Compose topology has NO fully-automatic crash recovery for
    an operator-triggered stop, only a triggered `docker compose ... up -d
    --force-recreate <service>` (proven repeatedly this session to reach
    healthy in 10-20s). RTO is stated honestly against THAT model
    (ADR-0010), not a fabricated "self-healing" claim.

    Drill 3 (disk/ENOSPC): the real shared host volume (223GB total, 182GB
    free) could not safely be filled. Proved the identical OS-level
    failure mode in an isolated, safe tmpfs instead (`docker run --rm
    --tmpfs /test:size=5m alpine ...dd...` -> real "No space left on
    device", exit 1) -- every one of Prometheus/Loki/Tempo is a standard
    Go app on local ext4/overlay storage (ADR-0002) and would hit this
    identical error on any write once genuinely full. New
    rules/recording/disk-capacity.yml : prometheus:storage_bytes:total
    (Prometheus's own real prometheus_tsdb_storage_blocks_bytes +
    prometheus_tsdb_wal_storage_size_bytes -- confirmed live before use).
    Deliberately NO alert threshold and NO equivalent for Loki/Tempo: they
    expose per-chunk/per-block size histograms but no real total-storage-
    bytes gauge as of the pinned versions (loki 3.3.2 / tempo 2.7.1),
    confirmed by inspecting their live /metrics -- inventing a threshold
    with no real production volume size to ground it in would have been
    fake enforcement.

    Drill 4 (cardinality budget genuinely trips): pushed 60 real distinct
    series (op_034_cardinality_drill_total{case=...}), confirmed landed;
    temporarily lowered HighCardinalityJob's threshold from 20000 to 100
    (below the real job:series:count value of 524) in the LIVE rules file,
    POST /-/reload, confirmed via /api/v1/rules the alert genuinely
    transitioned to "pending" (not just present in a file); reverted the
    threshold back to 20000, reloaded again, confirmed it returned to
    "inactive" on the next evaluation; `git diff` confirmed the committed
    file was never actually changed by the live edit.

    Drill 5 (backlog/drop bound): NOT re-proven from scratch -- already
    real and proven live under SPEC-OP-011's own build and re-confirmed
    multiple times since (SPEC-OP-032, SPEC-OP-033); referenced, not
    duplicated.

    New ADR-0010: RPO 60s (local tuning; an outage shorter than this loses
    zero telemetry via the WAL), RTO 5m (bounded by SyntheticProbeFailing's
    own paging threshold, assuming a human/automation runs the documented
    recovery command -- explicitly NOT a fully-automatic number, per
    Drill 2's finding). New runbook OutageAndRecoveryDrill.md documents all
    5 drills + the targets. New dashboard panel for
    prometheus:storage_bytes:total.
  lld_mapping:
    - 10-failure-handling
    - 12-observability
  forbidden:
    - business_state_mutation
    - fabricating_an_automatic_crash_recovery_claim_that_was_not_actually_observed
    - inventing_a_disk_threshold_with_no_real_volume_size_to_ground_it_in
  artifacts:
    contract:
      - infrastructure/observability/docs/adr/0010-outage-recovery-rto-rpo-targets.md
    enforcement:
      - infrastructure/observability/rules/recording/disk-capacity.yml
    rules_runbook:
      - infrastructure/observability/runbooks/OutageAndRecoveryDrill.md
      - infrastructure/observability/dashboards/observability-platform-self.json
    tooling:
      - scripts/observability-stack.sh
  test_evidence:
    lint: "validate-observability-layout.py 0 err/0 warn (transient audit_ref warnings resolved once this doc existed); validate-telemetry-governance.py/validate-signal-contracts.py/validate-collector-pipeline.py/validate-config-change-audit.py all 0 err/0 warn, unaffected; validate-dashboards.py 0 err/1 pre-existing warn; validate-rule-catalog.py 0 err/13 warn (12 pre-existing + 1 new expected orphaned-runbook for OutageAndRecoveryDrill.md, same accepted category as ConfigurationChangeRollback.md/ObservabilityAccessControl.md); promtool check rules: disk-capacity.yml SUCCESS"
    unit: "scripts/tests — 88 passed, unaffected (no validator logic touched by this spec)"
    integration: >
      scripts/observability-stack.sh smoke — SMOKE: PASS, every
      SPEC-OP-002~033 assertion green (survived being the target of
      repeated live kill/exec/reload drills throughout this spec's own
      build) plus a new prometheus:storage_bytes:total assertion. The 5
      drills themselves (business fail-open, the crash-recovery finding,
      disk ENOSPC, cardinality trip, backlog/drop reuse) were executed as
      one-off live proofs against the running stack, documented command-
      by-command in the traceability doc and runbook rather than baked
      into the repeatable smoke suite (several are destructive/temporary
      by nature — a live threshold edit, a killed container). Stack torn
      down clean. Verified 2026-09-01.
    result: >
      This domain now has concrete, real RTO (5m, honestly bounded by a
      triggered — not automatic — recovery action) and RPO (60s, backed by
      the Collector's own proven WAL mechanism) targets for the first time,
      plus live proof of business fail-open, a genuinely tripped (not
      merely idle) cardinality-budget alert, a safe real demonstration of
      the disk-full failure mode, and an honest, corrected understanding of
      this topology's actual (non-automatic) crash-recovery model — a real
      assumption this spec's own investigation caught and fixed rather
      than asserting a self-healing capability that was not actually
      observed. Closes phase-08-self-monitoring-recovery-degraded-mode.
      Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-034-traceability.md
