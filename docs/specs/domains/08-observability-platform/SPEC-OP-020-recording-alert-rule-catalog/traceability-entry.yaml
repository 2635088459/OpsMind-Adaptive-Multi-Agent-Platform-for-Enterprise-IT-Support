SPEC-OP-020:
  domain: 08-observability-platform
  name: Recording And Alert Rule Catalog
  cn_name: Recording 与 Alert Rule Catalog
  status: implemented
  phase: phase-05-alerts-slos-runbooks
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-006, SPEC-OP-016]
  tech_stack: "Prometheus recording+alerting rules against the http.* namespace / new scripts/validate-rule-catalog.py (per-rule content validation, not just file headers) / a human-readable CATALOG.md"
  implementation_notes: >
    Opens phase-05. Two real gaps closed: (1) no alert existed yet for the
    BUSINESS request path itself — every prior spec's rules covered the
    PLATFORM's own health (Collector/Prometheus/Loki/Tempo internals), never the
    http.* golden signals SPEC-OP-016's own dashboard already queries; (2) nothing
    had ever validated the CONTENT of an alert rule (severity/owner labels;
    summary/description/runbook_url/dashboard annotations) — only the file-level
    `# meta.*` header (validate-observability-layout.py), and nothing had ever
    cross-checked that a runbook_url actually resolves to a real file.
    New rules/recording/http-server.yml (http:request:rate5m,
    http:error_ratio:rate5m, http:duration:p95) + rules/alerting/http-server.yml
    (HighRequestErrorRate critical >5%, HighRequestLatency warning p95>1s) +
    runbooks/HttpGoldenSignals.md. Renamed the recording rule from
    `http:duration_p95:5m` to `http:duration:p95` mid-build — the new validator's
    own naming-convention check caught that the first name didn't follow
    Prometheus's `level:metric:operation` colon convention.
    New scripts/validate-rule-catalog.py — scans EVERY alert in
    rules/alerting/*.yml AND infrastructure/observability/loki/rules/**/*.yaml
    (Loki's ruler alerts use the identical shape, SPEC-OP-013) for required
    labels/annotations, and resolves every runbook_url against a real file. Found
    2 real things on first run: (a) runbooks/BrokenTracePropagation.md flagged as
    orphaned — investigated and confirmed this is a DELIBERATE, already-documented
    non-decision (the runbook's own text: "There is no dedicated alert (SPEC-OP-005
    §6): ... no clean single-series signal exists" — not a gap, a design choice
    predating this validator); (b) runbooks/StructuredLogContractViolation.md
    initially flagged too, but only because the validator's first draft didn't scan
    Loki's rule directory at all — fixed by adding that scan, which also
    demonstrates the fix actually works (the false positive disappeared). Found+
    fixed a `path.relative_to(REPO)` crash in the validator's own unit tests
    (same class of bug hit twice before in validate-dashboards.py /
    validate-collector-pipeline.py — should have remembered from those, wrote a
    shared `_rel()` helper this time instead of hand-rolling the fix again).
    New rules/CATALOG.md — a human-readable index (file → alerts → severity →
    runbook → spec), explicitly NOT machine-generated/enforced content (only the
    underlying invariants are CI-checked) — kept honest by convention, stated
    plainly in the doc itself.
    PROVEN: pushed real 200+500 http_server_request_duration_seconds datapoints;
    confirmed the recording rules are wired (query succeeds) and the raw per-
    status-code counts are exactly right (200:5, 500:1 — the precise input
    http:error_ratio:rate5m computes from). A rate()-based value assertion was
    tried FIRST and failed (needs 2+ scrapes across the window; a single smoke
    push only produces 1) — corrected to assert on the raw counts instead, the
    same lesson OP-019's loop-intensity panel had already surfaced but not yet
    generalized into how this script's OWN assertions are written.
  lld_mapping:
    - 01-domain-model
    - 11-security
  forbidden:
    - business_state_mutation
    - alert_without_runbook
    - dangling_runbook_reference
  artifacts:
    contract:
      - infrastructure/observability/rules/CATALOG.md
    enforcement:
      - infrastructure/observability/rules/recording/http-server.yml
      - infrastructure/observability/rules/alerting/http-server.yml
    rules_runbook:
      - infrastructure/observability/runbooks/HttpGoldenSignals.md
    tooling:
      - scripts/validate-rule-catalog.py
      - scripts/tests/test_validate_rule_catalog.py
      - .github/workflows/observability-platform-ci.yml
      - scripts/observability-stack.sh
  test_evidence:
    lint: "validate-observability-layout.py 0 err (3 audit_ref warnings, cleared by this file); validate-rule-catalog.py 0 err (1 expected warning — BrokenTracePropagation, confirmed deliberate); promtool check rules SUCCESS (3 recording + 2 alerting)"
    unit: "scripts/tests — 76 passed (9 new for validate-rule-catalog.py, incl. the relative_to bugfix + a Loki-rules-are-scanned regression test)"
    integration: >
      scripts/observability-stack.sh smoke — SMOKE: PASS. Pushed real 200+500
      http_server_request_duration_seconds datapoints; confirmed
      http:request:rate5m is wired/query-valid, the raw per-status-code counts
      are exactly correct (200:5, 500:1), and HighRequestErrorRate is loaded and
      evaluating in Prometheus's own /api/v1/rules. Every SPEC-OP-002~019
      assertion in the same run stayed green. Stack torn down clean. Verified
      2026-08-31.
    result: >
      A real business-request-path alert now exists (not just platform-self-
      monitoring), backed by a validator that checks EVERY alert's content
      (not just file headers) and cross-references every runbook_url against a
      real file — closing a gap this domain had left open since SPEC-OP-002's
      README promises. Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-020-traceability.md
