SPEC-OP-022:
  domain: 08-observability-platform
  name: SLI SLO And Error Budget Model
  cn_name: SLI、SLO 与 Error Budget 模型
  status: implemented
  phase: phase-05-alerts-slos-runbooks
  deployables: [otel-collector, prometheus, loki, tempo, grafana, alertmanager]
  depends_on: [SPEC-OP-006, SPEC-OP-020]
  tech_stack: "Prometheus recording rules implementing the Google SRE error-budget/burn-rate formula against the already-contracted slo.* metric-naming namespace"
  implementation_notes: >
    The first spec to actually populate SPEC-OP-006's slo.* namespace
    (slo_error_budget_ratio / slo_burn_rate_ratio, labels slo/objective/window) —
    contracted since SPEC-OP-006 but never emitted by anything until now.
    Objective: 99% of HTTP requests succeed (non-5xx), evaluated over a 1h window
    — a deliberate LOCAL-scale substitute for a real 28-30 day SLO period (72h
    local retention cannot hold 30 days of data; documented plainly in the rule
    file's own header, not silently implied as the real target).
    slo:http_availability:good_ratio1h = actual success ratio;
    slo_burn_rate_ratio = (1 - good_ratio) / (1 - objective) — how many multiples
    of the sustainable error rate are being consumed; slo_error_budget_ratio =
    clamp_min(1 - burn_rate, 0) — budget remaining, floored at 0 (a fully-consumed
    budget doesn't go negative). These use the EXACT plain (non-colon) names
    metric-naming.yaml's slo namespace already fixed — deliberately NOT
    `level:metric:operation` like this domain's other recording rules;
    validate-rule-catalog.py's naming-convention check is an informational
    warning for precisely this documented exception. New SloErrorBudgetLow alert
    (warning, budget <50% for 30m) — a slow, cumulative-consumption signal,
    explicitly distinct from SPEC-OP-023's fast multi-window burn-rate pages.
    PROVEN with exact arithmetic, not just "a number appeared": pushed
    10 success + 1 failure, waited, pushed 20 success + 2 failure (same series,
    same labels this time — see the two real methodology mistakes below), and
    confirmed slo:http_availability:good_ratio1h = 0.9090909... = EXACTLY 10/11
    (the real delta over the interval); slo_burn_rate_ratio = 9.0909... = EXACTLY
    (1-10/11)/(1-0.99); slo_error_budget_ratio = 0 = EXACTLY
    clamp_min(1-9.09,0). The formula is correct, not just plausible.
    Two real mistakes made and caught during this verification (both are now
    documented lessons, not swept under the rug): (1) a first re-push attempt
    accidentally omitted service.version from the resource attributes, which
    Prometheus's resource_to_telemetry_conversion turns into a DIFFERENT label
    set — splitting what should have been one continuous counter series into two
    unrelated ones, so rate() saw a flat line on each and returned NaN; fixed by
    keeping resource attributes IDENTICAL across repeated pushes to the same
    logical series. (2) even after fixing that, the recording rule still read
    NaN/empty for another ~30-40s — not a bug, but this rule group's own
    `interval: 1m` recording-rule evaluation cadence, entirely separate from
    rate()'s 2-scrape requirement (already understood from SPEC-OP-020); a
    recording-rule-derived value needs BOTH enough raw scrapes for rate() AND the
    next evaluation cycle of the rule itself.
  lld_mapping:
    - 01-domain-model
    - 07-data-model
    - 12-observability
  forbidden:
    - business_state_mutation
    - slo_target_silently_retuned_to_stop_an_alert
  artifacts:
    contract:
      - infrastructure/observability/rules/recording/slo-http-availability.yml
    enforcement:
      - infrastructure/observability/rules/alerting/slo-http-availability.yml
    rules_runbook:
      - infrastructure/observability/runbooks/SloErrorBudget.md
    tooling:
      - .github/workflows/observability-platform-ci.yml
      - scripts/observability-stack.sh
  test_evidence:
    lint: "validate-observability-layout.py 0 err (3 audit_ref warnings cleared by this file); validate-rule-catalog.py 0 err (2 expected naming-convention warnings — documented exception for the slo.* contracted names); promtool check rules SUCCESS (4 recording + 1 alerting)"
    unit: "scripts/tests — 76 passed, unaffected (no new Python contract type)"
    integration: >
      Manual formula-verification drill (beyond scripted smoke, since it needed a
      real incrementing counter over 2 pushes + 2 separate timing windows):
      pushed 10/1 then 20/2 success/failure counts on ONE continuous series and
      confirmed slo:http_availability:good_ratio1h=0.909090..., slo_burn_rate_ratio
      =9.090909..., slo_error_budget_ratio=0 — all matching the exact formula
      arithmetic, not approximately. scripts/observability-stack.sh smoke —
      SMOKE: PASS (wired/query-valid assertions, consistent with SPEC-OP-020's
      single-push limitation); every SPEC-OP-002~021 assertion in the same run
      stayed green. Stack torn down clean. Verified 2026-08-31.
    result: >
      A real, exactly-verified SLO/error-budget model populates the slo.*
      namespace SPEC-OP-006 contracted but nothing had ever emitted. Two genuine
      methodology mistakes (a label-inconsistency series split; recording-rule
      evaluation-interval timing) were made, caught, and fixed during
      verification — recorded as real lessons, not hidden. SPEC-OP-023
      (Multi-Window Burn-Rate Alerts) builds directly on these series next.
      Full evidence:
      docs/traceability/domains/08-observability-platform/SPEC-OP-022-traceability.md
