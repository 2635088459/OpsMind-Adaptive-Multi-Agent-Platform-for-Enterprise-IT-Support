SPEC-EI-020:
  domain: 07-evaluation-improvement
  name: Release Gate Policy Critical Cases
  cn_name: Release Gate Policy 与 Critical Cases
  status: implemented
  service: evaluation-improvement-service
  phase: phase-04-regression-and-release-gate
  tech_stack: "Python 3.12 / FastAPI / Pydantic / SQLAlchemy / Alembic / PostgreSQL / RabbitMQ / LangSmith SDK / OpenTelemetry / pytest"
  implementation_notes: >
    Found already implemented by earlier phase-02/03 work (left `planned` even though
    the code had landed) — `RegressionReport.create()` derives `overall_decision`
    (never caller-settable) as FAILED whenever `critical_failures` is non-empty or any
    zero-tolerance `GateResult` failed (INV-EI-008); `EvaluateReleaseGateService.
    evaluate()` layers a named `GatePolicyConfig`'s own per-dimension thresholds
    (DETERMINISTIC-only, never LLM_JUDGE) strictly on top of that — it can only
    tighten the outcome, never override a critical-case failure to PASSED
    (`upsert_gate_policy()` also refuses to loosen the three zero-tolerance counters
    above zero). SPEC-EI-013's own LangSmith fail-closed check
    (`docs/traceability-entry.yaml` for that spec) composes into the same
    `final_passed` computation. No code changes were needed for this spec during the
    phase-04 audit; verified via the existing/expanded suite.
  lld_mapping:
    - 02-business-invariants
    - 04-use-cases
  forbidden:
    - direct_production_agent_prompt_mutation
    - direct_ticket_state_write
    - direct_workflow_state_write
    - direct_tool_execution
    - direct_memory_content_write
    - policy_approval_ownership_bypass
    - cross_domain_distributed_transaction
  test_evidence:
    unit: services/evaluation-improvement-service/tests/domain/test_regression_report.py
    application: services/evaluation-improvement-service/tests/application/test_evaluate_release_gate_service.py, services/evaluation-improvement-service/tests/contracts/test_safety_gate_determinism_contract.py
    integration: services/evaluation-improvement-service/tests/integration/test_postgres_repositories.py
    contract: pending
    security: pending
    result: >
      177 passed (155 non-integration + 22 real-Postgres integration tests via
      testcontainers, python:3.12-alpine in Docker), 3 import-linter contracts kept,
      0 pyflakes warnings — full suite after SPEC-EI-019 through SPEC-EI-022, verified
      2026-08-29.
