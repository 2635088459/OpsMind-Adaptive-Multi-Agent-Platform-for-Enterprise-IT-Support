SPEC-EI-017:
  domain: 07-evaluation-improvement
  name: Evaluation Score Persistence
  cn_name: Evaluation Score Persistence
  status: implemented
  service: evaluation-improvement-service
  phase: phase-03-graders-and-scoring
  tech_stack: "Python 3.12 / FastAPI / Pydantic / SQLAlchemy / Alembic / PostgreSQL / RabbitMQ / LangSmith SDK / OpenTelemetry / pytest"
  implementation_notes: >
    Closed 08-transaction-and-outbox's own "写 score 时，score 可以按 case 分批提交；每批必须可
    幂等重放" — SPEC-EI-001's own `score_case()` called `ScoreRepository.save()` once
    per dimension (N separate transactions per case). New `ScoreRepository.save_many()`
    (in-memory: same lock, N supersede-then-append writes; Postgres: one session, one
    commit for the whole batch) replaces that loop — every dimension a case grades now
    lands together, replaying idempotently exactly like N individual save() calls
    would (each dimension still only ever has one active row, unchanged from
    SPEC-EI-001's own append/supersede invariant).
  lld_mapping:
    - 07-data-model
    - 08-transaction-and-outbox
  forbidden:
    - direct_production_agent_prompt_mutation
    - direct_ticket_state_write
    - direct_workflow_state_write
    - direct_tool_execution
    - direct_memory_content_write
    - policy_approval_ownership_bypass
    - cross_domain_distributed_transaction
  test_evidence:
    unit: services/evaluation-improvement-service/tests/application
    integration: services/evaluation-improvement-service/tests/integration/test_postgres_repositories.py
    contract: pending
    security: pending
    result: >
