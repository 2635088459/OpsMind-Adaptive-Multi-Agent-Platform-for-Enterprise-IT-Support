SPEC-EI-006:
  domain: 07-evaluation-improvement
  name: Golden Dataset Review Publish
  cn_name: Golden Dataset Review 与 Publish
  status: implemented
  service: evaluation-improvement-service
  phase: phase-01-dataset-and-test-assets
  tech_stack: "Python 3.12 / FastAPI / Pydantic / SQLAlchemy / Alembic / PostgreSQL / RabbitMQ / LangSmith SDK / OpenTelemetry / pytest"
  implementation_notes: >
    "实现 golden dataset 的 review/publish/deprecate 流程，保证 published dataset 不可变" —
    deprecate/archive already existed (SPEC-EI-004) and immutability-after-publish was
    already real (SPEC-EI-001). The real gap: REVIEWING was never a genuine,
    rejectable step of its own — publish() silently auto-elevated a DRAFT dataset
    through REVIEWING in the very same call, so "review" had no observable effect and
    no way to send a dataset back to its author. Closed with a real two-step flow:
    new PublishDatasetUseCase.submit_for_review() (DRAFT -> REVIEWING, 04-use-cases
    UC-EI-001 step 3) and reject_review() (REVIEWING -> DRAFT, records a reason);
    publish() itself now REQUIRES the dataset already be REVIEWING (raises
    InvalidStateTransitionException otherwise) — the old auto-elevate convenience was
    deliberately removed, not merely extended, because a self-caught test proved the
    auto-elevate path let a just-rejected (back-to-DRAFT) dataset be republished
    immediately without ever addressing the rejection, which defeated the entire
    purpose of review. That removal touched 9 existing test files (each needed an
    explicit submit_for_review() call inserted before its own publish() call) — an
    intentional, self-identified breaking change to a pre-existing shortcut, not a
    regression. New REST endpoints: `POST .../submit-review`, `POST .../reject-review`.
    No new migration — reuses the DRAFT/REVIEWING/PUBLISHED status column SPEC-EI-002
    already created.
  lld_mapping:
    - 02-business-invariants
    - 11-security
  forbidden:
    - direct_production_agent_prompt_mutation
    - direct_ticket_state_write
    - direct_workflow_state_write
    - direct_tool_execution
    - direct_memory_content_write
    - policy_approval_ownership_bypass
    - cross_domain_distributed_transaction
  test_evidence:
    unit: services/evaluation-improvement-service/tests/domain/test_dataset.py
    application: services/evaluation-improvement-service/tests/application/test_publish_dataset_service.py
    integration: services/evaluation-improvement-service/tests/integration
    architecture: services/evaluation-improvement-service/tests/architecture
    contract: services/evaluation-improvement-service/tests/contracts
    end_to_end: services/evaluation-improvement-service/tests/test_app.py
    result: "129 passed total (110 non-integration + 19 real-Postgres integration tests via testcontainers), 3 import-linter contracts kept, 0 pyflakes warnings — full suite after SPEC-EI-005 through SPEC-EI-010"
