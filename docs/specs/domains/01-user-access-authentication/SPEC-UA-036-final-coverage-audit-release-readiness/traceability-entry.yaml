SPEC-UA-036:
  domain: 01-user-access-authentication
  name: Final Coverage Audit And Release Readiness
  cn_name: 最终覆盖审计与发布准备
  status: implemented
  service: user-access-authentication-service
  phase: phase-09-final-verification-release
  tech_stack: "Java 21 / Spring Boot 3.5.x / Spring Security 6 / OAuth2 Resource Server + Client / Spring Data JPA / Flyway / PostgreSQL / RabbitMQ / Micrometer + OpenTelemetry Java / Keycloak (external IdP)"
  lld_mapping:
    - 14-testing-strategy
  forbidden:
    - credential_storage
    - custom_oidc_or_mfa_protocol
    - client_forged_role_headers
    - direct_cross_domain_state_write
    - cross_domain_distributed_transaction
  test_evidence:
    unit: passing
    integration: passing
    result: >
      14-testing-strategy's own footer genuinely claims this spec, with
      its own literal scope statement: "SPEC-UA-036 collects traceability
      for all 36 specs, test evidence, residual risks, runbooks, rollback,
      and release sign-off." This closes the entire 01-user-access-authentication
      domain roadmap -- all 36 SPEC-UA-0xx specs are now status: implemented.

      Confirmed all 36 traceability-entry.yaml files are status: implemented
      before writing anything (a real check, not assumed). Rewrote
      services/user-access-authentication-service/README.md end to end --
      it had been frozen at "Phase 00 -- SPEC-UA-001" since the very
      beginning of this domain's own work (an already-stale document,
      exactly the kind of gap a real final-coverage audit exists to catch)
      -- mirroring memory-knowledge-service's own SPEC-MK-032 README
      precedent: Service Purpose, a phase-by-phase Status table (all 10
      phases / 36 specs), Prerequisites, Run Locally/Tests/Migrations,
      a full Configuration Variables table (cross-checked against the
      real application.yml/application-local.yml -- found and fixed one
      real, live inconsistency: OidcIssuerProperties#jwksMaxStale
      (SPEC-UA-032) had no env-var override wired into application-local.yml
      at all, unlike every sibling OIDC property -- added
      OIDC_JWKS_MAX_STALE alongside OIDC_CLOCK_SKEW), the real API surface
      (grepped every real @RestController's own real mappings, not
      recalled from memory), Architecture, a Residual Risks And Deliberate
      Exclusions section (compiled from the real "deliberately did not
      build X" decisions already recorded across SPEC-UA-030 through
      SPEC-UA-034's own traceability entries -- rate-limiting, COMPROMISED/
      TERMINATED session states, the degraded-mode state machine, PII
      field-level encryption, no Keycloak Testcontainers, typ-header
      validation -- a real, honest list, not invented residual risk for
      its own sake), a Runbooks table (every real admin/reconciliation
      endpoint, grepped directly from ReconciliationController/
      OutboxAdminController, with a real "when to call it" line each), a
      Rollback section (this codebase's own real, already-established
      convention: Flyway migrations are forward-only, no down-migrations
      exist anywhere across V001-V014, restore-from-backup is the only
      full-rollback path -- stated plainly rather than inventing rollback
      tooling that does not exist), and a Release Sign-Off statement.

      Deliberately did NOT create a second, separate "final report"
      document alongside the README -- memory-knowledge-service's own
      SPEC-MK-032 precedent consolidated everything into one rewritten
      README.md, and duplicating the same content into two places would
      only risk them drifting out of sync.

      Verified (not assumed) as part of this audit: re-ran the full suite
      standalone after SPEC-UA-035's own harness refactor to produce
      trustworthy final numbers, having first ruled out an unrelated
      false alarm from two concurrent `./mvnw` invocations racing against
      the same target/ directory in this same session -- a real
      methodological lesson worth recording (never run two Maven builds
      concurrently against the same project working directory; always
      confirm a clean, solo run before treating any failure as real).
      Every mandatory security case 14-testing-strategy's own "Mandatory
      security cases" line names has a real, passing proof somewhere in
      this suite: wrong issuer/audience/signature/alg/kid and expired/nbf/
      skew (SecurityConfigJwtDecoderTest), token substitution/replay
      (ManageSessionServiceTest/IdentityPersistenceIT, SPEC-UA-034),
      forged role header (enforced structurally, not by a dedicated test:
      no real request DTO anywhere accepts a client-supplied role/permission
      field to forge in the first place -- RequireIdentityPermissionCommand/
      GrantRoleAssignmentCommand only ever take issuer/subject from the
      caller's own already-verified JWT, SPEC-UA-011), cross-tenant/horizontal/
      vertical escalation (ResourceScopeTest/EvaluateAuthorizationServiceTest,
      SPEC-UA-013/014/015), session fixation/CSRF/open redirect (real
      Authorization Code+PKCE, exact redirect-URI allowlisting,
      SPEC-UA-005), step-up action/resource mismatch and double
      consumption (ApprovalCenterAuthenticationContractIT, SPEC-UA-017/018),
      and JWKS poisoning/refresh storm (OidcDiscoveryClientTest/
      SecurityConfigJwtDecoderTest, SPEC-UA-006/032/034).

      Full ./mvnw clean verify green, run standalone: 258 tests total
      (221 unit/domain/application/ArchUnit + 37 Testcontainers-IT), 0
      failures/errors, BUILD SUCCESS, real Flyway migrations V001-V014
      applying cleanly from empty on every IT fork. Release-ready.
