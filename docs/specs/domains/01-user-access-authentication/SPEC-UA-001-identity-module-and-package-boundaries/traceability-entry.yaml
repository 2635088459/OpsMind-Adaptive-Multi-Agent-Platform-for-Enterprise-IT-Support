SPEC-UA-001:
  domain: 01-user-access-authentication
  name: Identity Module And Package Boundaries
  cn_name: 身份模块与包边界
  status: implemented
  service: user-access-authentication-service
  phase: phase-00-engineering-foundation
  tech_stack: "Java 21 / Spring Boot 3.5.x / Spring Security 6 / OAuth2 Resource Server + Client / Spring Data JPA / Flyway / PostgreSQL / RabbitMQ / Micrometer + OpenTelemetry Java / Keycloak (external IdP)"
  implementation_notes: >
    Hexagonal skeleton delivered under services/user-access-authentication-service
    (package com.opsmind.identity), following 13-package-and-class-design's literal
    package tree almost exactly: domain/{user,role,session,stepup,workload,decision,audit},
    application/{command,query,service,dto,exception,port/{in,out}}, infrastructure/
    {persistence/adapter,keycloak,jwt,messaging,audit,clock,hashing}, api/
    {browser,internal,admin,event,error}, config. All six named primary input ports
    (ProvisionUserUseCase, ManageRoleAssignmentUseCase, ManageSessionUseCase,
    ManageStepUpUseCase, ManageServiceIdentityUseCase, EvaluateAuthorizationUseCase)
    are implemented with real, working logic against SPEC-UA-001-scoped in-memory
    adapters — not stubs: real UserIdentity/RoleAssignment/UserSession/StepUpChallenge/
    ServiceIdentity state machines transcribed from 03-state-machine (not itself in this
    spec's own LLD mapping, the same extension precedent SPEC-PG-001 set for domain 06's
    own module-boundary spec), INV-UA-002 (deny by default) and INV-UA-005 (step-up
    short-lived + replay-resistant) enforced structurally in the domain layer so they
    hold regardless of which future spec drives the surrounding use case, natural-key
    idempotent resolve/grant (issuer+subject, active role+scope, decisionKey+inputHash),
    and a fail-safe (never silently succeed) posture for the not-yet-integrated
    Keycloak/JWT ports (UnavailableOidcProviderAdapter/FailClosedTokenVerifierAdapter).
    Postgres/Flyway (07-data-model) and the real RabbitMQ outbox publisher
    (08-transaction-and-outbox) are intentionally deferred to SPEC-UA-002 (schema
    baseline) and SPEC-UA-003 (outbox/idempotency/audit baseline) — see
    infrastructure.persistence.adapter's InMemory*Repository classes and
    infrastructure.messaging.LoggingEventPublisherAdapter's own javadoc; pom.xml
    deliberately omits spring-boot-starter-data-jpa/flyway/amqp until then. The real
    OIDC browser login flow (api.browser), event consumers (api.event), full claims
    normalization (SPEC-UA-007), multi-IdP account linking (SPEC-UA-008), the complete
    role/permission model (SPEC-UA-011/012), tenant/queue scoping (SPEC-UA-013), the
    full authorization evaluation algorithm — resource-scope/ownership/assurance legs
    (SPEC-UA-014/015/016) — and real Keycloak MFA step-up (SPEC-UA-017/018) are
    explicitly left to their own named specs — see the relevant domain and application
    classes' own javadoc for the specific boundary. 51/51 tests pass (./mvnw test);
    ./mvnw package builds a runnable jar.
  lld_mapping:
    - 13-package-and-class-design
    - 02-business-invariants
  forbidden:
    - credential_storage
    - custom_oidc_or_mfa_protocol
    - client_forged_role_headers
    - direct_cross_domain_state_write
    - cross_domain_distributed_transaction
  test_evidence:
    unit: services/user-access-authentication-service/src/test/java/com/opsmind/identity/domain
    application: services/user-access-authentication-service/src/test/java/com/opsmind/identity/application
    architecture: services/user-access-authentication-service/src/test/java/com/opsmind/identity/architecture
    result: "51 passed (JUnit 5 via ./mvnw test), BUILD SUCCESS, ArchUnit layering + cross-domain-dependency rules kept"
