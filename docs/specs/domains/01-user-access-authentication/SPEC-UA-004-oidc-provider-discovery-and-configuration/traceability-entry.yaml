SPEC-UA-004:
  domain: 01-user-access-authentication
  name: OIDC Provider Discovery And Configuration
  cn_name: OIDC Provider Discovery 与配置
  status: implemented
  service: user-access-authentication-service
  phase: phase-01-oidc-token-trust
  tech_stack: "Java 21 / Spring Boot 3.5.x / Spring Security 6 / OAuth2 Resource Server + Client / Spring Data JPA / Flyway / PostgreSQL / RabbitMQ / Micrometer + OpenTelemetry Java / Keycloak (external IdP)"
  lld_mapping:
    - 05-api-contracts
    - 11-security
  forbidden:
    - credential_storage
    - custom_oidc_or_mfa_protocol
    - client_forged_role_headers
    - direct_cross_domain_state_write
    - cross_domain_distributed_transaction
  test_evidence:
    unit: passing
    integration: passing
    result: >-
      Real OidcDiscoveryClient (fetches/parses the issuer's own
      .well-known/openid-configuration over real HTTP) backs both a real
      KeycloakOidcProviderAdapter#isAvailable (TTL-cached, fails closed on
      unreachable/malformed discovery) and SecurityConfig#jwtDecoder, which
      now builds the JwtDecoder explicitly with a configured jws-algorithm
      allow-list (default RS256) and an opt-in audience validator, replacing
      Spring Boot's implicit autoconfigured one (@ConditionalOnMissingBean
      keeps test overrides working). Verified end-to-end against a real RSA
      keypair + JWKS over real HTTP: accepts a validly-signed token, rejects
      wrong issuer, rejects an HS256 "algorithm confusion" token, rejects an
      unsigned (alg=none-equivalent) token, and rejects/accepts by
      configured audience. requestEndSession stays a documented best-effort
      no-op — real Keycloak end-session needs a live IdP session reference
      INV-UA-001 forbids storing raw, deferred to SPEC-UA-009.
