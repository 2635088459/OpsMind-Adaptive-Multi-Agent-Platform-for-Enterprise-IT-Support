SPEC-UA-010:
  domain: 01-user-access-authentication
  name: Workload And Service Identity
  cn_name: Workload 与 Service Identity
  status: implemented
  service: user-access-authentication-service
  phase: phase-02-user-session-lifecycle
  tech_stack: "Java 21 / Spring Boot 3.5.x / Spring Security 6 / OAuth2 Resource Server + Client / Spring Data JPA / Flyway / PostgreSQL / RabbitMQ / Micrometer + OpenTelemetry Java / Keycloak (external IdP)"
  lld_mapping:
    - 11-security
    - 05-api-contracts
  forbidden:
    - credential_storage
    - custom_oidc_or_mfa_protocol
    - client_forged_role_headers
    - direct_cross_domain_state_write
    - cross_domain_distributed_transaction
  test_evidence:
    unit: passing
    integration: passing
    result: >
      Real scope resolved from the LLD's own spec-mapping footers rather
      than this spec's generic per-spec README (whose "lld_mapping:
      11-security, 05-api-contracts" line does not match ground truth: only
      11-security's own footer actually names SPEC-UA-010; 05-api-contracts'
      and 04-use-cases' footers both omit it, so no endpoint-authority
      enforcement work belongs to this spec — SecurityConfig's own javadoc
      already defers all per-endpoint RBAC/ABAC beyond "authenticated" to
      SPEC-UA-011/012/014). Built the real capability 11-security's own line
      names ("Workloads use client credentials or mTLS with separate
      audiences/scopes and cannot impersonate a human sub") and that
      ServiceIdentity's own pre-existing javadoc explicitly pointed to this
      spec for ("Real client-credentials/mTLS validation is SPEC-UA-010's
      job") since SPEC-UA-001: a new ValidateWorkloadIdentityUseCase/Service
      that turns the ServiceIdentity registry (register/disable/retire
      lifecycle already built by SPEC-UA-001/002/003, but zero real trust
      decision caller) into a genuine INV-UA-002 deny-by-default check.
      Given a caller's own already-verified JWT (issuer/subject/aud/scope —
      never a request body field, 02-business-invariants #7), it resolves
      the matching ServiceIdentity by (tenantId, externalSubject), denies
      unless it is currently ACTIVE and in its validFrom/validUntil window,
      and denies unless the token's aud/scope claims intersect the
      identity's own registered allowedAudiences/allowedScopes allow-lists
      (empty allow-list = unrestricted, non-empty = must intersect — the
      same convention OidcIssuerProperties' own audience validator already
      established for human tokens). On success it calls the previously-
      unwired ServiceIdentity#recordSeen (zero callers anywhere before this)
      and audits SUCCESS; every denial path audits DENIED with a specific
      reason before throwing WorkloadIdentityNotTrustedException (mapped to
      403 FORBIDDEN, matching 05-api-contracts' own "403 trusted identity
      without authority" semantics). The service never touches
      UserIdentityRepository at all, so a workload token can never resolve
      to (or be confused with) a human UserIdentity by construction — the
      literal mechanism behind "cannot impersonate a human sub." Exposed via
      a new self-validation endpoint POST /service-identities/validate on
      the existing ServiceIdentityController (tenantId resolved from the
      same server-side BrowserLoginProperties#defaultTenantId() pattern
      SPEC-UA-005/007 already established for other self-referential
      endpoints, since no per-tenant claim convention exists). New audit
      action SERVICE_IDENTITY_VALIDATED (SUCCESS/DENIED via IdentityAuditAction's
      established single-action-dual-outcome convention). New tests:
      ValidateWorkloadIdentityServiceTest (9 cases — success with matching
      audience/scope, recordSeen wiring, empty-allow-list-is-unrestricted,
      unregistered subject denied, disabled identity denied, not-yet-valid
      window denied, audience-outside-allow-list denied, scope-outside-
      allow-list denied, and an explicit no-UserIdentityRepository-injected
      structural guard against human/workload confusion). Full ./mvnw verify
      green: 110 unit/domain/ArchUnit tests + 7 Testcontainers Postgres IT
      tests, BUILD SUCCESS.
