    result: "349 passed (./mvnw verify: 302 unit + 3 PolicyEvaluationRequestedConsumerIT + 4 TicketApprovalRequiredConsumerIT + 3 ToolApprovalRequiredConsumerIT + 3 WorkflowApprovalRequiredConsumerIT + 4 GovernanceOutboxIT + 28 GovernancePersistenceIT + 2 ApprovalLifecycleE2EIT Testcontainers Postgres/RabbitMQ integration), BUILD SUCCESS. Domain 06: 36/36 specs implemented, 14/14 LLD chapters covered."
