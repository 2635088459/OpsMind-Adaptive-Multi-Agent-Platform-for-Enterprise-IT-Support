SPEC-PG-016:
  domain: 06-policy-approval-governance
  name: Approval Authenticity Step Up
  cn_name: Approval Authenticity 与 Step-Up
  status: implemented
  service: policy-approval-governance-service
  phase: phase-03-security-separation-of-duties
  tech_stack: "Java 21 / Spring Boot 3.5.x / Spring Web MVC / Spring Security / Spring Data JPA / Flyway / PostgreSQL / RabbitMQ / Micrometer + OpenTelemetry Java"
  implementation_notes: >
    Goal: "Implement actor/session/device/reason/MFA marker validation and audit for approval
    commands." 11-security §Approval Authenticity names six required elements of an approval
    command: authenticated actor; session/device metadata; idempotency key; reason; optional
    MFA/step-up marker; correlation id. Four were already real (actor via
    GovernanceRequestContext, idempotency key since SPEC-PG-011, reason via @NotBlank, correlation
    id via required header) — this spec's own job, per domain.approval.ApprovalDecision's own
    pre-existing javadoc ("the full signature/session step-up model is owned by phase-03
    (SPEC-PG-016 ..."), was the remaining two: session/device metadata and the MFA/step-up marker.

    Added ApprovalDecision#sessionId/#deviceId/#stepUpVerified (new migration V017 columns on
    approval_decisions), threaded through DecideApprovalCommand, DecideApprovalRequest (new
    optional API fields), and ApprovalController#decideCommand. sessionId/deviceId are nullable
    and recorded verbatim for the audit trail — 06 has no session store of its own (SecurityConfig
    already runs OAuth2/JWT resource-server auth statelessly, SessionCreationPolicy.STATELESS), so
    it captures what an upstream identity provider reports rather than independently validating a
    live session against one it doesn't have. stepUpVerified defaults false.

    The one real behavioral addition: ApprovalService#decide now structurally requires
    stepUpVerified for a CRITICAL-risk grant (ApprovalNotAuthorizedException otherwise) — the
    narrowest, most defensible reading of "optional MFA/step-up marker" that makes it a real
    security gate rather than inert data collection, and a natural pairing with SPEC-PG-014's own
    risk-level ABAC (both compare against the request's own riskLevel). Denials never need it
    (denying withholds authority rather than granting it); sub-CRITICAL risk levels are left
    ungated since 11-security names no broader threshold.

    Deliberately NOT touched: cancel's own command shape (INV-PG-003 "Approval Must Be Unforgeable"
    is specifically about approval decisions, not the separate cancel action SPEC-PG-012 already
    scoped); any live session/device validation against an identity provider (no session store
    exists in this service to validate against — recording what's reported is the honest scope).

    New tests: 5 new ApprovalServiceTest cases (CRITICAL grant without step-up rejected, CRITICAL
    grant with step-up succeeds, CRITICAL denial never needs step-up, non-CRITICAL grant doesn't
    need step-up, session/device persisted on the ApprovalDecision) plus a new
    approvalDecisionAuthenticityFieldsRoundTripThroughPostgres case in GovernancePersistenceIT for
    migration V017. Every existing ApprovalDecision/DecideApprovalCommand call site across the
    codebase updated for the new constructor shape (nullable session/device, stepUpVerified
    defaulting false in existing fixtures that predate this spec).

    129/129 unit tests pass (./mvnw test, up from 121 after SPEC-PG-015; this tally is shared with
    SPEC-PG-017, implemented in the same pass — see that spec's own entry for the split). Full
    verification (./mvnw verify, Docker available) also passed: 146/146 total (129 unit + 4
    GovernanceOutboxIT + 13 GovernancePersistenceIT Testcontainers Postgres/RabbitMQ integration —
    the +2 GovernancePersistenceIT cases over the SPEC-PG-015 baseline are shared with SPEC-PG-017:
    this spec's own approvalDecisionAuthenticityFieldsRoundTripThroughPostgres plus that spec's own
    governanceAuditPreviousHashRoundTripsAndChainsThroughPostgres). BUILD SUCCESS.
  lld_mapping:
    - 11-security
    - 05-api-contracts
  forbidden:
    - direct_tool_execution
    - direct_ticket_state_write
    - direct_workflow_state_write
    - memory_content_write
    - approval_forgery
    - separation_of_duties_bypass
    - cross_domain_distributed_transaction
  test_evidence:
    unit: services/policy-approval-governance-service/src/test/java/com/opsmind/policygovernance/application/ApprovalServiceTest.java
    integration: services/policy-approval-governance-service/src/test/java/com/opsmind/policygovernance/infrastructure/persistence/GovernancePersistenceIT.java
    result: "146 passed (./mvnw verify: 129 unit + 4 GovernanceOutboxIT + 13 GovernancePersistenceIT Testcontainers Postgres/RabbitMQ integration; shared tally with SPEC-PG-017), BUILD SUCCESS"
